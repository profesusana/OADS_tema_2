 constitucional?","opciones":{"A":"A los trabajadores afiliados a la Seguridad Social y a los pensionistas con residencia fiscal permanente en España.","B":"A los ciudadanos con nacionalidad española y a los turistas comunitarios que presenten tarjeta sanitaria europea.","C":"A todos los españoles y a los ciudadanos extranjeros que tengan establecida su residencia en España.","D":"A las personas empadronadas en municipios con centro de salud propio y cobertura complementaria autonómica."},"correcta":"C","explicacion":"La Ley 14/1986 tiene como objetivo regular todas las acciones que permitan hacer efectivo el derecho a la protección de la salud, reconocido en el artículo 43 y concordantes de la Constitución, de todos los españoles y extranjeros que tengan establecida su residencia en España."},{"id":51,"tema":"2. Sistema Nacional de Salud (SNS)","subtema":"2.1. Concepto, Alma-Ata y Marco normativo","enunciado":"Tras completarse las transferencias sanitarias a las comunidades autónomas en 2002, el Estado aprobó el 28 de mayo de 2003 la Ley 16/2003, de Cohesión y Calidad del SNS. ¿Cuál es su finalidad primordial?","opciones":{"A":"Revertir las competencias hospitalarias autonómicas hacia la Administración Central para unificar presupuestos regionales.","B":"Sustituir los servicios regionales de salud por entidades aseguradoras privadas bajo control de las diputaciones.","C":"Limitar la cartera básica de servicios en aquellas comunidades autónomas que dispongan de menor renta per cápita.","D":"Buscar la colaboración de las Administraciones públicas sanitarias para mejorar el funcionamiento del Sistema Nacional de Salud."},"correcta":"D","explicacion":"La Ley 16/2003, de Cohesión y Calidad del SNS, busca la colaboración de las Administraciones públicas sanitarias con la finalidad de mejorar el funcionamiento del Sistema Nacional de Salud y garantizar derechos comunes a todos los ciudadanos."},{"id":52,"tema":"2. Sistema Nacional de Salud (SNS)","subtema":"2.1. Concepto, Alma-Ata y Marco normativo","enunciado":"¿Qué tres objetivos comunes fija la Ley 16/2003 de Cohesión y Calidad del Sistema Nacional de Salud para configurar el núcleo básico de derechos comunes a todos los ciudadanos?","opciones":{"A":"La equidad, la calidad y la participación en los diferentes ámbitos y mediante instrumentos comunes.","B":"La rentabilidad, la libre competencia y la privatización progresiva de los centros de especialidades.","C":"La concentración urbana, la cotización por riesgo individual y la autonomía presupuestaria municipal.","D":"La beneficencia local, el seguro voluntario complementario y la restricción de la asistencia urgente."},"correcta":"A","explicacion":"La Ley 16/2003 establece la equidad, la calidad y la participación como objetivos comunes; las actuaciones en los diferentes ámbitos y los instrumentos para llevarlas a cabo constituyen el núcleo básico del SNS, proporcionando derechos comunes a todos los ciudadanos."},{"id":53,"tema":"2. Sistema Nacional de Salud (SNS)","subtema":"2.1. Concepto, Alma-Ata y Marco normativo","enunciado":"Un médico de familia analiza el impacto de la Conferencia de Alma-Ata de 1978 en la organización sanitaria posterior en España. ¿Qué conexión directa existe entre aquella conferencia y el modelo actual?","opciones":{"A":"Alma-Ata recomendó financiar la sanidad exclusivamente con pólizas privadas, principio aplicado por la Ley de 2003.","B":"Alma-Ata impulsó el modelo profesional alemán de Bismarck, adoptado íntegramente por la Ley General de Sanidad.","C":"Alma-Ata situó la Atención Primaria comunitaria como eje de los nuevos sistemas, origen de los modernos SNS.","D":"Alma-Ata propuso suprimir los centros de salud rurales para concentrar recursos en grandes complejos hospitalarios."},"correcta":"C","explicacion":"Entre las conclusiones de Alma-Ata (1978) destaca que la Atención Primaria de la salud, dirigida a las comunidades, debe ser el eje de los nuevos sistemas sanitarios, lo que constituyó el origen conceptual de los nuevos Sistemas Nacionales de Salud."},{"id":54,"tema":"2. Sistema Nacional de Salud (SNS)","subtema":"2.1. Concepto, Alma-Ata y Marco normativo","enunciado":"Si ordenamos cronológicamente las normas y acontecimientos fundamentales que configuran el SNS español según el tema, ¿cuál es la secuencia correcta de más antiguo a más reciente?","opciones":{"A":"Ley General de Sanidad — Constitución Española — Conferencia de Alma-Ata — Ley de Cohesión y Calidad.","B":"Constitución Española y Alma-Ata (1978) — Ley General de Sanidad (1986) — Ley de Cohesión y Calidad (2003).","C":"Ley General de Seguridad Social (1974) — Ley de Cohesión y Calidad (1986) — Constitución Española (2003).","D":"Real Decreto-ley 16/2012 — Ley de Cohesión y Calidad (2003) — Ley General de Sanidad (1986)."},"correcta":"B","explicacion":"Tanto la Constitución Española como la Conferencia de Alma-Ata tuvieron lugar en 1978; posteriormente se publicó la Ley General de Sanidad en abril de 1986 y, tras completarse las transferencias autonómicas, la Ley 16/2003 de Cohesión y Calidad el 28 de mayo de 2003."},{"id":55,"tema":"2. Sistema Nacional de Salud (SNS)","subtema":"2.1. Concepto, Alma-Ata y Marco normativo","enunciado":"En relación con el artículo 41 de la Constitución Española, ¿a qué obliga exactamente este mandato constitucional a los poderes públicos?","opciones":{"A":"A mantener un régimen público de Seguridad Social que garantice la asistencia y prestaciones sociales a todos los ciudadanos.","B":"A establecer mutuas obligatorias de funcionarios estatales separadas del Sistema Nacional de Salud en cada provincia.","C":"A transferir obligatoriamente la gestión de los hospitales comarcales a las corporaciones locales antes de 1986.","D":"A concertar al menos la mitad de las pruebas diagnósticas y quirúrgicas con entidades privadas de seguro libre."},"correcta":"A","explicacion":"El recuadro «Mandato constitucional» recoge que, en el Título I, capítulo 3.º, artículo 41 de la Constitución, se establece que los poderes públicos deben mantener un régimen de Seguridad Social que garantice la asistencia y prestaciones sociales a todos los ciudadanos."},{"id":56,"tema":"2. Sistema Nacional de Salud (SNS)","subtema":"2.1. Concepto, Alma-Ata y Marco normativo","enunciado":"¿Qué diferencia funcional existe entre la Ley General de Sanidad de 1986 y la Ley de Cohesión y Calidad de 2003 dentro del marco normativo del SNS?","opciones":{"A":"La ley de 1986 regula exclusivamente la sanidad privada y la ley de 2003 crea las mutualidades administrativas.","B":"La ley de 1986 establece la caja única contributiva y la ley de 2003 elimina los servicios regionales de salud.","C":"La ley de 1986 atribuye las competencias al SEPE y la ley de 2003 transfiere el desempleo a las autonomías.","D":"La ley de 1986 instituye el SNS para hacer efectivo el derecho del art. 43 y la de 2003 refuerza la colaboración y derechos comunes."},"correcta":"D","explicacion":"La Ley 14/1986 sentó las bases para transformar el modelo hacia el SNS y hacer efectivo el derecho del art. 43 de la Constitución; por su parte, la Ley 16/2003 articuló la colaboración entre administraciones públicas sanitarias con los objetivos de equidad, calidad y participación para asegurar derechos comunes."},{"id":57,"tema":"2. Sistema Nacional de Salud (SNS)","subtema":"2.2. Características generales del SNS","enunciado":"Una persona desempleada sin ingresos y sin cotizaciones recientes a la Seguridad Social acude a su centro de salud público para recibir asistencia médica. ¿Qué característica principal del SNS garantiza que sea atendida en las mismas condiciones?","opciones":{"A":"La desconcentración geográfica, que obliga a construir consultorios únicamente en las capitales de provincia.","B":"La libre elección de médico, que permite acudir a cualquier hospital privado sin autorización administrativa previa.","C":"La descentralización financiera, que reserva las prestaciones gratuitas a las autonomías con superávit propio.","D":"La universalidad en la asistencia, que cubre a toda la población al margen de su situación económica o afiliación."},"correcta":"D","explicacion":"La universalidad en la asistencia implica que la asistencia sanitaria se extiende y tiene que cubrir a toda la población sin tener en cuenta su situación económica ni su afiliación a la Seguridad Social."},{"id":58,"tema":"2. Sistema Nacional de Salud (SNS)","subtema":"2.2. Características generales del SNS","enunciado":"Para evitar que los ciudadanos de pequeños municipios rurales tengan que desplazarse grandes distancias hasta la capital, el servicio autonómico abre consultorios y centros de salud próximos a sus domicilios. ¿A qué característica del SNS responde esta medida?","opciones":{"A":"A la atención integrada, centrada exclusivamente en reducir las secuelas tras una intervención quirúrgica compleja.","B":"A la autonomía del paciente, regulada para gestionar el acceso digital a la historia clínica hospitalaria.","C":"A la accesibilidad y desconcentración, que sitúan los servicios cerca del ciudadano evitando la concentración urbana.","D":"A la acción protectora económica, destinada a compensar los gastos de desplazamiento por enfermedad común."},"correcta":"C","explicacion":"La característica de accesibilidad y desconcentración persigue que toda la población acceda en igualdad a las mismas prestaciones y con igual calidad, situando los servicios sanitarios lo más cerca posible del lugar de residencia y evitando que los centros se concentren en los núcleos urbanos."},{"id":59,"tema":"2. Sistema Nacional de Salud (SNS)","subtema":"2.2. Características generales del SNS","enunciado":"Un consejero de sanidad defiende la gestión autonómica de los hospitales y centros de salud frente a un modelo rígido centralizado. ¿Qué dos ventajas concretas aporta la descentralización del SNS según el tema?","opciones":{"A":"Suprime el Consejo Interterritorial y elimina las transferencias procedentes de los Presupuestos Generales del Estado.","B":"Permite que cada municipio fije requisitos médicos propios y cobre primas privadas a los usuarios no afiliados.","C":"Facilita una mayor participación de las CC.AA. en recursos y gasto y adapta mejor los servicios a los usuarios.","D":"Sustituye la Atención Primaria comunitaria por conciertos globales con entidades aseguradoras de ámbito estatal."},"correcta":"C","explicacion":"Según la tabla de características generales del SNS, la descentralización de la gestión y las prestaciones permite una mayor participación de las CC.AA. en la toma de decisiones sobre utilización de recursos y gestión del gasto, además de facilitar una mejor adaptación a las necesidades de salud de los usuarios."},{"id":60,"tema":"2. Sistema Nacional de Salud (SNS)","subtema":"2.2. Características generales del SNS","enunciado":"Al planificar el despliegue de centros de Atención Primaria en una comarca, ¿qué referencia temporal aproximada de desplazamiento desde el lugar de residencia establece el tema para garantizar la disponibilidad de servicios básicos?","opciones":{"A":"Un tiempo máximo aproximado de sesenta minutos mediante transporte interurbano concertado desde cada núcleo.","B":"Un tiempo máximo aproximado de cuarenta y cinco minutos desde cualquier pedanía hasta el hospital de referencia.","C":"Un tiempo máximo aproximado de treinta minutos desde el domicilio hasta la gerencia provincial de salud.","D":"Un tiempo aproximado de unos quince minutos desde el lugar de residencia hasta los servicios básicos."},"correcta":"D","explicacion":"Dentro de la característica «Atención Primaria» se señala que se concede prioridad a la promoción de la salud y prevención de la enfermedad, poniendo a disposición de los ciudadanos una serie de servicios básicos en un tiempo de unos 15 minutos desde su lugar de residencia."},{"id":61,"tema":"2. Sistema Nacional de Salud (SNS)","subtema":"2.2. Características generales del SNS","enunciado":"Un equipo de salud diseña un programa que combina talleres comunitarios de hábitos saludables con diagnóstico precoz, tratamiento médico y rehabilitación posterior de un paciente tras un ictus. ¿Qué característica del SNS refleja mejor esta forma de trabajar?","opciones":{"A":"La desconcentración territorial, que prohíbe ubicar centros de rehabilitación en áreas urbanas densamente pobladas.","B":"La atención integral e integrada, que aborda a la persona como ser biopsicosocial desde la prevención hasta la rehabilitación.","C":"La cobertura poblacional restringida, que circunscribe las prestaciones rehabilitadoras a situaciones de urgencia vital.","D":"La solidaridad de caja única, que unifica los ingresos por tasas municipales con los de las mutuas patronales."},"correcta":"B","explicacion":"La atención integral e integrada considera a la persona como un ser biopsicosocial, prioriza las actividades preventivas y de promoción dirigidas a personas, familias y comunidad y, cuando aparece la enfermedad, realiza actividades diagnósticas, terapéuticas y rehabilitadoras procurando las menores secuelas posibles."},{"id":62,"tema":"2. Sistema Nacional de Salud (SNS)","subtema":"2.2. Características generales del SNS","enunciado":"Un paciente solicita consultar su historia clínica y expresar su consentimiento informado antes de una intervención quirúrgica, además de cambiar de médico de familia dentro de su demarcación territorial. ¿Qué dos leyes respaldan estos derechos?","opciones":{"A":"La Ley General de Seguridad Social de 1974 y el Real Decreto-ley 16/2012 de sostenibilidad financiera.","B":"La Ley de Cohesión y Calidad de 2003 y el Real Decreto Legislativo 8/2015 de mutuas colaboradoras.","C":"El Código de Sociedades de Socorro Mutuo y la Ley de Bases de Régimen Local para servicios sanitarios.","D":"La Ley 14/1986 General de Sanidad y la Ley 41/2002 reguladora de la autonomía del paciente."},"correcta":"D","explicacion":"En el apartado de «Derechos y deberes» del SNS se citan la Ley 14/86 y la Ley 41/2002 (de 14 de noviembre), que fija los derechos y deberes de los usuarios, establece la libre elección de médico dentro de la demarcación territorial y regula la autonomía del paciente e información y documentación clínica."},{"id":63,"tema":"2. Sistema Nacional de Salud (SNS)","subtema":"2.2. Características generales del SNS","enunciado":"En una discusión sobre los derechos del usuario en el SNS, una paciente pregunta si puede elegir cualquier médico de familia de otra comunidad autónoma distinta a la suya sin limitación geográfica. ¿Qué matiz establece el tema respecto a la libre elección de médico?","opciones":{"A":"Es ilimitada en todo el territorio nacional siempre que el facultativo pertenezca a un hospital de referencia.","B":"Queda restringida a quienes hayan suscrito adicionalmente una póliza en una entidad de seguro libre privada.","C":"Se reconoce la libre elección de médico dentro de la correspondiente demarcación territorial del usuario.","D":"Solo se autoriza en Ceuta y Melilla bajo supervisión directa del Instituto Nacional de Gestión Sanitaria."},"correcta":"C","explicacion":"La tabla de características del SNS indica expresamente en la fila «Derechos y deberes» que se fijan los derechos y deberes de los usuarios y se establece la libre elección de médico dentro de la demarcación territorial (Ley 14/86 y Ley 41/2002)."},{"id":64,"tema":"2. Sistema Nacional de Salud (SNS)","subtema":"2.2. Características generales del SNS","enunciado":"¿Qué concepción de la persona fundamenta el principio de «atención integral e integrada» en el Sistema Nacional de Salud español?","opciones":{"A":"La consideración de la persona como un ser biopsicosocial en su entorno familiar y comunitario.","B":"La consideración exclusiva de la persona como trabajador cotizante expuesto a riesgos laborales específicos.","C":"La consideración del ciudadano como cliente de pólizas individuales sujetas a periodo de carencia previo.","D":"La consideración biológica aislada de cada órgano enfermo al margen de los determinantes sociales."},"correcta":"A","explicacion":"El SNS considera a la persona como un ser biopsicosocial, por lo que prioriza la prevención y promoción de la salud hacia personas, familias y comunidad, además de diagnosticar, tratar y rehabilitar procurando reducir las secuelas tras la curación."},{"id":65,"tema":"2. Sistema Nacional de Salud (SNS)","subtema":"2.2. Características generales del SNS","enunciado":"¿Qué aspecto concreto regula la Ley 41/2002, de 14 de noviembre, mencionada como norma complementaria dentro de las características del SNS?","opciones":{"A":"La distribución de impuestos especiales sobre hidrocarburos, alcohol y tabaco entre las autonomías.","B":"La autonomía del paciente y los derechos y obligaciones en materia de información y documentación clínica.","C":"El régimen de concierto obligatorio entre los servicios regionales de salud y las empresas de transporte sanitario.","D":"La inscripción de empresas y el control de altas y bajas laborales en la Tesorería General."},"correcta":"B","explicacion":"El cuadro lateral de la página 7 especifica textualmente que la Ley 41/2002, de 14 de noviembre, regula la autonomía del paciente y derechos y obligaciones en materia de información y documentación clínica."},{"id":66,"tema":"2. Sistema Nacional de Salud (SNS)","subtema":"2.2. Características generales del SNS","enunciado":"Un distrito sanitario concentra el 90 % de sus consultas y medios diagnósticos en la capital provincial dejando sin atención cercana a los pueblos de la sierra. ¿Qué par de características generales del SNS resulta directamente vulnerado por esa decisión?","opciones":{"A":"La accesibilidad y desconcentración de los servicios y la prioridad en Atención Primaria cercana al domicilio.","B":"La financiación por transferencias estatales y el control sanitario de cementerios y policía mortuoria.","C":"La separación de regímenes especiales agrarios y la colaboración con mutuas de accidentes laborales.","D":"El periodo de carencia asegurador y la libre competencia entre compañías mercantiles de seguro libre."},"correcta":"A","explicacion":"Concentrar los centros solo en núcleos urbanos vulnera la accesibilidad y desconcentración (que exige servicios lo más cerca posible del lugar de residencia en igualdad de condiciones) y dificulta disponer de Atención Primaria básica en unos 15 minutos desde el domicilio."},{"id":67,"tema":"2. Sistema Nacional de Salud (SNS)","subtema":"2.3. Cobertura poblacional","enunciado":"En 2013, una mujer adulta extranjera no registrada ni autorizada para residir en España acudió a urgencias tras sufrir una apendicitis aguda. Según el régimen vigente bajo el Real Decreto-ley 16/2012, ¿qué cobertura se le reconocía?","opciones":{"A":"Atención sanitaria completa ordinaria en Atención Primaria y consultas de especialidades sin ninguna limitación.","B":"Asistencia urgente por enfermedad grave o accidente hasta el alta médica, además de embarazo, parto y posparto.","C":"Exclusivamente cobertura farmacéutica básica mediante mutuas de accidentes de trabajo y entidades concertadas.","D":"Denegación total de cualquier asistencia urgente salvo pago previo de una prima anual de seguro libre."},"correcta":"B","explicacion":"El Real Decreto-ley 16/2012 vulneró el derecho universal dejando fuera de la atención ordinaria con cargo a fondos públicos a las personas adultas no registradas ni autorizadas a residir en España, limitando su prestación sanitaria a la asistencia urgente por enfermedad grave o accidente hasta la situación de alta médica, así como a la asistencia durante el embarazo, parto y posparto."},{"id":68,"tema":"2. Sistema Nacional de Salud (SNS)","subtema":"2.3. Cobertura poblacional","enunciado":"¿Qué norma aprobó el Gobierno en julio de 2018 para corregir la restricción de cobertura introducida en 2012 y restablecer el acceso universal al Sistema Nacional de Salud?","opciones":{"A":"La Ley 41/2002 de autonomía del paciente y derechos sobre documentación clínica.","B":"La Ley 16/2003 de Cohesión y Calidad para la colaboración entre administraciones sanitarias.","C":"El Real Decreto Legislativo 8/2015 del texto refundido de la Ley General de Seguridad Social.","D":"El Real Decreto-ley 7/2018, de 27 de julio, sobre el acceso universal al Sistema Nacional de Salud."},"correcta":"D","explicacion":"Ante las peticiones de derogación o modificación formuladas por la UE, la ONU, las CC.AA., el Defensor del Pueblo y otras entidades, en 2018 se aprobó el Real Decreto-ley 7/2018, de 27 de julio, sobre el acceso universal al Sistema Nacional de Salud."},{"id":69,"tema":"2. Sistema Nacional de Salud (SNS)","subtema":"2.3. Cobertura poblacional","enunciado":"De acuerdo con la nueva redacción del artículo 3 introducida por el Real Decreto-ley 7/2018, ¿quiénes pasan a ser titulares del derecho a la protección de la salud y a la atención sanitaria?","opciones":{"A":"Exclusivamente los trabajadores en activo inscritos en el régimen general o en los regímenes especiales.","B":"Únicamente los ciudadanos con nacionalidad española que acrediten cotizaciones acumuladas en los últimos cinco años.","C":"Todas las personas con nacionalidad española y las personas extranjeras con residencia establecida en territorio español.","D":"Solo los ciudadanos comunitarios empadronados y los solicitantes de pólizas privadas sin enfermedades crónicas."},"correcta":"C","explicacion":"Mediante la nueva redacción del artículo 3 establecida por el Real Decreto-ley 7/2018, pasan a ser titulares del derecho a la protección de la salud y a la atención sanitaria todas las personas con nacionalidad española, así como las personas extranjeras que tengan establecida su residencia en el territorio español."},{"id":70,"tema":"2. Sistema Nacional de Salud (SNS)","subtema":"2.3. Cobertura poblacional","enunciado":"¿Qué instituciones y actores solicitaron la derogación o modificación del Real Decreto-ley 16/2012 al considerar vulnerado el derecho a la protección de la salud y a la asistencia sanitaria?","opciones":{"A":"La Unión Europea, la ONU, las comunidades autónomas, el Defensor del Pueblo, movimientos políticos y otras entidades.","B":"Las entidades de seguro libre, las mutuas patronales y las asociaciones de clínicas privadas concertadas.","C":"Exclusivamente los colegios profesionales farmacéuticos y las empresas colaboradoras de la Seguridad Social.","D":"Únicamente el Instituto Nacional de Gestión Sanitaria y las juntas gremiales de socorro mutuo locales."},"correcta":"A","explicacion":"El texto recoge que, ante la disconformidad por la vulneración del derecho a la salud, la Unión Europea, la ONU, las CC.AA., el Defensor del Pueblo, movimientos políticos y otras entidades solicitaron la derogación o modificación del RDL 16/2012."},{"id":71,"tema":"2. Sistema Nacional de Salud (SNS)","subtema":"2.3. Cobertura poblacional","enunciado":"Una ciudadana quiere verificar gratuitamente si tiene reconocido el derecho a la asistencia sanitaria pública antes de acudir a tramitar su tarjeta sanitaria. Según el tema, ¿dónde puede realizar esa comprobación?","opciones":{"A":"En el portal de estadísticas comparadas de gasto sanitario sobre el PIB de la Unión Europea.","B":"En la plataforma de contratación de conciertos sanitarios del Consejo Interterritorial de Salud.","C":"En la web del Ministerio de Trabajo, Migraciones y Seguridad Social mediante su servicio gratuito de comprobación.","D":"En el registro mercantil de entidades aseguradoras privadas y mutuas de accidentes de trabajo."},"correcta":"C","explicacion":"El recuadro «¿Derecho a asistencia sanitaria gratuita?» explica que para conocer si se tiene derecho a asistencia sanitaria gratuita se puede acceder a la web del Ministerio de Trabajo, Migraciones y Seguridad Social y utilizar su servicio gratuito de comprobación del derecho a Asistencia Sanitaria Pública."},{"id":72,"tema":"2. Sistema Nacional de Salud (SNS)","subtema":"2.3. Cobertura poblacional","enunciado":"Al comparar el Real Decreto-ley 16/2012 y el Real Decreto-ley 7/2018, ¿qué diferencia esencial existía en el tratamiento de la asistencia durante el embarazo, parto y posparto frente a la atención ordinaria de adultos extranjeros no autorizados?","opciones":{"A":"El RDL 16/2012 excluía también el embarazo y el parto, cobertura que no se incorporó hasta el año 2018.","B":"El RDL 16/2012 ya mantenía cubierta la atención en embarazo, parto y posparto junto con las urgencias graves.","C":"El RDL 7/2018 eliminó la cobertura del posparto para equipararla a los periodos de carencia privados.","D":"Ambos decretos restringieron la atención maternal al ámbito exclusivo de las mutualidades de funcionarios."},"correcta":"B","explicacion":"Bajo el Real Decreto-ley 16/2012, aunque se dejó fuera de la atención ordinaria a adultos no registrados ni autorizados a residir en España, la prestación sanitaria sí se mantuvo para la asistencia urgente por enfermedad grave o accidente hasta el alta médica y para el embarazo, parto y posparto."},{"id":73,"tema":"2. Sistema Nacional de Salud (SNS)","subtema":"2.4. Financiación y recursos del SNS","enunciado":"Según el artículo 79 de la Ley 14/1986, General de Sanidad, ¿cuál constituye la principal vía de financiación del Sistema Nacional de Salud español?","opciones":{"A":"Las transferencias del Estado con cargo a los Presupuestos Generales del Estado.","B":"Las tasas municipales abonadas directamente por los pacientes en cada consulta de Atención Primaria.","C":"Las cotizaciones sociales aportadas por los empresarios y los trabajadores en activo.","D":"Las primas anuales abonadas por los usuarios a las entidades aseguradoras concertadas."},"correcta":"A","explicacion":"Aunque el artículo 79 de la Ley General de Sanidad enumera cuatro vías (cotizaciones sociales mínimas, transferencias del Estado, tasas por determinados servicios y aportaciones autonómicas y locales), el texto indica explícitamente que las transferencias con cargo a los Presupuestos Generales del Estado son la principal vía de financiación."},{"id":74,"tema":"2. Sistema Nacional de Salud (SNS)","subtema":"2.4. Financiación y recursos del SNS","enunciado":"Una comunidad autónoma con menor capacidad recaudatoria tiene dificultades para sufragar su gasto sanitario anual con los tributos cedidos. ¿Qué mecanismo financiero contemplado en el tema compensa esta situación?","opciones":{"A":"La retención de las cuotas de la Tesorería General correspondientes al Instituto Social de la Marina.","B":"El cobro obligatorio de un copago por urgencias hospitalarias a los residentes de otras comunidades.","C":"El Fondo de Suficiencia, destinado a compensar a las autonomías que carecen de presupuesto suficiente.","D":"La conversión de los centros de salud comarcales en clínicas privadas autofinanciadas mediante primas."},"correcta":"C","explicacion":"Dentro de las aportaciones de las CC.AA. y corporaciones locales (a través de tributos como IRPF, IVA, sucesiones, patrimonio, hidrocarburos o impuestos especiales), el sistema cuenta con un Fondo de Suficiencia con el que se busca compensar a las autonomías que no disponen de suficiente presupuesto para afrontar el gasto sanitario."},{"id":75,"tema":"2. Sistema Nacional de Salud (SNS)","subtema":"2.4. Financiación y recursos del SNS","enunciado":"Un informe presupuestario autonómico desglosa los tributos con los que contribuyen las comunidades autónomas y corporaciones locales a la financiación del SNS. ¿Cuál de los siguientes grupos refleja fielmente los tributos citados en el documento?","opciones":{"A":"Cotizaciones por accidentes de trabajo, tasas de seguro escolar y primas de pólizas de decesos.","B":"Aranceles aduaneros exteriores, cuotas gremiales de cofradías y cánones de farmacia privada.","C":"Recargos sobre pensiones no contributivas, tasas de cementerios y multas de tráfico municipales.","D":"Sucesiones y donaciones, patrimonio, hidrocarburos, renta, IVA e impuestos especiales de fabricación."},"correcta":"D","explicacion":"El tema enumera explícitamente en el apartado 2.4 como tributos de aportación de las CC.AA. y corporaciones locales: el impuesto sobre sucesiones y donaciones, patrimonio, hidrocarburos, la renta de las personas físicas (IRPF), IVA e impuestos especiales de fabricación (cerveza, vino, bebidas fermentadas, alcohol y tabaco)."},{"id":76,"tema":"2. Sistema Nacional de Salud (SNS)","subtema":"2.4. Financiación y recursos del SNS","enunciado":"Un hospital comarcal público necesita renovar sus equipos diagnósticos y ampliar su plantilla de celadores, farmacéuticos y personal administrativo. Según la clasificación de recursos del SNS, ¿cómo se encuadran respectivamente los edificios/equipos y dichos profesionales?","opciones":{"A":"Los edificios como recursos económicos y los farmacéuticos y celadores como recursos materiales de apoyo.","B":"Los establecimientos y medios físicos como recursos materiales, y todas las personas que prestan servicio como recursos humanos.","C":"Únicamente médicos y enfermeros como recursos humanos, quedando celadores y administrativos como recursos económicos.","D":"Solo los hospitales públicos como recursos materiales, excluyendo los centros privados concertados de la red."},"correcta":"B","explicacion":"El cuadro de recursos del SNS clasifica como recursos humanos a todas las personas que prestan sus servicios en el sistema (médicos, enfermeros, farmacéuticos, veterinarios, celadores, administrativos, etc.) y como recursos materiales a los medios físicos y establecimientos (centros de salud, consultorios, hospitales, centros de salud mental, etc.), incluyendo tanto centros públicos como privados."},{"id":77,"tema":"2. Sistema Nacional de Salud (SNS)","subtema":"2.4. Financiación y recursos del SNS","enunciado":"En una auditoría de recursos materiales del Sistema Nacional de Salud, un alumno excluye de su inventario a los centros de salud mental, los centros de promoción de la salud y los hospitales privados concertados. ¿Qué error conceptual comete?","opciones":{"A":"Ignorar que los recursos materiales abarcan centros de salud mental, promoción de la salud y centros tanto públicos como privados.","B":"Confundir los centros de promoción de la salud con recursos financieros procedentes del Fondo de Suficiencia autonómico.","C":"Omitir que los consultorios locales se clasifican como recursos humanos al depender del personal sanitario municipal.","D":"Desconocer que solo los hospitales de referencia estatal cuentan legalmente como establecimientos materiales del SNS."},"correcta":"A","explicacion":"Según el cuadro de recursos del SNS en la página 8, los recursos materiales incluyen todos los medios físicos y establecimientos destinados a la atención a la salud —centros de salud, consultorios, hospitales, centros de salud mental, centros de promoción de la salud, etc.— pertenecientes a las distintas redes asistenciales, incluyendo centros públicos y privados."},{"id":78,"tema":"2. Sistema Nacional de Salud (SNS)","subtema":"2.4. Financiación y recursos del SNS","enunciado":"Un economista sanitario compara la inversión económica en sanidad de España con la de otros países de la Unión Europea utilizando el indicador recomendado en el tema. ¿Qué magnitud analiza exactamente?","opciones":{"A":"El gasto farmacéutico hospitalario dividido entre el número total de tarjetas sanitarias activas.","B":"La proporción de cotizaciones obreras destinadas en exclusiva al pago de pensiones de incapacidad laboral.","C":"El porcentaje del Producto Interior Bruto (PIB) dedicado a sanidad sumando gasto público y gasto privado.","D":"La diferencia anual entre las tasas municipales recaudadas y las transferencias del Fondo de Suficiencia."},"correcta":"C","explicacion":"El tema destaca como dato de interés analizar la evolución de la inversión económica en sanidad como porcentaje del Producto Interior Bruto (PIB) que cada país de la UE realiza, considerando la suma de gasto público y gasto privado."},{"id":79,"tema":"2. Sistema Nacional de Salud (SNS)","subtema":"2.4. Financiación y recursos del SNS","enunciado":"¿Qué papel desempeñan actualmente las cotizaciones sociales de empresarios y trabajadores en la financiación del Sistema Nacional de Salud según el artículo 79 de la Ley General de Sanidad?","opciones":{"A":"Costean íntegramente las nóminas de los recursos humanos mientras los impuestos cubren los hospitales privados.","B":"Constituyen la fuente mayoritaria del SNS por encima de las transferencias de los Presupuestos Generales del Estado.","C":"Financian exclusivamente las prestaciones de asistencia urgente para personas extranjeras sin residencia autorizada.","D":"Representan aportaciones mínimas dentro de un sistema cuya fuente principal procede de los Presupuestos Generales."},"correcta":"D","explicacion":"El apartado 2.4 precisa que las cotizaciones sociales son aportaciones mínimas por cotizaciones a la Seguridad Social de empresarios y trabajadores, siendo las transferencias del Estado con cargo a los Presupuestos Generales la principal vía de financiación."},{"id":80,"tema":"2. Sistema Nacional de Salud (SNS)","subtema":"2.4. Financiación y recursos del SNS","enunciado":"Un alumno consulta las fuentes oficiales digitales citadas en el tema para localizar los indicadores clave sobre recursos disponibles y gasto sanitario del SNS como porcentaje del PIB. ¿A qué organismo pertenecen dichas aplicaciones y portales?","opciones":{"A":"Al Ministerio de Sanidad, Consumo y Bienestar Social, mediante su aplicación de indicadores clave y sección de gasto sanitario.","B":"A la Asociación de Mutuas de Accidentes de Trabajo, mediante su anuario anual de contingencias profesionales.","C":"Al Servicio Público de Empleo Estatal, mediante su registro estadístico de afiliaciones y altas empresariales.","D":"A la Tesorería General de la Seguridad Social, mediante su boletín trimestral de recaudación de caja única."},"correcta":"A","explicacion":"Los cuadros laterales de la página 8 remiten expresamente a la aplicación de indicadores clave del Ministerio de Sanidad, Consumo y Bienestar Social (inclasns.msssi.es) y a su sección de Sanidad en datos / Gasto sanitario (www.mscbs.gob.es) para consultar recursos disponibles e inversión en porcentaje del PIB en la UE."},{"id":81,"tema":"3. Organización del Sistema Nacional de Salud","subtema":"3.1. Distribución geográfica: Áreas de salud y gestión","enunciado":"Una pregunta clásica de evaluación pregunta cuál es la estructura fundamental del sistema sanitario español encargada de gestionar unitariamente centros, establecimientos y prestaciones en su demarcación. ¿Qué unidad territorial cumple esta definición?","opciones":{"A":"La zona básica de salud, encargada únicamente de coordinar los consultorios rurales y los equipos de enfermería.","B":"El centro de especialidades comarcal, encargado de administrar la financiación autonómica de los hospitales.","C":"El distrito municipal sanitario, encargado de ejecutar las políticas de saneamiento ambiental de cada ayuntamiento.","D":"El área de salud, responsable de la gestión unitaria de centros, prestaciones y programas en su territorio."},"correcta":"D","explicacion":"Según el apartado 3.1 y la propia sección de evaluación del texto, las áreas de salud son las estructuras fundamentales del sistema, responsables de la gestión unitaria de los centros y establecimientos del Servicio de Salud en su demarcación territorial y de las prestaciones y programas desarrollados en ella."},{"id":82,"tema":"3. Organización del Sistema Nacional de Salud","subtema":"3.1. Distribución geográfica: Áreas de salud y gestión","enunciado":"Un equipo técnico debe delimitar una nueva Área de Salud. De acuerdo con la Ley General de Sanidad, ¿qué rango poblacional general debe abarcar y qué finalidad justifica contemplar factores geográficos o demográficos?","opciones":{"A":"Entre 5.000 y 25.000 habitantes, para garantizar la cercanía exclusiva al consultorio local en unos quince minutos.","B":"Entre 50.000 y 100.000 habitantes, para asegurar la uniformidad presupuestaria entre las distintas corporaciones locales.","C":"Entre 200.000 y 250.000 habitantes, para evitar que factores como el clima o la geografía impidan el acceso sanitario.","D":"Más de 500.000 habitantes, para concentrar todos los hospitales de referencia en las grandes áreas metropolitanas."},"correcta":"C","explicacion":"Las áreas de salud se delimitan teniendo en cuenta factores geográficos, socioeconómicos, demográficos, culturales, climatológicos e instalaciones sanitarias, con el fin de garantizar que ninguno impida el acceso a los servicios de salud, abarcando generalmente entre 200.000 y 250.000 habitantes."},{"id":83,"tema":"3. Organización del Sistema Nacional de Salud","subtema":"3.1. Distribución geográfica: Áreas de salud y gestión","enunciado":"Una comarca insular cuenta apenas con 90.000 residentes, muy por debajo del umbral habitual de 200.000 habitantes para un Área de Salud. ¿Por qué la normativa permite establecer allí un Área de Salud propia?","opciones":{"A":"Porque existen excepciones expresas para Baleares, Canarias, Ceuta y Melilla y zonas de difícil acceso geográfico.","B":"Porque los ayuntamientos insulares pueden asumir directamente las competencias hospitalarias sustituyendo a la comunidad.","C":"Porque en las islas el criterio poblacional se sustituye automáticamente por el número de mutuas laborales existentes.","D":"Porque el umbral de 200.000 habitantes se aplica únicamente a las zonas básicas de salud con hospital comarcal."},"correcta":"A","explicacion":"Aunque la regla general sitúa la población del Área de Salud entre 200.000 y 250.000 habitantes, el documento contempla expresamente excepciones como Baleares, Canarias, Ceuta y Melilla u otras zonas que por sus características geográficas de difícil acceso así lo exigen."},{"id":84,"tema":"3. Organización del Sistema Nacional de Salud","subtema":"3.1. Distribución geográfica: Áreas de salud y gestión","enunciado":"En la estructura de gestión de un Área de Salud, se convoca una reunión para realizar la consulta y el seguimiento de la gestión con participación municipal, sindical y de la administración. ¿Qué órgano se está reuniendo?","opciones":{"A":"El Consejo de Dirección de Área, competente para aprobar el plan integrado nacional y nombrar al gerente.","B":"El Consejo de Salud de Área, órgano de participación encargado de la consulta y el seguimiento de la gestión.","C":"La Gerencia de Atención Especializada, órgano ejecutivo que coordina los hospitales concertados privados.","D":"El Consejo Interterritorial del SNS, encargado de verificar la alta inspección en las comunidades autónomas."},"correcta":"B","explicacion":"En el cuadro de gestión de las Áreas de salud se distinguen tres niveles: el órgano de participación es el Consejo de Salud de Área (consulta y seguimiento de la gestión), el órgano de dirección es el Consejo de Dirección de Área y los órganos de gestión son las Gerencias de Atención Primaria y Atención Especializada."},{"id":85,"tema":"3. Organización del Sistema Nacional de Salud","subtema":"3.1. Distribución geográfica: Áreas de salud y gestión","enunciado":"Un Consejo de Salud de Área está integrado por 20 miembros en total. Conforme a los porcentajes establecidos en el tema, ¿cuántos miembros corresponderán como mínimo a las corporaciones locales y a las organizaciones sindicales respectivamente?","opciones":{"A":"Doce representantes de las corporaciones locales (60 %) y ocho representantes de la comunidad autónoma (40 %).","B":"Ocho representantes de las corporaciones locales (40 %) y al menos seis representantes de sindicatos sanitarios (30 %).","C":"Diez representantes de las corporaciones locales (50 %) y al menos cinco profesionales titulados sindicales (25 %).","D":"Cinco representantes de las corporaciones locales (25 %) y diez representantes de la administración sanitaria (50 %)."},"correcta":"C","explicacion":"El Consejo de Salud de Área está formado por miembros de las corporaciones locales comprendidas en la demarcación (50 % de los miembros = 10 de 20), por las organizaciones sindicales más representativas a través de profesionales sanitarios titulados (proporción no inferior al 25 % = al menos 5 de 20) y por la administración sanitaria."},{"id":86,"tema":"3. Organización del Sistema Nacional de Salud","subtema":"3.1. Distribución geográfica: Áreas de salud y gestión","enunciado":"¿Qué órgano del Área de Salud tiene atribuida la función de formular directrices en política de salud y controlar la gestión del área, y cómo se reparte su composición?","opciones":{"A":"El Consejo de Salud de Área, compuesto en un 60 % por sindicatos sanitarios y en un 40 % por gerentes hospitalarios.","B":"La Gerencia de Área, integrada paritariamente por médicos de Atención Primaria y representantes del INGESA.","C":"El Servicio Regional de Salud, formado exclusivamente por alcaldes de los municipios incluidos en la comarca.","D":"El Consejo de Dirección de Área, integrado en un 60 % por la comunidad autónoma y el resto por corporaciones locales."},"correcta":"D","explicacion":"El órgano de dirección es el Consejo de Dirección de Área, encargado de formular directrices en política de salud y controlar la gestión del área; está formado por la representación de la Comunidad Autónoma (60 % de los miembros) y por representantes de las corporaciones locales."},{"id":87,"tema":"3. Organización del Sistema Nacional de Salud","subtema":"3.1. Distribución geográfica: Áreas de salud y gestión","enunciado":"Dentro del organigrama de gestión del Área de Salud, ¿quién asume directamente la ejecución de la gestión a través de las Gerencias de Atención Primaria y Atención Especializada?","opciones":{"A":"El Gerente del Área de Salud, como responsable directo de los órganos de gestión del área.","B":"El Defensor del Pueblo autonómico, en coordinación con las comisiones sindicales de cada centro.","C":"El alcalde del municipio de mayor población dentro de la demarcación territorial sanitaria.","D":"El Ministro de Sanidad, mediante delegados directos designados en cada zona básica de salud."},"correcta":"A","explicacion":"En el cuadro de gestión de las Áreas de salud, los órganos de gestión corresponden a las Gerencias de Atención Primaria y Atención Especializada, siendo el Gerente del Área de Salud el encargado de la gestión."},{"id":88,"tema":"3. Organización del Sistema Nacional de Salud","subtema":"3.1. Distribución geográfica: Áreas de salud y gestión","enunciado":"Al comparar las dos instituciones colegiadas de un Área de Salud —Consejo de Salud y Consejo de Dirección—, ¿qué diferencia fundamental existe en la participación de la comunidad autónoma frente a las organizaciones sindicales?","opciones":{"A":"Las organizaciones sindicales poseen el 60 % en el Consejo de Dirección, mientras la comunidad queda fuera de ambos.","B":"La comunidad autónoma aporta el 60 % en el Consejo de Dirección, mientras los sindicatos participan con al menos un 25 % en el Consejo de Salud.","C":"Ambos consejos excluyen a las corporaciones locales para evitar injerencias municipales en la planificación sanitaria.","D":"Ambos consejos tienen idéntica composición paritaria de 50 % sindicatos y 50 % administración sanitaria estatal."},"correcta":"B","explicacion":"El Consejo de Salud de Área (participación) reúne corporaciones locales (50 %), sindicatos mediante profesionales sanitarios titulados (mínimo 25 %) y administración sanitaria. En cambio, el Consejo de Dirección de Área (dirección y control) está integrado por representantes de la Comunidad Autónoma (60 %) y de las corporaciones locales (40 %), sin presencia sindical."},{"id":89,"tema":"3. Organización del Sistema Nacional de Salud","subtema":"3.1. Distribución geográfica: Áreas de salud y gestión","enunciado":"Un alumno consulta la figura de las áreas de salud de la Comunidad Valenciana en el libro y observa que unas tienen una extensión territorial mucho mayor que otras. ¿Qué razón explica esa diferencia de tamaño?","opciones":{"A":"Que la delimitación combina densidad de población (200.000-250.000 habitantes) con factores geográficos, socioeconómicos y de acceso.","B":"Que las áreas más pequeñas pertenecen a la sanidad privada concertada y las más grandes a la red estatal directa.","C":"Que cada provincia solo puede dividir su territorio en dos áreas si supera el millón de habitantes censados.","D":"Que el tamaño depende exclusivamente del número de mutuas de accidentes de trabajo con sede en cada municipio."},"correcta":"A","explicacion":"Las áreas de salud se delimitan buscando atender a 200.000-250.000 habitantes y ponderando factores geográficos, socioeconómicos, demográficos, culturales, climatológicos y de instalaciones sanitarias para garantizar el acceso: por ello las zonas urbanas densamente pobladas ocupan menor superficie y las rurales extensas abarcan mayor territorio."},{"id":90,"tema":"3. Organización del Sistema Nacional de Salud","subtema":"3.1. Distribución geográfica: Áreas de salud y gestión","enunciado":"En el diseño autonómico de la estructura sanitaria, algunas comunidades emplean denominaciones propias en lugar de «Área de salud» o introducen escalones intermedios antes de la zona básica. ¿Cuál de las siguientes correspondencias del tema es correcta?","opciones":{"A":"En Cataluña se denomina Área sanitaria y en Galicia existen estructuras intermedias llamadas distritos de salud.","B":"En Asturias se denomina Región sanitaria y en Andalucía se suprimieron por completo las zonas básicas de salud.","C":"En Cataluña se denomina Región sanitaria, en Asturias Área sanitaria y en Andalucía existen distritos de salud.","D":"En Castilla-La Mancha se denomina Gerencia única estatal y en Galicia las áreas pasaron a depender del INGESA."},"correcta":"C","explicacion":"El recuadro «Denominaciones de Áreas de salud» (página 11) precisa que en Asturias se denomina Área sanitaria, en Cataluña Región sanitaria y en Galicia Gerencia de Atención Primaria; además, otras CC.AA. crearon estructuras intermedias entre área y zona básica, como Castilla-La Mancha, distritos de salud en Andalucía, distritos de Atención Primaria en Galicia o zona sanitaria de Gestión integrada."},{"id":91,"tema":"3. Organización del Sistema Nacional de Salud","subtema":"3.1. Distribución geográfica: Áreas de salud y gestión","enunciado":"¿Qué requisito mínimo de equipamiento hospitalario debe cumplirse en cada Área de Salud para poder prestar asistencia integral en ambos niveles asistenciales?","opciones":{"A":"Disponer de un hospital universitario de referencia nacional en cada zona básica de salud rural.","B":"Contar con al menos un hospital vinculado al Sistema Nacional de Salud dentro de su demarcación.","C":"Mantener un convenio obligatorio con al menos dos entidades aseguradoras privadas de seguro libre.","D":"Centralizar todas las consultas de Atención Primaria dentro del edificio del hospital comarcal único."},"correcta":"B","explicacion":"En la página 10 se indica que en un área de salud las actividades comprenden tanto Atención Primaria como Especializada y que, para prestar atención especializada de mayor complejidad, en cada área de salud existirá al menos un hospital vinculado al SNS en su demarcación."},{"id":92,"tema":"3. Organización del Sistema Nacional de Salud","subtema":"3.1. Distribución geográfica: Áreas de salud y gestión","enunciado":"En la jerarquía organizativa autonómica del Sistema Nacional de Salud representada en el tema, ¿cuál es el orden correcto de mayor a menor nivel territorial hasta llegar al consultorio?","opciones":{"A":"Comunidad Autónoma — Servicio de Salud — Área de Salud — Zona de Salud — Centro de Salud o Consultorios.","B":"Comunidad Autónoma — Zona de Salud — Consejo de Dirección — Área de Salud — Hospital de referencia.","C":"Administración Central — Ayuntamiento — Área de Salud — Mutualidad de funcionarios — Centro de Salud.","D":"Servicio de Salud — Zona Básica de Salud — Área de Salud — Centro de Especialidades — Consultorios."},"correcta":"A","explicacion":"El organigrama de la página 10 muestra la secuencia descendente: Comunidades autónomas -> Servicio de salud -> Área de salud -> Atención Primaria (Zonas de salud -> Centro de salud y Consultorios) y Atención Especializada (Hospitales y Centros de especialidades)."},{"id":93,"tema":"3. Organización del Sistema Nacional de Salud","subtema":"3.1. Distribución geográfica: Áreas de salud y gestión","enunciado":"Si una Comunidad Autónoma desea que las organizaciones sindicales más representativas participen mediante profesionales sanitarios titulados en el seguimiento de un Área de Salud, ¿en qué porcentaje mínimo debe garantizar su presencia?","opciones":{"A":"En una proporción exacta del 60 % dentro del Consejo de Dirección del Área de Salud.","B":"En una proporción exacta del 50 % compartido paritariamente con los ayuntamientos locales.","C":"En una proporción máxima del 10 % dentro de las gerencias de Atención Especializada.","D":"En una proporción no inferior al 25 % dentro del Consejo de Salud de Área."},"correcta":"D","explicacion":"Dentro del Consejo de Salud de Área (órgano de participación para consulta y seguimiento de la gestión), las organizaciones sindicales más representativas participan a través de profesionales sanitarios titulados en una proporción no inferior al 25 %."},{"id":94,"tema":"3. Organización del Sistema Nacional de Salud","subtema":"3.1. Distribución geográfica: Áreas de salud y gestión","enunciado":"Un ciudadano reclama que la gestión de su hospital comarcal y la de los centros de salud de su comarca actúen de forma desconectada porque carecen de un marco común territorial. ¿Qué función del Área de Salud está diseñada precisamente para evitar esa fragmentación?","opciones":{"A":"Su competencia para aprobar los Presupuestos Generales del Estado en materia de sanidad exterior.","B":"Su potestad para suscribir pólizas de seguro libre con periodos de carencia para residentes locales.","C":"Su responsabilidad de gestión unitaria de centros, establecimientos, prestaciones y programas de su demarcación.","D":"Su facultad de sustituir al Consejo Interterritorial en la elaboración de normas sobre productos farmacéuticos."},"correcta":"C","explicacion":"Las áreas de salud son las estructuras fundamentales del sistema precisamente porque asumen la gestión unitaria de los centros y establecimientos del Servicio de Salud en su demarcación territorial, así como de las prestaciones sanitarias y programas que se desarrollen en ella."},{"id":95,"tema":"3. Organización del Sistema Nacional de Salud","subtema":"3.1. Zonas básicas de salud y niveles asistenciales","enunciado":"¿Cómo se definen las Zonas Básicas de Salud (ZBS) dentro de la distribución territorial establecida por la Ley General de Sanidad?","opciones":{"A":"Como agrupaciones de varias áreas de salud destinadas a coordinar los trasplantes en hospitales universitarios.","B":"Como divisiones municipales exclusivas encargadas de gestionar las pólizas de seguro libre de los funcionarios.","C":"Como subdivisiones territoriales del área de salud donde se presta la asistencia sanitaria en Atención Primaria.","D":"Como organismos estatales dependientes del Ministerio de Trabajo para controlar las bajas laborales por accidente."},"correcta":"C","explicacion":"Las zonas básicas de salud (ZBS) son las subdivisiones territoriales de cada área de salud en las que se realiza la asistencia en Atención Primaria, constituyendo el primer escalón territorial cercano al ciudadano."},{"id":96,"tema":"3. Organización del Sistema Nacional de Salud","subtema":"3.1. Zonas básicas de salud y niveles asistenciales","enunciado":"Al delimitar una Zona Básica de Salud rural en una zona de montaña con núcleos dispersos, ¿qué población de referencia establece la norma y cuál es el criterio fundamental que prima sobre cualquier otro?","opciones":{"A":"Entre 5.000 y 25.000 habitantes, primando como criterio fundamental la accesibilidad al Centro de salud.","B":"Entre 200.000 y 250.000 habitantes, primando la proximidad a un centro de especialidades con urgencias.","C":"Entre 50.000 y 100.000 habitantes, primando el volumen de recaudación autonómica por impuestos especiales.","D":"Entre 1.000 y 3.000 habitantes, primando la existencia de una mutua colaboradora en la localidad cabecera."},"correcta":"A","explicacion":"El cuadro de Zonas básicas de salud (página 9) establece que, teniendo en cuenta densidad de población, recursos e instalaciones, el criterio fundamental es la accesibilidad al Centro de salud, delimitándose en principio una población de entre 5.000 y 25.000 habitantes (con excepciones precisamente según el criterio de accesibilidad)."},{"id":97,"tema":"3. Organización del Sistema Nacional de Salud","subtema":"3.1. Zonas básicas de salud y niveles asistenciales","enunciado":"¿Qué estructura constituye el soporte físico y funcional sanitario de referencia donde desarrolla sus funciones el equipo de Atención Primaria en una Zona Básica de Salud?","opciones":{"A":"El hospital vinculado al SNS situado en la capital del Área de Salud.","B":"El Consejo de Salud de Área integrado por corporaciones locales y sindicatos.","C":"La Gerencia de Atención Especializada adscrita al servicio regional correspondiente.","D":"El Centro de salud o Centro de Atención Primaria ubicado en la demarcación."},"correcta":"D","explicacion":"El texto especifica que el Centro de salud o Centro de Atención Primaria constituye la estructura física y funcional sanitaria de referencia, donde desarrolla sus funciones el equipo de Atención Primaria."},{"id":98,"tema":"3. Organización del Sistema Nacional de Salud","subtema":"3.1. Zonas básicas de salud y niveles asistenciales","enunciado":"Según el esquema general de un área de salud y sus zonas básicas de salud, si un área de salud se subdivide en seis zonas básicas de salud, ¿cómo se articula la relación asistencial entre ellas y los hospitales?","opciones":{"A":"Cada zona básica de salud cuenta con un hospital de referencia independiente sin comunicación entre zonas.","B":"Cada zona básica dispone de su centro de salud y todas comparten el hospital de referencia del área.","C":"Tres zonas básicas se dedican exclusivamente a prevención y las otras tres únicamente a hospitalización quirúrgica.","D":"Los centros de salud sustituyen a los hospitales en todas las intervenciones de mayor complejidad clínica."},"correcta":"B","explicacion":"La figura 4 de la página 10 ilustra claramente que cada Área de Salud se subdivide en diferentes zonas básicas de salud (1 a 6), cada una con su Centro de salud para Atención Primaria, convergiendo todas hacia el Hospital de referencia común del Área de Salud."},{"id":99,"tema":"3. Organización del Sistema Nacional de Salud","subtema":"3.1. Zonas básicas de salud y niveles asistenciales","enunciado":"Un médico de familia, una enfermera, una trabajadora social y una matrona organizan conjuntamente un programa de vacunación infantil y educación sanitaria escolar en su barrio. ¿A qué nivel asistencial y forma de trabajo corresponde esta actuación?","opciones":{"A":"A la Atención Especializada, al desarrollarse mediante fórmulas de ingreso hospitalario programado.","B":"A la Atención Primaria, al emplear trabajo en equipo orientado al individuo, familia y comunidad.","C":"A la Alta Inspección del Estado, al verificar el cumplimiento de planes integrados en centros escolares.","D":"A las entidades de seguro libre, al tratarse de prestaciones preventivas excluidas de la red pública."},"correcta":"B","explicacion":"Las actividades desarrolladas en la Atención Primaria se realizan mediante fórmulas de trabajo en equipo, atendiendo al individuo, la familia y la comunidad mediante programas de promoción de la salud, prevención, cura y rehabilitación a través de sus medios básicos y equipos de apoyo."},{"id":100,"tema":"3. Organización del Sistema Nacional de Salud","subtema":"3.1. Zonas básicas de salud y niveles asistenciales","enunciado":"Un paciente requiere una cirugía cardiaca compleja y seguimiento en consultas de cardiología hospitalaria. De acuerdo con el cuadro de actividades asistenciales del tema, ¿qué ámbito cubre esta atención y a través de qué dos tipos de centros?","opciones":{"A":"La Atención Especializada, prestada a través de hospitales y centros de especialidades del área.","B":"La Atención Primaria, prestada a través de consultorios locales y equipos de apoyo comunitarios.","C":"La sanidad exterior estatal, prestada a través de delegaciones territoriales del Ministerio de Trabajo.","D":"La policía sanitaria mortuoria, prestada a través de servicios municipales de salubridad pública."},"correcta":"A","explicacion":"En el organigrama de la página 10, la Atención Especializada se articula mediante Hospitales y Centros de especialidades, encargándose de prestar atención de mayor complejidad a los problemas de salud mediante la asistencia hospitalaria y el resto de funciones propias de este nivel."},{"id":101,"tema":"3. Organización del Sistema Nacional de Salud","subtema":"3.1. Zonas básicas de salud y niveles asistenciales","enunciado":"En una aldea de 400 habitantes perteneciente a una Zona Básica de Salud rural, los vecinos acuden a pasar consulta ordinaria dos días a la semana a un local asistencial más pequeño vinculado al Centro de Salud de la cabecera. Según el esquema del SNS, ¿qué nombre recibe ese dispositivo?","opciones":{"A":"Consultorio, integrado dentro de la red de Atención Primaria de la zona de salud.","B":"Centro de especialidades, adscrito directamente a la gerencia hospitalaria provincial.","C":"Agencia de INGESA, dependiente de la Administración Central en los núcleos rurales pequeños.","D":"Sociedad de socorro mutuo, gestionada de manera solidaria por los vecinos de la localidad."},"correcta":"A","explicacion":"El diagrama organizativo del SNS en las CC.AA. (página 10) muestra que dentro de la Atención Primaria, debajo de las Zonas de salud, existen dos tipos de dispositivos físicos: el Centro de salud y los Consultorios."},{"id":102,"tema":"3. Organización del Sistema Nacional de Salud","subtema":"3.1. Zonas básicas de salud y niveles asistenciales","enunciado":"Un estudiante afirma que la Atención Primaria se limita a curar enfermedades leves, dejando la rehabilitación y la promoción de la salud exclusivamente para los hospitales. ¿Por qué es errónea esta afirmación según el tema?","opciones":{"A":"Porque los hospitales únicamente realizan campañas de vacunación comunitaria y educación escolar.","B":"Porque la Atención Primaria tiene prohibido realizar actividades curativas en los centros de salud.","C":"Porque ni la Atención Primaria ni los hospitales incluyen programas de rehabilitación en el SNS.","D":"Porque la Atención Primaria desarrolla programas de promoción, prevención, cura y rehabilitación en equipo."},"correcta":"D","explicacion":"El cuadro de actividades desarrolladas en Atención Primaria señala literalmente que realiza las prestaciones sanitarias mediante fórmulas de trabajo en equipo, atendiendo al individuo, familia y comunidad mediante programas de promoción de la salud, prevención, cura y rehabilitación a través de medios básicos y equipos de apoyo."},{"id":103,"tema":"3. Organización del Sistema Nacional de Salud","subtema":"3.1. Zonas básicas de salud y niveles asistenciales","enunciado":"En la sección «Ponte a prueba» del tema se pregunta por las funciones de la Atención Primaria. ¿Qué conjunto de actuaciones sintetiza correctamente dichas funciones?","opciones":{"A":"Únicamente la asistencia hospitalaria urgente y el control sanitario de las industrias locales.","B":"La asistencia sanitaria, la prevención de la enfermedad y la promoción de la salud.","C":"Exclusivamente la prescripción de medicamentos extranjeros y la inspección de fronteras.","D":"La gestión financiera de las pensiones contributivas y la afiliación de nuevas empresas."},"correcta":"B","explicacion":"Tanto en el texto explicativo (página 10) como en la pregunta 7 de «Ponte a prueba» (página 16), se confirma que son funciones de la Atención Primaria la asistencia sanitaria, la prevención de la enfermedad y la promoción de la salud (junto con la rehabilitación básica)."},{"id":104,"tema":"3. Organización del Sistema Nacional de Salud","subtema":"3.1. Zonas básicas de salud y niveles asistenciales","enunciado":"Un ciudadano vive en una zona montañosa muy aislada donde solo residen 2.800 habitantes. ¿Por qué resulta válido crear allí una Zona Básica de Salud a pesar de no alcanzar los 5.000 habitantes?","opciones":{"A":"Porque el criterio fundamental de delimitación de las zonas básicas es la accesibilidad al Centro de salud.","B":"Porque el umbral de 5.000 habitantes se exige únicamente para abrir centros de especialidades privados.","C":"Porque la Ley de Cohesión y Calidad obliga a crear una zona básica por cada municipio con más de mil vecinos.","D":"Porque las zonas de montaña quedan automáticamente bajo gestión exclusiva del Instituto Social de la Marina."},"correcta":"A","explicacion":"El cuadro de la página 9 indica que la población de las ZBS se delimita entre 5.000 y 25.000 habitantes, pero añade expresamente que existen excepciones según el criterio fundamental: la accesibilidad al Centro de salud."},{"id":105,"tema":"3. Organización del Sistema Nacional de Salud","subtema":"3.1. Zonas básicas de salud y niveles asistenciales","enunciado":"Al comparar las cifras poblacionales de referencia entre Área de Salud y Zona Básica de Salud, ¿cuál de los siguientes emparejamientos es exacto?","opciones":{"A":"Área de Salud: 5.000 a 25.000 habitantes; Zona Básica de Salud: 200.000 a 250.000 habitantes.","B":"Área de Salud: 200.000 a 250.000 habitantes; Zona Básica de Salud: 5.000 a 25.000 habitantes.","C":"Área de Salud: 100.000 a 150.000 habitantes; Zona Básica de Salud: 10.000 a 50.000 habitantes.","D":"Área de Salud: 200.000 a 250.000 habitantes; Zona Básica de Salud: 15.000 a 25.000 habitantes."},"correcta":"B","explicacion":"El Área de Salud abarca una población general de entre 200.000 y 250.000 habitantes, mientras que cada Zona Básica de Salud en la que se subdivide abarca entre 5.000 y 25.000 habitantes (recogido también en la pregunta 6 de Ponte a prueba)."},{"id":106,"tema":"3. Organización del Sistema Nacional de Salud","subtema":"3.1. Zonas básicas de salud y niveles asistenciales","enunciado":"¿Qué combinación de servicios garantiza que un Área de Salud ofrezca «asistencia sanitaria integral» a su población según la página 10 del documento?","opciones":{"A":"La integración de las farmacias privadas y las mutuas de accidentes de trabajo bajo una sola gerencia.","B":"La unificación de los presupuestos municipales de salubridad con las cuotas del seguro escolar.","C":"La realización en su ámbito de actividades tanto de Atención Primaria como de Atención Especializada.","D":"La sustitución progresiva de los centros de salud por consultas telemáticas centralizadas en el hospital."},"correcta":"C","explicacion":"El texto explica literalmente que, en un área de salud, las actividades que se deben desarrollar comprenden tanto la Atención Primaria como la especializada y, por tanto, incluye todos los servicios necesarios para poder prestar una asistencia sanitaria integral en ambos ámbitos."},{"id":107,"tema":"3. Organización del Sistema Nacional de Salud","subtema":"3.2. Competencias de la Administración Central y CC.AA.","enunciado":"Ante la detección de un brote epidémico transfronterizo en un puerto y la necesidad de revisar acuerdos sanitarios internacionales, ¿qué nivel de la Administración ostenta la competencia exclusiva para actuar?","opciones":{"A":"La Corporación Local del municipio portuario, en ejercicio de sus funciones de policía sanitaria.","B":"La Administración Central del Estado, competente en sanidad exterior, relaciones internacionales y control epidemiológico.","C":"El Consejo de Dirección de Área, encargado de ejecutar las directrices sanitarias de su demarcación.","D":"El Servicio Regional de Salud autonómico, responsable exclusivo de la normativa farmacéutica y fronteriza."},"correcta":"B","explicacion":"Entre las competencias exclusivas del Estado (Administración central) enumeradas en la página 11 figuran las funciones de sanidad exterior y las relaciones y acuerdos sanitarios internacionales, así como el control epidemiológico y la lucha contra las enfermedades transmisibles."},{"id":108,"tema":"3. Organización del Sistema Nacional de Salud","subtema":"3.2. Competencias de la Administración Central y CC.AA.","enunciado":"Un laboratorio solicita autorización normativa sobre productos farmacéuticos y un colegio sanitario consulta la regulación básica de su profesión. ¿A quién atribuye la Ley General de Sanidad ambas competencias?","opciones":{"A":"Al Consejo de Salud de cada área sanitaria mediante consenso con los ayuntamientos locales.","B":"A cada Comunidad Autónoma de manera independiente para adaptarlo a su Servicio Regional de Salud.","C":"Al Estado (Administración central), competente en normativa farmacéutica y regulación de profesiones sanitarias.","D":"Al Consejo Interterritorial, actuando como organismo legislativo sustituto del Ministerio de Sanidad."},"correcta":"C","explicacion":"La tabla de competencias de la Administración central incluye entre las competencias exclusivas del Estado la normativa en materia de medio ambiente, alimentación humana y productos farmacéuticos, así como la regulación de las profesiones sanitarias (y política del medicamento en el cuadro de página 12)."},{"id":109,"tema":"3. Organización del Sistema Nacional de Salud","subtema":"3.2. Competencias de la Administración Central y CC.AA.","enunciado":"¿Qué instrumento estatal específico permite a la Administración Central garantizar y verificar que tanto las competencias estatales como las autonómicas en materia sanitaria se cumplen adecuadamente?","opciones":{"A":"Las funciones de Alta inspección ejercidas por la Administración Central del Estado.","B":"La tutela directa de las Gerencias de Atención Primaria ejercida por los ayuntamientos.","C":"La revisión financiera anual practicada por la Asociación de Mutuas de Accidentes de Trabajo.","D":"El control sanitario de edificios y lugares de convivencia efectuado por las diputaciones."},"correcta":"A","explicacion":"Entre las competencias exclusivas del Estado recogidas en la página 11 figura expresamente ejercer funciones de Alta inspección para garantizar y verificar el cumplimiento de las competencias estatales y de las comunidades autónomas."},{"id":110,"tema":"3. Organización del Sistema Nacional de Salud","subtema":"3.2. Competencias de la Administración Central y CC.AA.","enunciado":"Para coordinar la política sanitaria entre el Estado y las Comunidades Autónomas, el artículo 47 de la Ley General de Sanidad crea un órgano específico. ¿Cuál es este órgano y quiénes lo integran en su mayor nivel?","opciones":{"A":"El Instituto Nacional de Gestión Sanitaria, integrado por los gerentes de área y alcaldes de capitales.","B":"La Conferencia de Alma-Ata Permanente, integrada por representantes sindicales y mutuas colaboradoras.","C":"El Consejo de Dirección Estatal, integrado por la Tesorería General y el Ministerio de Trabajo.","D":"El Consejo Interterritorial del SNS, integrado por el Ministro de Sanidad y los consejeros de Sanidad autonómicos."},"correcta":"D","explicacion":"El artículo 47 de la LGS crea el Consejo Interterritorial del Sistema Nacional de Salud (CISNS), formado por representantes de cada comunidad autónoma y de la Administración Central, que en su mayor nivel corresponde a los consejeros de Sanidad de cada comunidad y al Ministro de Sanidad."},{"id":111,"tema":"3. Organización del Sistema Nacional de Salud","subtema":"3.2. Competencias de la Administración Central y CC.AA.","enunciado":"¿Cómo se articula la planificación sanitaria entre el Ministerio de Sanidad, el Consejo Interterritorial (CISNS) y cada Comunidad Autónoma según el apartado 3.2?","opciones":{"A":"El Ministerio propone el plan integrado de salud, el CISNS lo aprueba y cada autonomía elabora su propio Plan de Salud.","B":"Cada ayuntamiento redacta su plan local, el CISNS lo revisa y el Ministerio lo sustituye por normas estatales únicas.","C":"Las Comunidades Autónomas aprueban sus planes sin referencia estatal y el Ministerio se limita a recaudar tasas locales.","D":"El Ministerio aprueba unilateralmente los planes de zona básica sin intervención del Consejo Interterritorial."},"correcta":"A","explicacion":"El Estado propone a las CC.AA. el plan integrado de salud para equilibrar el desarrollo de la sanidad en todo el territorio nacional; a partir de ese plan integrado propuesto por el Ministerio y aprobado por el Consejo Interterritorial de Salud, cada CC.AA. elabora su propio Plan de Salud, marco para los planes de área y de zona básica."},{"id":112,"tema":"3. Organización del Sistema Nacional de Salud","subtema":"3.2. Competencias de la Administración Central y CC.AA.","enunciado":"Una enfermera se traslada entre servicios regionales de salud de distintas comunidades autónomas. ¿Qué emparejamiento entre Comunidad Autónoma y denominación de su Servicio Regional de Salud (SRS) es totalmente correcto?","opciones":{"A":"Galicia: SACYL; Castilla y León: SERGAS; País Vasco: Osasunbidea-SNO.","B":"País Vasco: Osakidetza; Castilla-La Mancha: SESCAM; Navarra: Osasunbidea-SNO.","C":"Madrid: CatSalut; Cataluña: SERMAS; Andalucía: SESCAM.","D":"Andalucía: SAS; Castilla y León: SERMAS; Castilla-La Mancha: Osakidetza."},"correcta":"B","explicacion":"Según la figura 5 de la página 11: Andalucía es SAS, País Vasco es Osakidetza, Castilla-La Mancha es SESCAM, Comunidad Foral de Navarra es Osasunbidea-SNO, Galicia es SERGAS, Castilla y León es SACYL, Madrid es SERMAS y Cataluña es CatSalut."},{"id":113,"tema":"3. Organización del Sistema Nacional de Salud","subtema":"3.2. Competencias de la Administración Central y CC.AA.","enunciado":"¿Cuáles son las únicas dos excepciones territoriales en España que no cuentan con un Servicio Regional de Salud propio transferido y cuya gestión sanitaria sigue llevando la Administración Central mediante el INGESA?","opciones":{"A":"La Comunidad Foral de Navarra y las Islas Canarias, por su régimen asimilado inicial.","B":"La Comunidad Autónoma de las Islas Baleares y el Principado de Asturias, por su insularidad y orografía.","C":"Las ciudades autónomas de Ceuta y Melilla, gestionadas por el Instituto Nacional de Gestión Sanitaria.","D":"La Comunidad Valenciana y Galicia, por mantenerse dentro del primer bloque de coordinación estatal."},"correcta":"C","explicacion":"El apartado 3.2 señala explícitamente que actualmente todas las comunidades autónomas han asumido las competencias sanitarias estableciendo sus propios SRS, siendo excepciones Ceuta y Melilla, cuya gestión la lleva a cabo la Administración Central a través del Instituto Nacional de Gestión Sanitaria (INGESA)."},{"id":114,"tema":"3. Organización del Sistema Nacional de Salud","subtema":"3.2. Competencias de la Administración Central y CC.AA.","enunciado":"En el cuadro resumen final de competencias públicas según la Constitución, la LGS y la LCC (página 12), ¿qué tres bloques competenciales se asignan específicamente a las Comunidades Autónomas?","opciones":{"A":"Sanidad exterior, política del medicamento y gestión directa del INGESA.","B":"Bases generales de la sanidad, regulación de profesiones sanitarias y salubridad municipal.","C":"Planificación sanitaria, salud pública y gestión de los Servicios de Salud.","D":"Alta inspección estatal, acuerdos internacionales y policía sanitaria mortuoria."},"correcta":"C","explicacion":"El cuadro resumen de la página 12 atribuye a las Comunidades Autónomas tres apartados claros: Planificación sanitaria, Salud pública y Gestión Servicios de Salud; a la Administración del Estado le asigna Bases y coordinación de la sanidad, Sanidad exterior, Política del medicamento y Gestión INGESA; y a las Corporaciones locales, Salubridad y Colaboración en la gestión de los servicios públicos."},{"id":115,"tema":"3. Organización del Sistema Nacional de Salud","subtema":"3.2. Competencias de la Administración Central y CC.AA.","enunciado":"Según la pregunta 8 de la sección de autoevaluación del libro («Ponte a prueba»), ¿a quiénes se atribuyen conjuntamente las competencias en Salud Pública?","opciones":{"A":"Exclusivamente a las corporaciones locales mediante sus ordenanzas municipales de salubridad.","B":"A las comunidades autónomas y al Consejo Interterritorial de Salud.","C":"Únicamente a la Administración Central a través de la dirección del Ministerio de Trabajo.","D":"Exclusivamente a las mutuas de accidentes de trabajo y a las entidades de seguro libre."},"correcta":"B","explicacion":"El cuadro de la página 12 sitúa la Administración del Estado y las Comunidades Autónomas bajo el ámbito de coordinación del Consejo Interterritorial del Sistema Nacional de Salud, y la pregunta 8 de Ponte a prueba (página 16) establece explícitamente que las competencias en Salud Pública se atribuyen a las comunidades autónomas y el Consejo Interterritorial de Salud."},{"id":116,"tema":"3. Organización del Sistema Nacional de Salud","subtema":"3.2. Competencias de la Administración Central y CC.AA.","enunciado":"Una Consejería de Sanidad quiere reordenar los límites internos de sus zonas básicas de salud y actualizar su Plan de Salud autonómico. ¿Por qué puede ejecutar ambas acciones legítimamente?","opciones":{"A":"Porque las comunidades autónomas ostentan la competencia exclusiva sobre la política estatal del medicamento.","B":"Porque los ayuntamientos delegan la alta inspección nacional en el Servicio Regional de Salud.","C":"Porque la Ley de Cohesión y Calidad suprimió las competencias de coordinación general del Estado.","D":"Porque diseñar la ordenación territorial de servicios y elaborar su Plan de Salud son competencias autonómicas."},"correcta":"D","explicacion":"El cuadro de competencias de las CC.AA. en la página 11 enumera expresamente: gestionar la asistencia sanitaria en su territorio, diseñar la ordenación territorial de sus servicios sanitarios y elaborar su propio Plan de Salud a partir del plan integrado aprobado por el CISNS."},{"id":117,"tema":"3. Organización del Sistema Nacional de Salud","subtema":"3.2. Competencias de la Administración Central y CC.AA.","enunciado":"¿Qué relación jerárquica de planificación existe dentro de una Comunidad Autónoma entre su Plan de Salud, los planes de área de salud y los planes de zona básica de salud?","opciones":{"A":"El Plan de Salud autonómico sirve de marco para elaborar los planes de área, que a su vez enmarcan los de zona básica.","B":"Los planes de zona básica condicionan obligatoriamente el contenido del Plan Integrado nacional aprobado por el CISNS.","C":"Los planes de área sustituyen por completo al Plan de Salud autonómico cuando existen distritos intermedios.","D":"Cada nivel elabora sus planes de forma autónoma sin vinculación normativa entre área, zona básica y consejería."},"correcta":"A","explicacion":"Según la página 11, cada CC.AA. elabora su propio Plan de Salud a partir del plan integrado de salud aprobado por el CISNS, y «este es el marco para la elaboración de los diferentes planes de área de salud, que a su vez lo serán para los planes de zona básica de salud»."},{"id":118,"tema":"3. Organización del Sistema Nacional de Salud","subtema":"3.2. Competencias de la Administración Central y CC.AA.","enunciado":"Al revisar las siglas de los distintos Servicios Regionales de Salud presentadas en el tema, ¿cuál corresponde correctamente al Servicio Madrileño de Salud y al Servicio de Salud de Castilla y León?","opciones":{"A":"SESCAM para Madrid y SERGAS para Castilla y León.","B":"CatSalut para Madrid y Osakidetza para Castilla y León.","C":"SAS para Madrid y Osasunbidea-SNO para Castilla y León.","D":"SERMAS para Madrid y SACYL para Castilla y León."},"correcta":"D","explicacion":"La figura 5 de la página 11 muestra las siglas oficiales: SERMAS corresponde al Servicio Madrileño de Salud y SACYL corresponde al Servicio Castellano Leonés de Salud."},{"id":119,"tema":"3. Organización del Sistema Nacional de Salud","subtema":"3.2. Competencias de las Corporaciones Locales y transferencias","enunciado":"En un municipio se detectan vertidos sin depurar en la red de aguas residuales y deficiencias higiénicas en la distribución local de alimentos y bebidas. Según la Ley General de Sanidad, ¿a qué administración corresponde el control sanitario directo de estas situaciones?","opciones":{"A":"A la Corporación Local (Ayuntamiento), competente en salubridad, aguas, residuos y control de alimentos y bebidas.","B":"Al Consejo Interterritorial del SNS, encargado de inspeccionar las redes locales de saneamiento urbano.","C":"Al Instituto Nacional de Gestión Sanitaria, responsable del control sanitario ambiental en todo el territorio.","D":"A las mutuas colaboradoras de la Seguridad Social, competentes en prevención ambiental dentro de los municipios."},"correcta":"A","explicacion":"El cuadro de «Competencias de los Ayuntamientos» (página 12) atribuye a las corporaciones locales el control sanitario del medio ambiente (abastecimiento de aguas, saneamiento de aguas residuales, contaminación atmosférica y residuos), así como el control sanitario del suministro y distribución de alimentos, bebidas y productos de consumo humano."},{"id":120,"tema":"3. Organización del Sistema Nacional de Salud","subtema":"3.2. Competencias de las Corporaciones Locales y transferencias","enunciado":"Un Ayuntamiento organiza el control sanitario del cementerio municipal, inspecciona los niveles de ruido de un taller industrial y verifica las condiciones sanitarias de un edificio de viviendas. ¿Están estas actuaciones amparadas en sus competencias sanitarias?","opciones":{"A":"Solo en el caso de los ruidos, pues los cementerios y viviendas dependen en exclusiva de la Administración Central.","B":"Sí, porque la LGS atribuye a los Ayuntamientos el control de industrias, ruidos, edificios y policía mortuoria.","C":"No, porque las corporaciones locales solo participan en los consejos de salud y carecen de funciones inspectoras.","D":"Únicamente cuando el Ayuntamiento gestiona su propio hospital comarcal concertado con entidades privadas."},"correcta":"B","explicacion":"Entre las competencias sanitarias de los Ayuntamientos figuran expresamente: control sanitario de industrias, actividades, servicios, transportes, ruidos y vibraciones; control sanitario de edificios y lugares de vivienda y convivencia humana; y control sanitario de los cementerios y policía sanitaria mortuoria."},{"id":121,"tema":"3. Organización del Sistema Nacional de Salud","subtema":"3.2. Competencias de las Corporaciones Locales y transferencias","enunciado":"Según el artículo 42 de la Ley General de Sanidad, si personal sanitario perteneciente al Servicio de Salud de una Comunidad Autónoma presta apoyo técnico a un Ayuntamiento en tareas de salubridad, ¿qué consideración jurídica adquiere respecto al municipio?","opciones":{"A":"Mantiene vinculación exclusiva con la Administración Central a efectos de la Alta Inspección estatal.","B":"Pasa a depender orgánicamente de las entidades aseguradoras privadas concertadas en la localidad.","C":"Actúa únicamente como observador sin asumir responsabilidades ni recursos dentro de la entidad municipal.","D":"Es considerado personal al servicio del Ayuntamiento, con las consiguientes consecuencias en recursos y responsabilidades."},"correcta":"D","explicacion":"La página 12 señala explícitamente que, según el artículo 42 de la LGS, el personal sanitario de los Servicios de Salud de las CC.AA. que preste apoyo a
