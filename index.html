los Ayuntamientos será considerado personal al servicio del mismo, con sus consecuencias en cuanto a recursos y responsabilidades."},{"id":122,"tema":"3. Organización del Sistema Nacional de Salud","subtema":"3.2. Competencias de las Corporaciones Locales y transferencias","enunciado":"Además de las tareas de salubridad y control sanitario local, ¿de qué forma participan las Corporaciones Locales en la estructura de gobierno de las Áreas de Salud?","opciones":{"A":"Nombrando en solitario al Gerente de Atención Especializada sin intervención de la Consejería de Sanidad.","B":"Sustituyendo a las organizaciones sindicales en el Consejo Interterritorial del Sistema Nacional de Salud.","C":"Participando como miembros en los Consejos de Dirección y en los Consejos de Salud de las áreas de salud.","D":"Aprobando los convenios de conciertos globales con hospitales privados de otras comunidades autónomas."},"correcta":"C","explicacion":"La primera competencia listada en la página 12 para los Ayuntamientos es participar en los consejos de dirección y consejos de salud de las áreas de salud (con el 50 % en el Consejo de Salud y el 40 % restante en el Consejo de Dirección)."},{"id":123,"tema":"3. Organización del Sistema Nacional de Salud","subtema":"3.2. Competencias de las Corporaciones Locales y transferencias","enunciado":"Un historiador de la sanidad española clasifica las distintas «vías» seguidas en la transferencia de competencias sanitarias a las comunidades autónomas. ¿Qué cinco comunidades integraron el primer bloque de transferencias?","opciones":{"A":"Cataluña, País Vasco, Galicia, Andalucía y Comunidad Valenciana.","B":"Madrid, Castilla y León, Castilla-La Mancha, Aragón y Extremadura.","C":"Navarra, Canarias, Baleares, Asturias y Región de Murcia.","D":"Cataluña, Madrid, País Vasco, Navarra y las Islas Canarias."},"correcta":"A","explicacion":"El recuadro «Transferencias» de la página 12 detalla las vías: en un primer bloque se transfirieron las competencias a Cataluña, País Vasco, Galicia, Andalucía y Valencia."},{"id":124,"tema":"3. Organización del Sistema Nacional de Salud","subtema":"3.2. Competencias de las Corporaciones Locales y transferencias","enunciado":"Dentro del proceso de transferencias sanitarias a las comunidades autónomas, ¿qué dos territorios recibieron las competencias mediante un procedimiento «asimilado» al del primer bloque?","opciones":{"A":"Las Islas Baleares y la Comunidad Autónoma de Madrid.","B":"La Comunidad Foral de Navarra y las Islas Canarias.","C":"El Principado de Asturias y la Región de Murcia.","D":"Las ciudades autónomas de Ceuta y Melilla."},"correcta":"B","explicacion":"El recuadro «Transferencias» (página 12) indica que, tras el primer bloque (Cataluña, País Vasco, Galicia, Andalucía y Valencia), por un procedimiento «asimilado» al anterior se transfirieron también a Navarra y Canarias."},{"id":125,"tema":"3. Organización del Sistema Nacional de Salud","subtema":"3.2. Competencias de las Corporaciones Locales y transferencias","enunciado":"¿En qué fecha concreta surtieron efecto los Reales Decretos mediante los cuales se completó la transferencia de competencias sanitarias a las diez comunidades autónomas restantes?","opciones":{"A":"El 25 de abril de 1986, coincidiendo con la promulgación de la Ley General de Sanidad.","B":"El 28 de mayo de 2003, con la entrada en vigor de la Ley de Cohesión y Calidad del SNS.","C":"El 27 de julio de 2018, al aprobarse el decreto sobre el acceso universal al sistema sanitario.","D":"El 1 de enero de 2002, culminando el traspaso a las diez comunidades autónomas restantes."},"correcta":"D","explicacion":"El recuadro «Transferencias» de la página 12 especifica literalmente: «Finalmente, a las diez comunidades restantes se transfieren las competencias mediante diferentes Reales Decretos con efecto de 1 de enero de 2002»."},{"id":126,"tema":"3. Organización del Sistema Nacional de Salud","subtema":"3.2. Competencias de las Corporaciones Locales y transferencias","enunciado":"En el cuadro síntesis sobre reparto competencial de la página 12, ¿qué dos términos resumen las competencias atribuidas a las Corporaciones Locales?","opciones":{"A":"Sanidad exterior y política estatal del medicamento.","B":"Salubridad y colaboración en la gestión de los servicios públicos.","C":"Planificación sanitaria autonómica y gestión de servicios regionales.","D":"Regulación de profesiones sanitarias y Alta inspección territorial."},"correcta":"B","explicacion":"El cuadro inferior de la página 12 sintetiza las competencias de las Corporaciones locales en dos conceptos: «Salubridad» y «Colaboración en la gestión de los servicios públicos»."},{"id":127,"tema":"4. La sanidad privada en España","subtema":"4.1. Ejercicio libre, financiación privada y conciertos","enunciado":"Una médica rehabilitadora abre una consulta privada propia y una sociedad mercantil inaugura una clínica diagnóstica independiente. ¿Qué dos derechos reconocidos en la Ley General de Sanidad amparan ambas iniciativas?","opciones":{"A":"La autonomía presupuestaria municipal y la libre competencia entre mutuas laborales obligatorias.","B":"La descentralización autonómica de servicios y la libre elección de médico en cualquier provincia.","C":"El principio de caja única solidaria y la exención fiscal para entidades sanitarias mercantiles.","D":"El derecho al ejercicio libre de la profesión sanitaria y la libertad de empresa en el sector sanitario."},"correcta":"D","explicacion":"El tema inicia el apartado 4 señalando explícitamente que la Ley General de Sanidad reconoce tanto el derecho de los profesionales sanitarios al ejercicio libre de la profesión como la libertad de empresa en el sector sanitario."},{"id":128,"tema":"4. La sanidad privada en España","subtema":"4.1. Ejercicio libre, financiación privada y conciertos","enunciado":"Un paciente acude por iniciativa propia a una clínica privada para realizarse unos análisis clínicos y una consulta de traumatología sin tener contratada ninguna póliza aseguradora. ¿Cómo se financia la asistencia en este caso?","opciones":{"A":"Mediante transferencias directas procedentes del Fondo de Suficiencia de su comunidad autónoma.","B":"Mediante cotizaciones obligatorias descontadas de su nómina por la Tesorería General.","C":"Mediante el pago directo que el usuario efectúa por el servicio sanitario concreto recibido.","D":"Mediante indemnización previa abonada por una mutualidad pública obligatoria de funcionarios."},"correcta":"C","explicacion":"En el ámbito de la asistencia privada prestada directamente por profesionales sanitarios o empresas privadas, la financiación se realiza mediante el pago que las personas efectúan por el servicio recibido (consulta, análisis clínicos, hospitalización, etc.)."},{"id":129,"tema":"4. La sanidad privada en España","subtema":"4.1. Ejercicio libre, financiación privada y conciertos","enunciado":"Un servicio regional de salud sufre listas de espera elevadas en resonancias magnéticas y transporte sanitario programado. Según el tema, ¿bajo qué criterio pueden establecer conciertos las Administraciones Públicas con entidades privadas?","opciones":{"A":"Cuando las necesidades asistenciales así lo aconsejen, tanto para prestaciones globales como para actividades concretas.","B":"Únicamente cuando desaparezca por completo el hospital de referencia público en la demarcación del área.","C":"Exclusivamente para prestaciones sanitarias globales, quedando prohibido concertar pruebas diagnósticas aisladas.","D":"Solo cuando la entidad privada carezca de ánimo de lucro y forme parte de una mutua de accidentes."},"correcta":"A","explicacion":"Las Administraciones Públicas pueden establecer conciertos con entidades privadas cuando las necesidades asistenciales así lo aconsejen, pudiendo abarcar prestaciones sanitarias globales o determinadas actividades o prestaciones concretas (pruebas diagnósticas, servicios de hospitalización concretos, transporte sanitario, etc.)."},{"id":130,"tema":"4. La sanidad privada en España","subtema":"4.1. Ejercicio libre, financiación privada y conciertos","enunciado":"Una clínica privada desea concertar servicios de hospitalización concretos con la consejería de sanidad de su comunidad autónoma. ¿Qué requisito previo exige el tema antes de formalizar dicho concierto?","opciones":{"A":"Estar integrada previamente en el catálogo de veinte mutuas colaboradoras autorizadas por el Ministerio de Empleo.","B":"Ser homologada previamente mediante un protocolo establecido por la Administración, revisable periódicamente.","C":"Suscribir pólizas de seguro de enfermedad con periodo de carencia reducido para los vecinos de la zona básica.","D":"Ceder la titularidad jurídica del edificio al Ayuntamiento del municipio donde radique la clínica privada."},"correcta":"B","explicacion":"Las Administraciones Públicas fijan los requisitos y condiciones aplicables a cualquier concierto, y los centros sanitarios que quieran concertar deben ser homologados previamente mediante un protocolo establecido por la Administración correspondiente, que podrá ser revisado periódicamente."},{"id":131,"tema":"4. La sanidad privada en España","subtema":"4.1. Ejercicio libre, financiación privada y conciertos","enunciado":"¿Quién fija los requisitos y condiciones aplicables a cualquier concierto sanitario entre la red pública y un centro privado, y qué carácter tiene el protocolo de homologación?","opciones":{"A":"Los colegios médicos provinciales, mediante acuerdos definitivos que no requieren revisión posterior.","B":"Las Administraciones Públicas correspondientes, mediante un protocolo previo que podrá revisarse periódicamente.","C":"Las propias empresas aseguradoras privadas, mediante condiciones estandarizadas en cada póliza individual.","D":"La Tesorería General de la Seguridad Social, mediante resolución anual única para toda España."},"correcta":"B","explicacion":"En los conciertos con entidades privadas, las Administraciones Públicas fijan los requisitos y condiciones aplicables, y los centros deben homologarse previamente conforme a un protocolo establecido por la Administración correspondiente, sujeto a revisión periódica."},{"id":132,"tema":"4. La sanidad privada en España","subtema":"4.1. Ejercicio libre, financiación privada y conciertos","enunciado":"Un centro hospitalario privado ha obtenido su homologación administrativa para realizar pruebas diagnósticas concertadas para el SNS hace cinco años. Según la normativa descrita, ¿puede la Administración revisar posteriormente esa homologación?","opciones":{"A":"Sí, porque el protocolo de homologación establecido por la Administración podrá ser revisado periódicamente.","B":"No, porque una vez concedida la homologación adquiere validez indefinida salvo cierre voluntario del centro.","C":"Solo si el centro decide transformarse en una mutualidad obligatoria de funcionarios civiles del Estado.","D":"Únicamente cuando así lo solicite la mayoría sindical del Consejo de Salud de la zona básica."},"correcta":"A","explicacion":"El texto señala expresamente en la página 13 que los centros sanitarios que quieran concertar deben ser homologados previamente mediante un protocolo establecido por la Administración correspondiente, el cual podrá ser revisado periódicamente."},{"id":133,"tema":"4. La sanidad privada en España","subtema":"4.1. Ejercicio libre, financiación privada y conciertos","enunciado":"¿Cuál de las siguientes actividades aparece citada expresamente en el tema como posible objeto de concierto específico entre las Administraciones Públicas y entidades privadas?","opciones":{"A":"La recaudación de cuotas empresariales, el seguro escolar obligatorio y las pensiones no contributivas.","B":"El control sanitario de cementerios municipales, aguas residuales y contaminación atmosférica.","C":"Las pruebas diagnósticas, determinados servicios de hospitalización y el transporte sanitario.","D":"La emisión de acuerdos sanitarios internacionales y las funciones de Alta inspección estatal."},"correcta":"C","explicacion":"La página 13 enumera literalmente como ejemplos de conciertos para determinadas actividades o prestaciones: pruebas diagnósticas, servicios de hospitalización concretos y transporte sanitario (además de poder establecerse conciertos para prestaciones sanitarias globales)."},{"id":134,"tema":"4. La sanidad privada en España","subtema":"4.1. Ejercicio libre, financiación privada y conciertos","enunciado":"Al comparar la financiación del SNS (Tema 2) con la asistencia privada pura ejercida por profesionales liberales (Tema 4), ¿qué diferencia fundamental caracteriza a cada una?","opciones":{"A":"El SNS se financia con primas individuales y la sanidad privada pura mediante impuestos especiales sobre el tabaco.","B":"El SNS se financia con pagos directos por acto médico y la sanidad privada mediante cotizaciones obligatorias.","C":"El SNS se financia principalmente con impuestos generales y la sanidad privada pura mediante pago por servicio recibido.","D":"Ambos modelos se financian exclusivamente mediante transferencias de los Presupuestos Generales del Estado."},"correcta":"C","explicacion":"El SNS se financia principalmente a cargo de impuestos generales (transferencias de los Presupuestos Generales del Estado), mientras que en la asistencia privada directa la financiación se realiza mediante el pago que las personas efectúan por el servicio recibido (consulta, análisis, hospitalización, etc.)."},{"id":135,"tema":"4. La sanidad privada en España","subtema":"4.2. Entidades de seguro libre y periodo de carencia","enunciado":"Una trabajadora suscribe un contrato con una aseguradora médica privada por el que abona una cantidad mensual fija y recibe un documento contractual que detalla los riesgos cubiertos y la asistencia incluida. ¿Qué nombre técnico reciben respectivamente esa cuota y ese contrato?","opciones":{"A":"Cotización obligatoria y concierto homologado.","B":"Tasa municipal y protocolo asistencial.","C":"Fondo de suficiencia y cartilla mutualista.","D":"Prima y póliza de cobertura de riesgos y asistencia."},"correcta":"D","explicacion":"En el cuadro «Entidades de seguro libre» (página 13), el asegurado paga una cuota denominada «prima», y la compañía aseguradora emite el contrato de cobertura de riesgos y asistencia denominado «póliza»."},{"id":136,"tema":"4. La sanidad privada en España","subtema":"4.2. Entidades de seguro libre y periodo de carencia","enunciado":"Una persona contrata una póliza privada de asistencia sanitaria el día 1 de marzo y el 15 de marzo pretende someterse a una intervención quirúrgica programada cubierta solo tras seis meses de antigüedad. ¿Qué mecanismo contractual le impide acceder aún a esa prestación y con qué finalidad existe?","opciones":{"A":"La exclusión de contingencias comunes, para derivar toda cirugía programada hacia las mutuas patronales.","B":"El periodo de carencia, establecido para evitar beneficiarse de asistencias muy caras por enfermedades previas.","C":"La homologación periódica, establecida para impedir cirugías en centros que carecen de concierto público.","D":"El régimen de caja única, establecido para limitar los gastos de hospitalización durante el primer trimestre."},"correcta":"B","explicacion":"El recuadro «Periodo de carencia» (página 13) explica que las compañías aseguradoras establecen un plazo llamado «de carencia» durante el cual el asegurado no puede acceder a determinadas prestaciones, con el fin de evitar que un asegurado poco honesto se beneficie de una asistencia muy cara al padecer de antemano una enfermedad importante."},{"id":137,"tema":"4. La sanidad privada en España","subtema":"4.2. Entidades de seguro libre y periodo de carencia","enunciado":"Un cliente revisa las cláusulas habituales de exclusión en las pólizas privadas de asistencia sanitaria descritas en el tema. ¿Cuál de las siguientes situaciones suele quedar excluida de cobertura en dichas pólizas?","opciones":{"A":"Las consultas ordinarias de medicina general tras superar el periodo inicial de carencia.","B":"Los análisis clínicos rutinarios prescritos por un facultativo incluido en el cuadro médico.","C":"Las pruebas diagnósticas ambulatorias derivadas de un proceso infeccioso agudo común.","D":"Las enfermedades crónicas, defectos físicos congénitos, enfermedades mentales, epidemias y cirugía estética."},"correcta":"D","explicacion":"Según la tabla de la página 13, las pólizas de asistencia sanitaria privada habitualmente no cubren: enfermedades crónicas, contingencias de colectivos profesionales de riesgo, accidentes de tráfico, defectos físicos congénitos, enfermedades mentales, epidemias ni intervenciones de cirugía plástica y estética."},{"id":138,"tema":"4. La sanidad privada en España","subtema":"4.2. Entidades de seguro libre y periodo de carencia","enunciado":"¿Qué diferencia práctica existe entre una «póliza de asistencia sanitaria» estándar y una «póliza de seguro de enfermedad» en las entidades privadas de seguro libre?","opciones":{"A":"La póliza de asistencia sanitaria carece de prima periódica y la de seguro de enfermedad suprime la asistencia médica.","B":"La póliza de asistencia sanitaria cubre epidemias y la de seguro de enfermedad cubre cirugía estética voluntaria.","C":"La póliza de seguro de enfermedad añade a la asistencia sanitaria una indemnización por tiempo de enfermedad y gastos.","D":"La póliza de seguro de enfermedad solo puede contratarse a través de mutualidades obligatorias de funcionarios."},"correcta":"C","explicacion":"La tabla de la página 13 diferencia las pólizas de asistencia sanitaria de las pólizas de seguro de enfermedad: en estas últimas, además de la asistencia sanitaria, se contrata una indemnización por tiempo de enfermedad y eventuales gastos médicos que se puedan producir."},{"id":139,"tema":"4. La sanidad privada en España","subtema":"4.2. Entidades de seguro libre y periodo de carencia","enunciado":"Una aseguradora privada rechaza cubrir la asistencia de un asegurado que sufrió un accidente de tráfico mientras conducía y también excluye una intervención de cirugía plástica estética. De acuerdo con el tema, ¿es habitual esa exclusión en las pólizas de asistencia sanitaria privada?","opciones":{"A":"No, porque las pólizas privadas únicamente excluyen los accidentes ocurridos dentro del domicilio habitual.","B":"Sí, porque accidentes de tráfico y cirugía plástica estética figuran entre las exclusiones habituales de estas pólizas.","C":"Solo respecto a la cirugía estética, pues todo accidente de tráfico debe ser sufragado por las aseguradoras médicas.","D":"Solo durante el primer mes del periodo de carencia, pasando a quedar cubiertos automáticamente al segundo mes."},"correcta":"B","explicacion":"Entre las exclusiones explícitas de las pólizas privadas de asistencia sanitaria enumeradas en el tema figuran tanto los accidentes de tráfico como las intervenciones de cirugía plástica y estética (junto con enfermedades crónicas, colectivos de riesgo, defectos físicos congénitos, enfermedades mentales y epidemias)."},{"id":140,"tema":"4. La sanidad privada en España","subtema":"4.2. Entidades de seguro libre y periodo de carencia","enunciado":"¿Por qué dos vías principales llega una persona a recibir asistencia sanitaria a través de una entidad de seguro libre en España?","opciones":{"A":"Contratando directamente una póliza privada o perteneciendo a una mutualidad de funcionarios que permite elegir esa vía.","B":"Solicitando el alta obligatoria en el régimen especial agrario o tramitando una prestación en el SEPE.","C":"Estando empadronada en un municipio sin centro de salud o acudiendo sin residencia legal a urgencias hospitalarias.","D":"Afiliándose voluntariamente a una empresa colaboradora o inscribiéndose en la Tesorería General sin cotizar."},"correcta":"A","explicacion":"El cuadro de «Entidades de seguro libre» comienza indicando literalmente que la persona contrata directamente una póliza que cubr d Social», ¿qué diferencia esencial señala el tema respecto a quiénes prestan colaboración?","opciones":{"A":"La mutua agrupa voluntariamente a empresarios, mientras la empresa colaboradora actúa individualmente respecto a su propio personal.","B":"La mutua tiene ánimo de lucro mercantil y la empresa colaboradora atiende a cualquier ciudadano residente en el municipio.","C":"La mutua gestiona pensiones de funcionarios judiciales y la empresa colaboradora asume las prestaciones del SEPE.","D":"La mutua depende de las consejerías autonómicas y la empresa colaboradora sustituye al INGESA en Ceuta y Melilla."},"correcta":"A","explicacion":"Las mutuas son asociaciones privadas de empresarios de carácter voluntario y sin ánimo de lucro autorizadas para colaborar en la gestión de la Seguridad Social; en cambio, las empresas colaboradoras actúan «individualmente consideradas y en relación con su propio personal», colaborando exclusivamente como indica la norma (art. 102 RDL 8/2015)."},{"id":149,"tema":"4. La sanidad privada en España","subtema":"4.3. Mutualidades, mutuas y empresas colaboradoras","enunciado":"Un alumno revisa los cuatro tipos de organizaciones relacionadas con la sanidad privada en España (página 13) y afirma que las mutuas de accidentes de trabajo obtienen beneficios repartibles entre sus empresarios socios. ¿Por qué debe corregir esa afirmación?","opciones":{"A":"Porque las mutuas de accidentes tienen prohibido colaborar en la gestión sanitaria de las contingencias profesionales.","B":"Porque dichas mutuas carecen de ánimo de lucro y están sometidas a la vigilancia y tutela del Ministerio competente.","C":"Porque todos sus excedentes se transfieren directamente a las compañías privadas de seguro de enfermedad.","D":"Porque su pertenencia es obligatoria para los funcionarios civiles del Estado, de Justicia y de las Fuerzas Armadas."},"correcta":"B","explicacion":"Las mutualidades de accidentes de trabajo y enfermedades profesionales carecen expresamente de ánimo de lucro, tienen capacidad jurídica propia, son de carácter voluntario y actúan autorizadas por el Ministerio de Empleo y Seguridad Social y sometidas a su vigilancia y tutela."},{"id":150,"tema":"4. La sanidad privada en España","subtema":"4.3. Mutualidades, mutuas y empresas colaboradoras","enunciado":"En una actividad comparativa final, se pide distinguir la afiliación de una mutualidad pública de funcionarios frente a una mutua de accidentes de trabajo. ¿Qué afirmación establece correctamente esa diferencia?","opciones":{"A":"Las mutualidades de funcionarios (MUFACE, MUGEJU, ISFAS) son obligatorias para sus colectivos, mientras las mutuas son voluntarias.","B":"Las mutualidades de funcionarios carecen de opción por el SNS, mientras las mutuas atienden únicamente enfermedades crónicas.","C":"Ambas instituciones son voluntarias y se financian mediante el pago directo por consulta en clínicas privadas sin conciertos.","D":"Las mutuas de accidentes solo cubren a funcionarios militares y las mutualidades públicas se restringen al sector agrario."},"correcta":"A","explicacion":"La tabla de la página 13 indica que MUFACE, MUGEJU e ISFAS constituyen un régimen separado mediante «mutualidades obligatorias» para determinados funcionarios (pudiendo elegir entre SNS o aseguradoras privadas), mientras que las mutualidades de accidentes de trabajo y enfermedades profesionales son asociaciones empresariales de «carácter voluntario»."}];
    const LETTERS = ['A', 'B', 'C', 'D'];
    const EXAM_QUESTION_COUNT = 37;
    const EXAM_DURATION_SECONDS = 40 * 60;
    const MIS_ERRORES_KEY = 'oads_tema2_mis_errores_v1';
    const LAST_EXAM_KEY = 'oads_tema2_ultimo_examen_v1';

    let memoryMisErrores = [];
    let memoryLastExam = [];

    function readIdArray(key, fallback) {
      try {
        const raw = window.localStorage.getItem(key);
        if (!raw) return fallback.slice();
        const parsed = JSON.parse(raw);
        if (!Array.isArray(parsed)) return fallback.slice();
        const valid = parsed.filter((id) => typeof id === 'number' && Number.isInteger(id));
        return Array.from(new Set(valid));
      } catch (_e) {
        return fallback.slice();
      }
    }

    function writeIdArray(key, ids, setFallback) {
      const unique = Array.from(new Set(ids));
      setFallback(unique);
      try {
        window.localStorage.setItem(key, JSON.stringify(unique));
      } catch (_e) {
        // Fallback already stored in memory
      }
      return unique;
    }

    function loadMisErrores() {
      return readIdArray(MIS_ERRORES_KEY, memoryMisErrores);
    }

    function saveMisErrores(ids) {
      return writeIdArray(MIS_ERRORES_KEY, ids, (u) => { memoryMisErrores = u; });
    }

    function loadLastExamIds() {
      return readIdArray(LAST_EXAM_KEY, memoryLastExam);
    }

    function saveLastExamIds(ids) {
      return writeIdArray(LAST_EXAM_KEY, ids, (u) => { memoryLastExam = u; });
    }

    function updateMisErrores(currentIds, questionId, isCorrect) {
      const exists = currentIds.includes(questionId);
      if (isCorrect) {
        return exists ? currentIds.filter((id) => id !== questionId) : currentIds.slice();
      }
      return exists ? currentIds.slice() : currentIds.concat([questionId]);
    }

    function mergeUnansweredIntoMisErrores(currentIds, sessionQuestions, answers) {
      let updated = currentIds.slice();
      for (const q of sessionQuestions) {
        const ans = answers[q.id];
        if (!ans || ans === 'BLANK') {
          updated = updateMisErrores(updated, q.id, false);
        }
      }
      return updated;
    }

    function buildHierarchy(questions) {
      const temas = [];
      const map = new Map();
      for (const q of questions) {
        if (!map.has(q.tema)) {
          const entry = { tema: q.tema, count: 0, subtemas: [], subMap: new Map() };
          map.set(q.tema, entry);
          temas.push(entry);
        }
        const entry = map.get(q.tema);
        entry.count += 1;
        if (!entry.subMap.has(q.subtema)) {
          const sub = { subtema: q.subtema, count: 0 };
          entry.subMap.set(q.subtema, sub);
          entry.subtemas.push(sub);
        }
        entry.subMap.get(q.subtema).count += 1;
      }
      return temas;
    }

    const HIERARCHY = buildHierarchy(QUESTIONS);

    const state = {
      view: 'start', // 'start' | 'practice' | 'practice_results' | 'exam' | 'exam_results'
      mode: 'practice', // 'practice' | 'exam'
      scope: 'all',
      selectedTema: HIERARCHY[0].tema,

      misErroresIds: loadMisErrores(),

      // Practice session

      examConfirmMode: 'none', // 'none' | 'finish' | 'exit'
      examReviewFilter: 'all', // 'all' | 'correct' | 'incorrect' | 'blank'

    let examTimerId = null;

    function stopExamTimer() {
      if (examTimerId !== null) {
        window.clearInterval(examTimerId);
        examTimerId = null;
      }

    function getFilteredPool() {
      if (state.scope === 'all') return QUESTIONS.slice();
      if (state.scope === 'tema') return QUESTIONS.filter((q) => q.tema === state.selectedTema);
      return QUESTIONS.filter((q) => q.subtema === state.selectedSubtema);
    }

    function getCountOptions(available) {
      if (available <= 0) return [];
      const presets = available <= 12 ? [5, 10] : [10, 20, 30, 50];
      const valid = presets.filter((n) => n < available);
      valid.push('all');
      return valid;
    }

    function shuffleCopy(list) {
      const copy = list.slice();
      for (let i = copy.length - 1; i > 0; i -= 1) {
        const j = Math.floor(Math.random() * (i + 1));
        const tmp = copy[i];
        copy[i] = copy[j];
        copy[j] = tmp;
      }
      return copy;
    }

    function formatCountdown(totalSeconds) {
      const clamped = Math.max(0, Math.floor(totalSeconds));
      const mins = Math.floor(clamped / 60);
      const secs = clamped % 60;
      return String(mins).padStart(2, '0') + ':' + String(secs).padStart(2, '0');
    }

    function formatGrade(grade) {
      return grade.toFixed(2).replace('.', ',');
    }

    function formatPct(pct) {
      return Number.isInteger(pct) ? pct + '%' : pct.toFixed(1).replace('.', ',') + '%';
    }

    function startPracticeSession() {
      stopExamTimer();
      const pool = getFilteredPool();
      const ordered = state.shuffle ? shuffleCopy(pool) : pool;
      const limit = state.requestedCount === 'all'
        ? ordered.length
        : Math.min(state.requestedCount, ordered.length);
      state.sessionQuestions = ordered.slice(0, limit);
      state.currentIndex = 0;
      state.answers = {};
      state.isMisErroresSession = false;
      state.isRetryIncorrect = false;
      state.view = 'practice';
      render();
    }

    function startMisErroresSession() {
      stopExamTimer();
      state.misErroresIds = loadMisErrores();
      const idSet = new Set(state.misErroresIds);
      const pool = QUESTIONS.filter((q) => idSet.has(q.id));
      if (pool.length === 0) return;
      state.sessionQuestions = state.shuffle ? shuffleCopy(pool) : pool;
      state.currentIndex = 0;
      state.answers = {};
      state.isMisErroresSession = true;
      state.isRetryIncorrect = false;
      state.view = 'practice';
      render();
    }

    function getIncorrectPracticeQuestions() {
      return state.sessionQuestions.filter((q) => {
        const sel = state.answers[q.id];
        return !sel || sel !== q.correcta;
      });
    }

    function startRetryIncorrect() {
      const missed = getIncorrectPracticeQuestions();
      if (missed.length === 0) return;
      state.sessionQuestions = state.shuffle ? shuffleCopy(missed) : missed.slice();
      state.currentIndex = 0;
      state.answers = {};
      state.isRetryIncorrect = true;
      state.view = 'practice';
      render();
    }

    function selectExamQuestions() {
      const prevIds = loadLastExamIds();
      const prevSet = new Set(prevIds);
      const eligible = QUESTIONS.filter((q) => !prevSet.has(q.id));
      const pool = eligible.length >= EXAM_QUESTION_COUNT ? eligible : QUESTIONS;
      const picked = shuffleCopy(pool).slice(0, Math.min(EXAM_QUESTION_COUNT, pool.length));
      saveLastExamIds(picked.map((q) => q.id));
      return picked;
    }

    function startExamSession() {
      stopExamTimer();
      const picked = selectExamQuestions();
      const now = Date.now();
      state.examQuestions = picked;
      state.examIndex = 0;
      state.examAnswers = {};
      state.examStartMs = now;
      state.examEndMs = now + EXAM_DURATION_SECONDS * 1000;
      state.examElapsedSeconds = 0;
      state.examConfirmMode = 'none';
      state.examReviewFilter = 'all';
      state.view = 'exam';
      render();
      startExamTimer();
    }

    function finishExam() {
      if (state.view !== 'exam') return;
      stopExamTimer();
      const elapsed = Math.min(
        EXAM_DURATION_SECONDS,
        Math.max(0, Math.round((Date.now() - state.examStartMs) / 1000))
      );
      state.examElapsedSeconds = elapsed;
      state.examConfirmMode = 'none';
      state.view = 'exam_results';
      render();
    }

    function startExamTimer() {
      stopExamTimer();
      examTimerId = window.setInterval(() => {
        if (state.view !== 'exam') {
          stopExamTimer();
          return;
        }
        const secs = Math.max(0, Math.ceil((state.examEndMs - Date.now()) / 1000));
        const timerEl = document.getElementById('offline-exam-timer');
        if (timerEl) {
          const textEl = document.getElementById('offline-exam-timer-text');
          if (textEl) textEl.textContent = formatCountdown(secs);
          if (secs <= 300) timerEl.classList.add('is-low');
          else timerEl.classList.remove('is-low');
        }
        if (secs <= 0) {
          finishExam();
        }
      }, 500);
    }

    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

          <select id="offline-epigrafe" class="oads-select">
            <option value="all" ${selectVal === 'all' ? 'selected' : ''}>Todos los epígrafes</option>
            ${HIERARCHY.map((g) => `
              <optgroup label="${escapeHtml(g.tema)}">
                <option value="tema::${escapeHtml(g.tema)}" ${selectVal === 'tema::' + g.tema ? 'selected' : ''}>${escapeHtml(g.tema)}</option>
                ${g.subtemas.map((s) => `
                  <option value="subtema::${escapeHtml(s.subtema)}" ${selectVal === 'subtema::' + s.subtema ? 'selected' : ''}>${escapeHtml(s.subtema)}</option>
                `).join('')}
              </optgroup>
            `).join('')}
          </select>
        </div>

        <div>
          <label class="oads-label" for="offline-count">Número de preguntas</label>
          <select id="offline-count" class="oads-select">
            ${countOpts.map((opt) => `
              <option value="${opt}" ${String(state.requestedCount) === String(opt) ? 'selected' : ''}>
                ${opt === 'all' ? 'Todas (' + available + ')' : String(opt)}
              </option>
            `).join('')}
          </select>
        </div>

        <label class="oads-check-row">
          <span>Mezclar orden de las preguntas</span>
          <input type="checkbox" id="offline-shuffle" ${state.shuffle ? 'checked' : ''} />
        </label>

        ${misErroresCount > 0 ? `
          <button type="button" id="offline-mis-errores" class="oads-errors-btn">
            Mis errores (${misErroresCount})
          </button>
        ` : ''}
      `;

      const examInfo = `
        <div class="oads-exam-info">37 preguntas · 40 minutos</div>
      `;

      return `
        <main class="start-shell">
          <section class="start-card">
            <header class="start-header">
              <h1 class="start-title">Estructura del Sistema sanitario español</h1>
              <p class="start-desc">
                Cuestionario interactivo para repasar y evaluar tus conocimientos sobre la evolución, organización, competencias y gestión del Sistema sanitario español.
              </p>
              <p class="start-credit">Elaboración de Susana Felipe Ortiz con ayuda de la IA</p>
            </header>

            <div class="start-body">
              <div class="mode-switch" role="radiogroup" aria-label="Selector de modalidad">
                <button type="button" class="mode-btn" data-mode="practice" role="radio" aria-checked="${state.mode === 'practice'}">
                  Modo práctica
                </button>
                <button type="button" class="mode-btn" data-mode="exam" role="radio" aria-checked="${state.mode === 'exam'}">
                  Modo examen
                </button>
              </div>

              ${state.mode === 'practice' ? practiceControls : examInfo}

              <button type="button" id="offline-start" class="oads-start-btn">
                ${state.mode === 'practice' ? 'Comenzar cuestionario' : 'Comenzar examen'}
              </button>
            </div>
          </section>
        </main>
      `;
    }

    function renderPractice() {
      const q = state.sessionQuestions[state.currentIndex];
      const total = state.sessionQuestions.length;
      const selected = state.answers[q.id];
      const isAnswered = Boolean(selected);
      const isBlank = selected === 'BLANK';
      const isCorrect = selected === q.correcta;

      let correct = 0;
      let wrong = 0;
      let blank = 0;
      let answered = 0;
      for (const item of state.sessionQuestions) {
        const a = state.answers[item.id];
        if (a) {
          answered += 1;
          if (a === 'BLANK') blank += 1;
          else if (a === item.correcta) correct += 1;
          else wrong += 1;
        }
      }

      const pct = Math.round(((state.currentIndex + 1) / total) * 100);
      const isLast = state.currentIndex === total - 1;

      const optionsHtml = LETTERS.map((letter) => {
        const isSel = selected === letter;
        const isRight = q.correcta === letter;
        let cls = 'option-btn';
        let tag = '';
        if (isAnswered) {
          if (isRight) {
            cls += ' is-correct';
            tag = '<span class="option-tag">✓ Correcta</span>';
          } else if (isSel) {
            cls += ' is-wrong';
            tag = '<span class="option-tag">✕ Tu respuesta</span>';
          } else {
            cls += ' is-dimmed';
          }
        }
        return `
          <button type="button" class="${cls}" data-opt="${letter}" ${isAnswered ? 'disabled' : ''}>
            <span class="option-letter">${letter}</span>
            <span class="option-text">${escapeHtml(q.opciones[letter])}</span>
            ${tag}
          </button>
        `;
      }).join('');

      const feedbackHtml = isAnswered ? `
        <section class="feedback-box ${isCorrect ? 'ok' : isBlank ? 'blank' : 'err'}" aria-live="polite">
          <div class="feedback-title">
            ${isCorrect
              ? '¡Enhorabuena! Respuesta correcta.'
              : isBlank
                ? `Pregunta dejada en blanco (añadida a Mis errores). La alternativa correcta es la ${q.correcta}.`
                : `Respuesta incorrecta. La alternativa correcta es la ${q.correcta}.`}
          </div>
          <p class="feedback-exp"><strong>Explicación didáctica:</strong> ${escapeHtml(q.explicacion)}</p>
        </section>
      ` : '';

      return `
        <main class="interior-shell">
          <div class="interior-inner">
            <div class="quiz-topbar">
              <div class="stats-line">
                ${state.isMisErroresSession ? '<span class="teal">Mis errores</span><span aria-hidden="true">·</span>' : ''}
                <span class="strong">Pregunta ${state.currentIndex + 1} de ${total}</span>
                <span aria-hidden="true">·</span>
                <span>Respondidas: ${answered}/${total}</span>
                <span aria-hidden="true">·</span>
                <span class="ok">Aciertos: ${correct}</span>
                <span aria-hidden="true">·</span>
                <span class="err">Fallos: ${wrong}</span>
                ${blank > 0 ? '<span aria-hidden="true">·</span><span>En blanco: ' + blank + '</span>' : ''}
              </div>
              <div class="actions-inline">
                <button type="button" id="offline-restart" class="btn-secondary btn-compact">Reiniciar</button>
                <button type="button" id="offline-home" class="btn-secondary btn-compact">Volver al inicio</button>
              </div>
            </div>

            <div class="progress-track" role="progressbar" aria-valuenow="${pct}" aria-valuemin="0" aria-valuemax="100">
              <div class="progress-fill" style="width:${pct}%"></div>
            </div>

            <article class="card quiz-card">
              <div>
                <header class="question-header">
                  <p class="breadcrumb">${escapeHtml(q.tema)} · ${escapeHtml(q.subtema)}</p>
                  <h1 class="question-stem">${escapeHtml(q.enunciado)}</h1>
                </header>

                <div class="options-list" role="group" aria-label="Opciones de respuesta">
                  ${optionsHtml}
                </div>

                ${feedbackHtml}
              </div>

              <footer class="quiz-footer">
                <button type="button" id="offline-prev" class="btn-secondary" ${state.currentIndex === 0 ? 'disabled' : ''}>
                  ← Pregunta anterior
                </button>
                <div class="actions-inline">
                  ${!isAnswered ? `
                    <button type="button" id="offline-blank" class="btn-secondary">
                      Dejar en blanco y continuar
                    </button>
                  ` : `
                    <button type="button" id="offline-next" class="btn-primary">
                      ${isLast ? 'Ver resultados →' : 'Siguiente pregunta →'}
                    </button>
                  `}
                </div>
              </footer>
            </article>
          </div>
        </main>
      `;
    }

    function renderPracticeResults() {
      const total = state.sessionQuestions.length;
      let correct = 0;
      let blank = 0;
      for (const q of state.sessionQuestions) {
        const a = state.answers[q.id];
        if (!a || a === 'BLANK') blank += 1;
        else if (a === q.correcta) correct += 1;
      }
      const wrong = total - correct - blank;
      const errorsAndBlanks = wrong + blank;
      const pct = total > 0 ? Math.round((correct / total) * 1000) / 10 : 0;
      const grade = total > 0 ? Math.round(((correct / total) * 10) * 100) / 100 : 0;

      let title = 'Sigue practicando';
      let msg = 'Esta práctica te permite detectar los puntos clave que requieren repaso. Revisa las explicaciones didácticas por subtemas y vuelve al repaso.';
      if (grade >= 9) {
        title = 'Dominio sobresaliente';
        msg = 'Has demostrado una comprensión profunda de la estructura sanitaria española y un criterio sólido para aplicar sus normas y modelos.';
      } else if (grade >= 7) {
        title = 'Muy buen desempeño';
        msg = 'Mantienes una base firme sobre los contenidos del sistema sanitario. Repasa los matices comentados en las explicaciones para alcanzar la excelencia.';
      } else if (grade >= 5) {
        title = 'Resultado aprobado';
        msg = 'Has superado la prueba con los conceptos esenciales adquiridos. Conviene reforzar las diferencias entre competencias, entidades gestoras y financiación.';
      }

      const baseScope = state.isMisErroresSession
        ? 'Mis errores'
        : state.scope === 'all'
          ? 'Todos los epígrafes'
          : state.scope === 'tema'
            ? state.selectedTema
            : state.selectedSubtema;
      const scopeLabel = state.isRetryIncorrect
        ? (state.isMisErroresSession ? 'Repaso · Mis errores' : 'Repaso de incorrectas · ' + baseScope)
        : baseScope;

      const misErroresCount = state.misErroresIds.length;

      return `
        <main class="results-shell">
          <section class="card results-wrap" style="padding:2rem;">
            <header style="border-bottom:1px solid var(--border);padding-bottom:1.25rem;">
              <div class="eyebrow">Resultados de la práctica · ${escapeHtml(scopeLabel)}</div>
              <h1 class="results-title">${title}</h1>
              <p class="results-lead">${msg}</p>
            </header>

            <div class="metrics-grid">
              <div class="metric-card">
                <span class="metric-label">Realizadas</span>
                <span class="metric-value">${total}</span>
              </div>
              <div class="metric-card ok">
                <span class="metric-label" style="color:#065F46;">Correctas</span>
                <span class="metric-value" style="color:#064E3B;">${correct}</span>
              </div>
              <div class="metric-card err">
                <span class="metric-label" style="color:#991B1B;">${blank > 0 ? 'Fallos / Blanco' : 'Errores'}</span>
                <span class="metric-value" style="color:#7F1D1D;">${errorsAndBlanks}</span>
              </div>
              <div class="metric-card">
                <span class="metric-label">Porcentaje</span>
                <span class="metric-value">${formatPct(pct)}</span>
              </div>
              <div class="metric-card ${grade >= 5 ? 'grade-pass' : 'grade-fail'}">
                <span class="metric-label">Nota / 10</span>
                <span class="metric-value">${formatGrade(grade)}</span>
              </div>
            </div>

            <div class="results-actions">
              ${errorsAndBlanks > 0 ? `<button type="button" id="offline-retry-wrong" class="btn-primary">Repetir incorrectas (${errorsAndBlanks})</button>` : ''}
              ${misErroresCount > 0 ? `<button type="button" id="offline-res-mis-errores" class="btn-secondary">Mis errores (${misErroresCount})</button>` : ''}
              <button type="button" id="offline-repeat" class="${errorsAndBlanks > 0 ? 'btn-secondary' : 'btn-primary'}">Repetir cuestionario</button>
              <button type="button" id="offline-choose" class="btn-secondary">Elegir otro tema</button>
              <button type="button" id="offline-home-res" class="btn-secondary">Volver al inicio</button>
            </div>
          </section>
        </main>
      `;
    }

    function renderExam() {
      const q = state.examQuestions[state.examIndex];
      const total = state.examQuestions.length;
      const selected = state.examAnswers[q.id];
      let answeredCount = 0;
      for (const item of state.examQuestions) {
        if (state.examAnswers[item.id]) answeredCount += 1;
      }
      const blankCount = total - answeredCount;
      const pct = Math.round(((state.examIndex + 1) / total) * 100);
      const secs = Math.max(0, Math.ceil((state.examEndMs - Date.now()) / 1000));
      const isLow = secs <= 300;
      const isLast = state.examIndex === total - 1;

      const optionsHtml = LETTERS.map((letter) => {
        const isSel = selected === letter;
        return `
          <button type="button" class="option-btn ${isSel ? 'is-selected' : ''}" data-exam-opt="${letter}" aria-pressed="${isSel}">
            <span class="option-letter">${letter}</span>
            <span class="option-text">${escapeHtml(q.opciones[letter])}</span>
          </button>
        `;
      }).join('');

      const navButtons = state.examQuestions.map((item, idx) => {
        const isCurrent = idx === state.examIndex;
        const isAns = Boolean(state.examAnswers[item.id]);
        const cls = 'exam-nav-btn' + (isCurrent ? ' is-current' : isAns ? ' is-answered' : '');
        return `
          <button type="button" class="${cls}" data-nav="${idx}" aria-label="Ir a pregunta ${idx + 1}" ${isCurrent ? 'aria-current="step"' : ''}>
            ${idx + 1}
          </button>
        `;
      }).join('');

      const confirmHtml = state.examConfirmMode !== 'none' ? `
        <div role="alertdialog" aria-modal="false" class="confirm-banner">
          <span>
            ${state.examConfirmMode === 'finish'
              ? `Quedan ${blankCount} ${blankCount === 1 ? 'pregunta en blanco' : 'preguntas en blanco'}. ¿Confirmas que deseas finalizar el examen?`
              : 'Si sales ahora se perderá el progreso del examen actual. ¿Deseas volver al inicio?'}
          </span>
          <div class="actions-inline">
            <button type="button" id="offline-confirm-cancel" class="btn-secondary btn-compact">Seguir en el examen</button>
            <button type="button" id="offline-confirm-ok" class="btn-primary btn-compact">
              ${state.examConfirmMode === 'finish' ? 'Confirmar y finalizar' : 'Salir al inicio'}
            </button>
          </div>
        </div>
      ` : '';

      return `
        <main class="interior-shell">
          <div class="interior-inner">
            <div class="quiz-topbar">
              <div class="stats-line">
                <span class="strong">Pregunta ${state.examIndex + 1} de ${total}</span>
                <span aria-hidden="true">·</span>
                <span class="teal">Respondidas: ${answeredCount}</span>
                <span aria-hidden="true">·</span>
                <span>Pendientes: ${blankCount}</span>
              </div>
              <div class="actions-inline">
                <div id="offline-exam-timer" class="timer-pill ${isLow ? 'is-low' : ''}">
                  <span aria-hidden="true">⏱</span>
                  <span id="offline-exam-timer-text">${formatCountdown(secs)}</span>
                </div>
                <button type="button" id="offline-exam-finish-top" class="btn-primary btn-compact">
                  Finalizar examen y ver resultados
                </button>
                <button type="button" id="offline-exam-exit" class="btn-secondary btn-compact">
                  Salir
                </button>
              </div>
            </div>

            <div class="progress-track" role="progressbar" aria-valuenow="${pct}" aria-valuemin="0" aria-valuemax="100">
              <div class="progress-fill" style="width:${pct}%"></div>
            </div>

            ${confirmHtml}

            <article class="card quiz-card">
              <div>
                <header class="question-header">
                  <p class="breadcrumb">Examen · Pregunta ${state.examIndex + 1} de ${total}</p>
                  <h1 class="question-stem">${escapeHtml(q.enunciado)}</h1>
                </header>

                <div class="options-list" role="group" aria-label="Opciones de respuesta del examen">
                  ${optionsHtml}
                </div>

                <nav class="exam-nav" aria-label="Navegación numérica de preguntas">
                  ${navButtons}
                </nav>
              </div>

              <footer class="quiz-footer">
                <button type="button" id="offline-exam-prev" class="btn-secondary" ${state.examIndex === 0 ? 'disabled' : ''}>
                  ← Anterior
                </button>
                <div class="actions-inline">
                  ${selected ? '<button type="button" id="offline-exam-clear" class="btn-secondary">Dejar en blanco</button>' : ''}
                  ${!isLast ? `
                    <button type="button" id="offline-exam-next" class="btn-primary">Siguiente →</button>
                  ` : `
                    <button type="button" id="offline-exam-finish-bot" class="btn-primary">Finalizar examen y ver resultados</button>
                  `}
                </div>
              </footer>
            </article>
          </div>
        </main>
      `;
    }

    function renderExamResults() {
      const total = state.examQuestions.length;
      let correct = 0;
      let incorrect = 0;
      let blank = 0;

      const items = state.examQuestions.map((q, idx) => {
        const sel = state.examAnswers[q.id];
        let status = 'blank';
        if (!sel) {
          blank += 1;
        } else if (sel === q.correcta) {
          correct += 1;
          status = 'correct';
        } else {
          incorrect += 1;
          status = 'incorrect';
        }
        return { q, index: idx + 1, sel, status };
      });

      const rawGrade = total > 0 ? ((correct - incorrect / 3) * 10) / total : 0;
      const grade = Math.round(rawGrade * 100) / 100;
      const passed = grade >= 5;

      const filtered = items.filter((it) => state.examReviewFilter === 'all' || it.status === state.examReviewFilter);

      return `
        <main class="results-scroll-shell">
          <div class="exam-results-wrap">
            <section class="card" style="padding:1.75rem;">
              <header class="exam-header-flex">
                <div>
                  <div class="eyebrow">Resultados del Modo examen</div>
                  <h1 class="results-title">${passed ? 'Examen superado' : 'Examen finalizado'}</h1>
                  <p class="results-lead">
                    Tiempo empleado: <strong>${formatCountdown(state.examElapsedSeconds)}</strong> · Total de preguntas: <strong>${total}</strong>
                  </p>
                </div>

                <div class="grade-callout ${passed ? '' : 'is-fail'}">
                  <span class="grade-callout-label">Calificación final</span>
                  <span class="grade-callout-num">${formatGrade(grade)}</span>
                  <span style="font-size:0.75rem;">sobre 10</span>
                </div>
              </header>

              <div class="metrics-grid cols-4">
                <div class="metric-card ok">
                  <span class="metric-label" style="color:#065F46;">Aciertos (+1)</span>
                  <span class="metric-value" style="color:#064E3B;">${correct}</span>
                </div>
                <div class="metric-card err">
                  <span class="metric-label" style="color:#991B1B;">Errores (−1/3)</span>
                  <span class="metric-value" style="color:#7F1D1D;">${incorrect}</span>
                </div>
                <div class="metric-card">
                  <span class="metric-label">En blanco (0)</span>
                  <span class="metric-value">${blank}</span>
                </div>
                <div class="metric-card">
                  <span class="metric-label">Total preguntas</span>
                  <span class="metric-value">${total}</span>
                </div>
              </div>

              <div class="results-actions">
                <button type="button" id="offline-new-exam" class="btn-primary">Realizar otro examen</button>
                <button type="button" id="offline-exam-home" class="btn-secondary">Volver al inicio</button>
              </div>
            </section>

            <section class="card" style="padding:1.75rem;">
              <div class="review-header">
                <h2 style="margin:0;font-size:1.125rem;color:var(--ink);">Revisión detallada de respuestas</h2>
                <div class="review-filters" role="group" aria-label="Filtrar revisión">
                  <button type="button" class="filter-pill ${state.examReviewFilter === 'all' ? 'is-active' : ''}" data-filter="all">Todas (${total})</button>
                  <button type="button" class="filter-pill ${state.examReviewFilter === 'correct' ? 'is-active' : ''}" data-filter="correct">Aciertos (${correct})</button>
                  <button type="button" class="filter-pill ${state.examReviewFilter === 'incorrect' ? 'is-active' : ''}" data-filter="incorrect">Errores (${incorrect})</button>
                  <button type="button" class="filter-pill ${state.examReviewFilter === 'blank' ? 'is-active' : ''}" data-filter="blank">En blanco (${blank})</button>
                </div>
              </div>

              <div class="review-list">
                ${filtered.map((it) => `
                  <article class="review-item ${it.status === 'correct' ? 'ok' : it.status === 'incorrect' ? 'err' : ''}">
                    <div class="review-meta">
                      <span style="color:var(--subtle);">Pregunta ${it.index} · ${escapeHtml(it.q.tema)}</span>
                      <span style="color:${it.status === 'correct' ? '#065F46' : it.status === 'incorrect' ? '#991B1B' : '#334155'};">
                        ${it.status === 'correct' ? '✓ Correcta (+1)' : it.status === 'incorrect' ? '✕ Incorrecta (−1/3)' : '— En blanco (0)'}
                      </span>
                    </div>
                    <p style="margin:0.5rem 0 0;font-size:0.9375rem;font-weight:600;color:var(--ink);">${escapeHtml(it.q.enunciado)}</p>
                    <p style="margin:0.5rem 0 0;font-size:0.875rem;color:#334155;">
                      <strong>Tu respuesta:</strong> ${it.sel ? it.sel + ') ' + escapeHtml(it.q.opciones[it.sel]) : 'Dejada en blanco'}
                    </p>
                    <p style="margin:0.25rem 0 0;font-size:0.875rem;color:#064E3B;">
                      <strong>Solución correcta:</strong> ${it.q.correcta}) ${escapeHtml(it.q.opciones[it.q.correcta])}
                    </p>
                    <p style="margin:0.5rem 0 0;font-size:0.875rem;line-height:1.5;color:#334155;">
                      <strong>Explicación:</strong> ${escapeHtml(it.q.explicacion)}
                    </p>
                  </article>
                `).join('')}
              </div>
            </section>
          </div>
        </main>
      `;
    }

    function requestExamFinish() {
      let answered = 0;
      for (const item of state.examQuestions) {
        if (state.examAnswers[item.id]) answered += 1;
      }
      if (state.examQuestions.length - answered > 0) {
        state.examConfirmMode = 'finish';
        render();
      } else {
        finishExam();
      }
    }

    function render() {
      const root = document.getElementById('app');

      if (state.view === 'start') {
        root.innerHTML = renderStart();
        root.querySelectorAll('.mode-btn').forEach((btn) => {
          btn.addEventListener('click', () => {
            state.mode = btn.getAttribute('data-mode');
            render();
          });
        });
        const epSel = document.getElementById('offline-epigrafe');
        if (epSel) {
          epSel.addEventListener('change', (e) => {
            const val = e.target.value;
            if (val === 'all') {
              state.scope = 'all';
            } else if (val.startsWith('tema::')) {
              state.scope = 'tema';
              state.selectedTema = val.slice('tema::'.length);
            } else if (val.startsWith('subtema::')) {
              state.scope = 'subtema';
              state.selectedSubtema = val.slice('subtema::'.length);
            }
            render();
          });
        }
        const cntSel = document.getElementById('offline-count');
        if (cntSel) {
          cntSel.addEventListener('change', (e) => {
            state.requestedCount = e.target.value === 'all' ? 'all' : Number(e.target.value);
            render();
          });
        }
        const shufEl = document.getElementById('offline-shuffle');
        if (shufEl) {
          shufEl.addEventListener('change', (e) => {
            state.shuffle = Boolean(e.target.checked);
          });
        }
        const misErrBtn = document.getElementById('offline-mis-errores');
        if (misErrBtn) {
          misErrBtn.addEventListener('click', startMisErroresSession);
        }
        document.getElementById('offline-start').addEventListener('click', () => {
          if (state.mode === 'practice') startPracticeSession();
          else startExamSession();
        });
        return;
      }

      if (state.view === 'practice') {
        root.innerHTML = renderPractice();
        const q = state.sessionQuestions[state.currentIndex];
        root.querySelectorAll('.option-btn').forEach((btn) => {
          btn.addEventListener('click', () => {
            if (state.answers[q.id]) return;
            const opt = btn.getAttribute('data-opt');
            state.answers[q.id] = opt;
            state.misErroresIds = saveMisErrores(
              updateMisErrores(state.misErroresIds, q.id, opt === q.correcta)
            );
            render();
          });
        });
        const blankBtn = document.getElementById('offline-blank');
        if (blankBtn) {
          blankBtn.addEventListener('click', () => {
            if (state.answers[q.id]) return;
            state.answers[q.id] = 'BLANK';
            state.misErroresIds = saveMisErrores(
              updateMisErrores(state.misErroresIds, q.id, false)
            );
            render();
          });
        }
        document.getElementById('offline-prev').addEventListener('click', () => {
          if (state.currentIndex > 0) {
            state.currentIndex -= 1;
            render();
          }
        });
        const nextBtn = document.getElementById('offline-next');
        if (nextBtn) {
          nextBtn.addEventListener('click', () => {
            if (state.currentIndex < state.sessionQuestions.length - 1) {
              state.currentIndex += 1;
            } else {
              state.misErroresIds = saveMisErrores(
                mergeUnansweredIntoMisErrores(
                  state.misErroresIds,
                  state.sessionQuestions,
                  state.answers
                )
              );
              state.view = 'practice_results';
            }
            render();
          });
        }
        document.getElementById('offline-restart').addEventListener('click', () => {
          if ((state.isRetryIncorrect || state.isMisErroresSession) && state.sessionQuestions.length > 0) {
            state.currentIndex = 0;
            state.answers = {};
            state.view = 'practice';
            render();
            return;
          }
          startPracticeSession();
        });
        document.getElementById('offline-home').addEventListener('click', () => {
          state.isMisErroresSession = false;
          state.isRetryIncorrect = false;
          state.view = 'start';
          render();
        });
        return;
      }

      if (state.view === 'practice_results') {
        root.innerHTML = renderPracticeResults();
        const retryBtn = document.getElementById('offline-retry-wrong');
        if (retryBtn) retryBtn.addEventListener('click', startRetryIncorrect);
        const misErrResBtn = document.getElementById('offline-res-mis-errores');
        if (misErrResBtn) misErrResBtn.addEventListener('click', startMisErroresSession);
        document.getElementById('offline-repeat').addEventListener('click', startPracticeSession);
        document.getElementById('offline-choose').addEventListener('click', () => {
          state.isMisErroresSession = false;
          state.isRetryIncorrect = false;
          state.view = 'start';
          render();
        });
        document.getElementById('offline-home-res').addEventListener('click', () => {
          state.isMisErroresSession = false;
          state.isRetryIncorrect = false;
          state.view = 'start';
          render();
        });
        return;
      }

      if (state.view === 'exam') {
        root.innerHTML = renderExam();
        const q = state.examQuestions[state.examIndex];
        root.querySelectorAll('[data-exam-opt]').forEach((btn) => {
          btn.addEventListener('click', () => {
            state.examAnswers[q.id] = btn.getAttribute('data-exam-opt');
            render();
          });
        });
        root.querySelectorAll('[data-nav]').forEach((btn) => {
          btn.addEventListener('click', () => {
            state.examIndex = Number(btn.getAttribute('data-nav'));
            render();
          });
        });
        const clearBtn = document.getElementById('offline-exam-clear');
        if (clearBtn) {
          clearBtn.addEventListener('click', () => {
            delete state.examAnswers[q.id];
            render();
          });
        }
        document.getElementById('offline-exam-prev').addEventListener('click', () => {
          if (state.examIndex > 0) {
            state.examIndex -= 1;
            render();
          }
        });
        const nextBtn = document.getElementById('offline-exam-next');
        if (nextBtn) {
          nextBtn.addEventListener('click', () => {
            if (state.examIndex < state.examQuestions.length - 1) {
              state.examIndex += 1;
              render();
            }
          });
        }
        document.getElementById('offline-exam-finish-top').addEventListener('click', requestExamFinish);
        const finishBot = document.getElementById('offline-exam-finish-bot');
        if (finishBot) finishBot.addEventListener('click', requestExamFinish);

        document.getElementById('offline-exam-exit').addEventListener('click', () => {
          state.examConfirmMode = 'exit';
          render();
        });

        const cancelConf = document.getElementById('offline-confirm-cancel');
        if (cancelConf) {
          cancelConf.addEventListener('click', () => {
            state.examConfirmMode = 'none';
            render();
          });
        }
        const okConf = document.getElementById('offline-confirm-ok');
        if (okConf) {
          okConf.addEventListener('click', () => {
            if (state.examConfirmMode === 'finish') {
              finishExam();
            } else {
              stopExamTimer();
              state.examConfirmMode = 'none';
              state.view = 'start';
              render();
            }
          });
        }
        return;
      }

      if (state.view === 'exam_results') {
        root.innerHTML = renderExamResults();
        root.querySelectorAll('[data-filter]').forEach((btn) => {
          btn.addEventListener('click', () => {
            state.examReviewFilter = btn.getAttribute('data-filter');
            render();
          });
        });
        document.getElementById('offline-new-exam').addEventListener('click', startExamSession);
        document.getElementById('offline-exam-home').addEventListener('click', () => {
          state.view = 'start';
          render();
        });
      }
    }

    render();
  </script>
</body>
</html>
