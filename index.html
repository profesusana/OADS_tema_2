<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cuestionario: Estructura del Sistema sanitario español</title>
  <style>
    :root {
      /* Start screen OADS palette */
      --oads-bg: #F8FBF5;
      --oads-soft: #F1F9E9;
      --oads-primary: #A8D889;
      --oads-dark: #558B3F;
      --oads-border: #C5E3B3;
      --oads-text: #23351B;

      /* Interior screens preserved palette */
      --bg: #F8FAFC;
      --card: #FFFFFF;
      --ink: #0F172A;
      --muted: #475569;
      --subtle: #64748B;
      --border: #E2E8F0;
      --border-strong: #CBD5E1;
      --teal: #115E59;
      --teal-hover: #134E4A;
      --teal-soft: #F0FDFA;
      --teal-border: #0F766E;
      --emerald-bg: #ECFDF5;
      --emerald-border: #059669;
      --emerald-ink: #064E3B;
      --red-bg: #FEF2F2;
      --red-border: #DC2626;
      --red-ink: #7F1D1D;
      --amber-bg: #FFFBEB;
      --amber-border: #FCD34D;
      --amber-ink: #78350F;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      min-height: 100%;
    }

    body {
      background-color: var(--bg);
      color: var(--ink);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }

    /* ---------------- START SCREEN (OADS LIGHT-GREEN MINIMALIST) ---------------- */
    .start-shell {
      min-height: 100dvh;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: var(--oads-bg);
      padding: 1.5rem 1rem;
    }

    .start-card {
      width: 100%;
      max-width: 600px;
      background: #FFFFFF;
      border: 1px solid var(--oads-border);
      border-radius: 1rem;
      padding: 1.5rem;
      box-shadow: 0 8px 28px rgba(35, 53, 27, 0.06);
    }

    @media (min-width: 640px) {
      .start-card { padding: 2.25rem; }
    }

    .start-header {
      border-bottom: 1px solid rgba(197, 227, 179, 0.75);
      padding-bottom: 1.25rem;
    }

    .start-title {
      margin: 0;
      font-size: 1.5rem;
      line-height: 1.25;
      font-weight: 700;
      letter-spacing: -0.015em;
      color: var(--oads-text);
    }

    @media (min-width: 640px) {
      .start-title { font-size: 1.875rem; }
    }

    .start-desc {
      margin: 0.65rem 0 0;
      font-size: 0.9375rem;
      line-height: 1.55;
      color: rgba(35, 53, 27, 0.82);
    }

    .start-credit {
      margin: 0.65rem 0 0;
      font-size: 0.8125rem;
      font-weight: 600;
      letter-spacing: 0.01em;
      color: var(--oads-dark);
    }

    @media (min-width: 640px) {
      .start-credit { font-size: 0.875rem; }
    }

    .start-body {
      margin-top: 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 1.15rem;
    }

    .mode-switch {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 0.5rem;
      padding: 0.25rem;
      border-radius: 0.75rem;
      border: 1px solid var(--oads-border);
      background: var(--oads-soft);
    }

    .mode-btn {
      border: none;
      border-radius: 0.55rem;
      padding: 0.625rem 0.875rem;
      font-size: 0.875rem;
      font-weight: 600;
      cursor: pointer;
      background: transparent;
      color: var(--oads-text);
      transition: background-color 0.15s ease, color 0.15s ease;
    }

    .mode-btn:hover {
      background: rgba(168, 216, 137, 0.32);
    }

    .mode-btn[aria-checked="true"] {
      background: var(--oads-dark);
      color: #FFFFFF;
      box-shadow: 0 1px 2px rgba(35, 53, 27, 0.14);
    }

    .oads-label {
      display: block;
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: var(--oads-text);
    }

    .oads-select {
      margin-top: 0.4rem;
      width: 100%;
      border: 1px solid var(--oads-border);
      border-radius: 0.75rem;
      padding: 0.65rem 0.875rem;
      font-size: 0.875rem;
      background: rgba(241, 249, 233, 0.55);
      color: var(--oads-text);
    }

    .oads-select:focus {
      outline: none;
      border-color: var(--oads-dark);
      background: #FFFFFF;
    }

    .oads-check-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.75rem 1rem;
      border-radius: 0.75rem;
      border: 1px solid var(--oads-border);
      background: rgba(241, 249, 233, 0.42);
      font-size: 0.875rem;
      font-weight: 500;
      color: var(--oads-text);
      cursor: pointer;
    }

    .oads-check-row:hover {
      background: var(--oads-soft);
    }

    .oads-check-row input[type="checkbox"] {
      width: 1rem;
      height: 1rem;
      accent-color: var(--oads-dark);
      cursor: pointer;
    }

    .oads-errors-btn {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid var(--oads-border);
      border-radius: 0.75rem;
      background: var(--oads-soft);
      color: var(--oads-text);
      padding: 0.65rem 1rem;
      font-size: 0.875rem;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.15s ease, border-color 0.15s ease;
    }

    .oads-errors-btn:hover {
      border-color: var(--oads-dark);
      background: rgba(168, 216, 137, 0.35);
    }

    .oads-exam-info {
      border: 1px solid var(--oads-border);
      border-radius: 0.75rem;
      background: var(--oads-soft);
      color: var(--oads-text);
      padding: 1rem;
      text-align: center;
      font-size: 0.9375rem;
      font-weight: 600;
    }

    .oads-start-btn {
      width: 100%;
      border: none;
      border-radius: 0.75rem;
      background: var(--oads-dark);
      color: #FFFFFF;
      padding: 0.875rem 1.5rem;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.15s ease;
    }

    .oads-start-btn:hover {
      background: var(--oads-text);
    }

    /* ---------------- INTERIOR SCREENS (FULL VIEWPORT & ORIGINAL PALETTE) ---------------- */
    .interior-shell {
      min-height: 100dvh;
      width: 100%;
      display: flex;
      flex-direction: column;
      background-color: var(--bg);
      padding: 0.75rem;
    }

    @media (min-width: 640px) {
      .interior-shell { padding: 1rem 1.5rem; }
    }

    .interior-inner {
      width: 100%;
      max-width: 72rem;
      margin: 0 auto;
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    .results-shell {
      min-height: 100dvh;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: var(--bg);
      padding: 1.5rem 1rem;
    }

    .results-scroll-shell {
      min-height: 100dvh;
      width: 100%;
      background-color: var(--bg);
      padding: 1.5rem 1rem 2.5rem;
    }

    @media (min-width: 640px) {
      .results-scroll-shell { padding: 2rem 1.5rem 3rem; }
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 1rem;
      padding: 1rem;
      box-shadow: 0 1px 2px rgba(15, 23, 42, 0.04);
    }

    @media (min-width: 640px) {
      .card { padding: 1.5rem; }
    }

    .quiz-card {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .quiz-topbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 0.5rem;
      margin-bottom: 0.625rem;
    }

    .stats-line {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.45rem;
      font-size: 0.8125rem;
      color: var(--muted);
    }

    @media (min-width: 640px) {
      .stats-line { font-size: 0.875rem; }
    }

    .stats-line .strong { font-weight: 600; color: var(--ink); }
    .stats-line .teal { font-weight: 600; color: var(--teal); }
    .stats-line .ok { font-weight: 600; color: #047857; }
    .stats-line .err { font-weight: 600; color: #B91C1C; }

    .actions-inline {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.5rem;
    }

    .timer-pill {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      border: 1px solid var(--border-strong);
      border-radius: 0.5rem;
      background: #FFFFFF;
      color: var(--ink);
      padding: 0.35rem 0.7rem;
      font-size: 0.8125rem;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
    }

    .timer-pill.is-low {
      border-color: #FBBF24;
      background: var(--amber-bg);
      color: var(--amber-ink);
    }

    .progress-track {
      height: 0.375rem;
      width: 100%;
      background: #E2E8F0;
      border-radius: 999px;
      overflow: hidden;
      margin-bottom: 0.75rem;
    }

    .progress-fill {
      height: 100%;
      background: var(--teal-border);
      border-radius: 999px;
      transition: width 0.2s ease;
    }

    .breadcrumb {
      margin: 0;
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--teal);
    }

    .question-header {
      border-bottom: 1px solid #F1F5F9;
      padding-bottom: 0.75rem;
    }

    .question-stem {
      margin: 0.4rem 0 0;
      font-size: 1rem;
      line-height: 1.4;
      font-weight: 600;
      color: var(--ink);
    }

    @media (min-width: 640px) {
      .question-stem { font-size: 1.125rem; }
    }

    .options-list {
      margin-top: 0.875rem;
      display: grid;
      grid-template-columns: 1fr;
      gap: 0.625rem;
    }

    @media (min-width: 768px) {
      .options-list {
        grid-template-columns: repeat(2, 1fr);
        gap: 0.75rem;
      }
    }

    .option-btn {
      display: flex;
      align-items: flex-start;
      gap: 0.75rem;
      width: 100%;
      height: 100%;
      text-align: left;
      background: #FFFFFF;
      border: 1px solid var(--border);
      border-radius: 0.75rem;
      padding: 0.75rem 0.875rem;
      color: #1E293B;
      cursor: pointer;
      transition: background-color 0.15s ease, border-color 0.15s ease;
    }

    .option-btn:hover:not(:disabled) {
      border-color: var(--teal-border);
      background: var(--teal-soft);
    }

    .option-btn:disabled { cursor: default; }

    .option-letter {
      flex-shrink: 0;
      width: 1.5rem;
      height: 1.5rem;
      margin-top: 0.1rem;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 0.4rem;
      border: 1px solid var(--border-strong);
      background: #F8FAFC;
      font-size: 0.75rem;
      font-weight: 700;
      color: #334155;
    }

    .option-text {
      flex: 1;
      font-size: 0.875rem;
      line-height: 1.4;
    }

    @media (min-width: 640px) {
      .option-text { font-size: 0.9375rem; }
    }

    .option-tag {
      flex-shrink: 0;
      font-size: 0.75rem;
      font-weight: 700;
      margin-top: 0.15rem;
    }

    .option-btn.is-selected {
      border-color: var(--teal-border);
      background: var(--teal-soft);
      color: #0F172A;
    }

    .option-btn.is-selected .option-letter {
      border-color: var(--teal);
      background: var(--teal);
      color: #FFFFFF;
    }

    .option-btn.is-correct {
      border-color: var(--emerald-border);
      background: var(--emerald-bg);
      color: var(--emerald-ink);
    }
    .option-btn.is-correct .option-letter {
      border-color: #047857;
      background: #047857;
      color: #FFFFFF;
    }
    .option-btn.is-correct .option-tag { color: #065F46; }

    .option-btn.is-wrong {
      border-color: var(--red-border);
      background: var(--red-bg);
      color: var(--red-ink);
    }
    .option-btn.is-wrong .option-letter {
      border-color: #B91C1C;
      background: #B91C1C;
      color: #FFFFFF;
    }
    .option-btn.is-wrong .option-tag { color: #991B1B; }

    .option-btn.is-dimmed {
      background: #F8FAFC;
      color: #64748B;
    }

    .feedback-box {
      margin-top: 0.875rem;
      border-radius: 0.75rem;
      padding: 0.875rem 1rem;
      border: 1px solid transparent;
    }

    .feedback-box.ok {
      background: var(--emerald-bg);
      border-color: #A7F3D0;
      color: var(--emerald-ink);
    }

    .feedback-box.err {
      background: var(--red-bg);
      border-color: #FECACA;
      color: var(--red-ink);
    }

    .feedback-box.blank {
      background: #F8FAFC;
      border-color: var(--border-strong);
      color: var(--ink);
    }

    .feedback-title { font-weight: 700; font-size: 0.875rem; }
    .feedback-exp { margin: 0.35rem 0 0; font-size: 0.875rem; line-height: 1.5; color: #1E293B; }

    .exam-nav {
      margin-top: 1rem;
      padding-top: 0.75rem;
      border-top: 1px solid #F1F5F9;
      display: flex;
      flex-wrap: wrap;
      gap: 0.35rem;
    }

    .exam-nav-btn {
      height: 1.75rem;
      min-width: 1.75rem;
      padding: 0 0.4rem;
      border-radius: 0.375rem;
      border: 1px solid var(--border);
      background: #FFFFFF;
      color: #475569;
      font-size: 0.75rem;
      font-weight: 600;
      cursor: pointer;
    }

    .exam-nav-btn.is-answered {
      border-color: #5EEAD4;
      background: var(--teal-soft);
      color: var(--teal);
    }

    .exam-nav-btn.is-current {
      border-color: var(--teal);
      background: var(--teal);
      color: #FFFFFF;
    }

    .confirm-banner {
      margin-bottom: 0.75rem;
      border-radius: 0.75rem;
      border: 1px solid #FCD34D;
      background: var(--amber-bg);
      color: var(--amber-ink);
      padding: 0.75rem 1rem;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
      font-size: 0.875rem;
      font-weight: 500;
    }

    .quiz-footer {
      margin-top: 1rem;
      padding-top: 0.875rem;
      border-top: 1px solid #F1F5F9;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 0.625rem;
    }

    .btn-primary {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.45rem;
      background: var(--teal);
      color: #FFFFFF;
      border: none;
      border-radius: 0.75rem;
      padding: 0.65rem 1.25rem;
      font-size: 0.875rem;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.15s ease;
    }

    .btn-primary:hover { background: var(--teal-hover); }

    .btn-secondary {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.4rem;
      background: #FFFFFF;
      color: #334155;
      border: 1px solid var(--border-strong);
      border-radius: 0.75rem;
      padding: 0.55rem 0.95rem;
      font-size: 0.875rem;
      font-weight: 500;
      cursor: pointer;
      transition: background-color 0.15s ease;
    }

    .btn-secondary:hover:not(:disabled) { background: #F8FAFC; }
    .btn-secondary:disabled { opacity: 0.45; cursor: not-allowed; }

    .btn-compact {
      padding: 0.375rem 0.7rem;
      font-size: 0.75rem;
      border-radius: 0.5rem;
    }

    .btn-primary.btn-compact {
      padding: 0.4rem 0.75rem;
      font-size: 0.75rem;
      border-radius: 0.5rem;
    }

    /* ---------------- RESULTS ---------------- */
    .results-wrap {
      width: 100%;
      max-width: 56rem;
    }

    .exam-results-wrap {
      width: 100%;
      max-width: 64rem;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
    }

    .eyebrow {
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--teal);
    }

    .results-title {
      margin: 0.5rem 0 0;
      font-size: 1.75rem;
      line-height: 1.2;
      font-weight: 700;
      color: var(--ink);
    }

    .results-lead {
      margin: 0.6rem 0 0;
      color: var(--muted);
      font-size: 0.9375rem;
    }

    .metrics-grid {
      margin-top: 1.5rem;
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 0.875rem;
    }

    @media (min-width: 640px) {
      .metrics-grid { grid-template-columns: repeat(5, 1fr); }
      .metrics-grid.cols-4 { grid-template-columns: repeat(4, 1fr); }
    }

    .metric-card {
      border: 1px solid var(--border);
      background: #F8FAFC;
      border-radius: 0.75rem;
      padding: 0.9rem 1rem;
    }

    .metric-card.ok { border-color: #A7F3D0; background: var(--emerald-bg); }
    .metric-card.err { border-color: #FECACA; background: var(--red-bg); }
    .metric-card.grade-pass { border-color: #5EEAD4; background: var(--teal-soft); }
    .metric-card.grade-fail { border-color: var(--amber-border); background: var(--amber-bg); }

    .metric-label { display: block; font-size: 0.75rem; font-weight: 600; color: var(--muted); }
    .metric-value { display: block; margin-top: 0.25rem; font-size: 1.5rem; font-weight: 700; color: var(--ink); }

    .exam-header-flex {
      display: flex;
      flex-direction: column;
      gap: 1rem;
      border-bottom: 1px solid var(--border);
      padding-bottom: 1.25rem;
    }

    @media (min-width: 640px) {
      .exam-header-flex {
        flex-direction: row;
        align-items: center;
        justify-content: space-between;
      }
    }

    .grade-callout {
      border-radius: 1rem;
      border: 1px solid #5EEAD4;
      background: var(--teal-soft);
      color: #134E4A;
      padding: 1rem 1.75rem;
      text-align: center;
    }

    .grade-callout.is-fail {
      border-color: var(--amber-border);
      background: var(--amber-bg);
      color: var(--amber-ink);
    }

    .grade-callout-label {
      display: block;
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }

    .grade-callout-num {
      display: block;
      margin-top: 0.2rem;
      font-size: 2.5rem;
      line-height: 1.1;
      font-weight: 700;
    }

    .results-actions {
      margin-top: 1.5rem;
      padding-top: 1.25rem;
      border-top: 1px solid var(--border);
      display: flex;
      flex-wrap: wrap;
      gap: 0.625rem;
    }

    .review-header {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
      border-bottom: 1px solid var(--border);
      padding-bottom: 1rem;
    }

    .review-filters {
      display: flex;
      flex-wrap: wrap;
      gap: 0.375rem;
    }

    .filter-pill {
      border: 1px solid var(--border);
      background: #FFFFFF;
      color: #334155;
      border-radius: 0.5rem;
      padding: 0.375rem 0.75rem;
      font-size: 0.75rem;
      font-weight: 600;
      cursor: pointer;
    }

    .filter-pill.is-active {
      border-color: var(--teal);
      background: var(--teal);
      color: #FFFFFF;
    }

    .review-list {
      margin-top: 1.15rem;
      display: flex;
      flex-direction: column;
      gap: 0.875rem;
    }

    .review-item {
      border-radius: 0.75rem;
      border: 1px solid var(--border);
      background: #F8FAFC;
      padding: 1rem;
    }

    .review-item.ok { border-color: #A7F3D0; background: rgba(236, 253, 245, 0.45); }
    .review-item.err { border-color: #FECACA; background: rgba(254, 242, 242, 0.45); }

    .review-meta {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      gap: 0.5rem;
      font-size: 0.75rem;
      font-weight: 700;
    }

    button:focus-visible, select:focus-visible {
      outline: 2px solid var(--teal-border);
      outline-offset: 2px;
    }

    .start-shell button:focus-visible, .start-shell select:focus-visible {
      outline-color: var(--oads-dark);
    }

    @media (prefers-reduced-motion: reduce) {
      * { transition: none !important; }
    }
  </style>
</head>
<body>
  <div id="app"></div>

  <script>
    const QUESTIONS = [{"id":1,"tema":"1. Evolución del Sistema sanitario","subtema":"1.0. Orígenes históricos y modelos de Seguridad Social","enunciado":"Un historiador analiza cómo un artesano del siglo XII afrontaba una enfermedad prolongada en su ciudad. Según la evolución descrita en el tema, ¿qué mecanismo colectivo surgido en ese periodo le ofrecía apoyo solidario y qué limitación presentaba?","opciones":{"A":"El acceso a hospitales financiados íntegramente por el Estado, aunque restringido a quienes pagaban impuestos reales directos.","B":"La pertenencia a cofradías vinculadas a los gremios, cuyas ayudas basadas en cuotas solían resultar insuficientes.","C":"La cobertura mediante seguros privados obligatorios, cuya prima dependía del nivel de riesgo laboral de cada oficio.","D":"La protección automática a través de la beneficencia municipal, aunque limitada únicamente a situaciones de invalidez permanente."},"correcta":"B","explicacion":"Entre los siglos V y XV (Edad Media) surgieron las cofradías vinculadas a los gremios, consideradas las primeras sociedades de socorro mutuo. Se financiaban con cuotas de sus asociados para ayudar solidariamente en casos de enfermedad o muerte, aunque casi siempre resultaban insuficientes. La beneficencia pública de los Ayuntamientos no interviene hasta el siglo XVIII, y los seguros obligatorios o la financiación estatal corresponden a los siglos XIX y XX."},{"id":2,"tema":"1. Evolución del Sistema sanitario","subtema":"1.0. Orígenes históricos y modelos de Seguridad Social","enunciado":"Al comparar la protección social del siglo XVIII con la de los siglos V-XV en Europa, ¿qué cambio institucional concreto explica la mejora en la organización y en las prestaciones de las sociedades de socorro mutuo?","opciones":{"A":"La sustitución completa de las cuotas de los asociados por un sistema fiscal progresivo de ámbito estatal.","B":"La creación de mutuas empresariales obligatorias supervisadas por el Ministerio de Trabajo en cada ciudad.","C":"La unificación de todas las cofradías gremiales bajo un código laboral internacional de carácter universal.","D":"La intervención de la beneficencia pública, asumida fundamentalmente por los Ayuntamientos junto a dichas sociedades."},"correcta":"D","explicacion":"En el siglo XVIII las sociedades de socorro mutuo mejoraron su organización y prestaciones gracias a que se sumó la intervención de la beneficencia pública, ejercida fundamentalmente por los Ayuntamientos. Las opciones A, B y C introducen elementos propios de etapas contemporáneas muy posteriores que no existían en el siglo XVIII."},{"id":3,"tema":"1. Evolución del Sistema sanitario","subtema":"1.0. Orígenes históricos y modelos de Seguridad Social","enunciado":"Antes de la aparición de las organizaciones colectivas de protección en la Edad Media, ¿por qué fracasaba habitualmente la estrategia individual para afrontar contingencias como la invalidez o el desempleo?","opciones":{"A":"Porque los ingresos acumulados mediante el trabajo resultaban insuficientes en la mayoría de los casos para cubrir todos los riesgos posibles.","B":"Porque las normas gremiales impedían reservar capital privado destinado a sufragar cuidados médicos o periodos prolongados de inactividad.","C":"Porque los concejos municipales retenían las reservas familiares cada vez que un trabajador causaba baja por enfermedad grave o accidente.","D":"Porque las compañías aseguradoras de la época imponían periodos de carencia superiores a la esperanza de vida media de los artesanos."},"correcta":"A","explicacion":"A lo largo de la historia, antes de los sistemas organizados, el individuo hacía frente a la enfermedad, la invalidez o el desempleo mediante los ahorros obtenidos como compensación económica por su trabajo, pero ese dinero era insuficiente en la mayor parte de los casos para afrontar todos los riesgos posibles. Las demás opciones inventan restricciones legales o instituciones inexistentes en ese periodo."},{"id":4,"tema":"1. Evolución del Sistema sanitario","subtema":"1.0. Orígenes históricos y modelos de Seguridad Social","enunciado":"En un debate académico sobre el origen del primer sistema de Seguridad Social propiamente dicho en Alemania, un estudiante afirma que se debió únicamente a la iniciativa filantrópica de los gremios tradicionales. ¿Qué contexto histórico de finales del siglo XIX explica realmente aquel proyecto?","opciones":{"A":"La reforma sanitaria impulsada por un informe parlamentario británico que recomendaba unificar prestaciones y cotizaciones.","B":"La recesión financiera internacional de finales de siglo que obligó a crear seguros voluntarios de emergencia estatal.","C":"El empeoramiento social de los trabajadores tras la crisis de 1884, la industrialización y el trabajo de mujeres y niños.","D":"La presión de las corporaciones municipales europeas para sustituir la beneficencia local por impuestos generales directos."},"correcta":"C","explicacion":"El proyecto de «Aseguramiento de los Trabajadores» presentado por Otto von Bismarck en Alemania respondió al empeoramiento de la situación social obrera derivado de acontecimientos como la crisis económica de 1884, el crecimiento de las zonas industriales y la incorporación de mujeres y niños al trabajo. La ley de seguros de emergencia corresponde a EE. UU. (1935) y el informe parlamentario al Reino Unido (Beveridge, 1942)."},{"id":5,"tema":"1. Evolución del Sistema sanitario","subtema":"1.0. Orígenes históricos y modelos de Seguridad Social","enunciado":"Un equipo de salud pública compara las reformas históricas de EE. UU. (1935) y Reino Unido (1942). Si un país adopta estrictamente el modelo planteado por F. D. Roosevelt en 1935, ¿qué rasgo definitorio presentará su sistema?","opciones":{"A":"Cobertura dirigida a obreros industriales, prestaciones de accidente laboral y financiación íntegra mediante cuotas empresariales obligatorias.","B":"Carácter universal no limitado a trabajadores, cobertura restringida a emergencias y cofinanciación entre Estado y seguros voluntarios.","C":"Tipo único de prestación para trabajadores, cobertura integral sanitaria y financiación conjunta mediante cotizaciones y presupuestos estatales.","D":"Gestión descentralizada en áreas comarcales, cobertura de contingencias comunes y financiación mediante tasas municipales sobre el consumo."},"correcta":"B","explicacion":"La Ley de Seguridad Social de 1935 impulsada por F. D. Roosevelt tras la crisis de 1929 se caracteriza por su carácter universal (no limitado a trabajadores), por cubrir únicamente situaciones de emergencia y por su cofinanciación entre el Estado y los seguros voluntarios (aportaciones de los trabajadores). La opción C describe rasgos del modelo de Beveridge (1942)."},{"id":6,"tema":"1. Evolución del Sistema sanitario","subtema":"1.0. Orígenes históricos y modelos de Seguridad Social","enunciado":"El informe presentado en 1942 por el parlamentario británico W. H. Beveridge supuso un punto de inflexión en la reforma de la Seguridad Social. ¿Qué combinación de principios resume exactamente su propuesta?","opciones":{"A":"Cobertura para todos los trabajadores, tipo único de prestación y financiación mediante cotizaciones y presupuestos estatales.","B":"Cobertura restringida a emergencias, prestaciones diferenciadas por gremio y financiación mediante seguros voluntarios y cuotas locales.","C":"Cobertura limitada a asalariados industriales, prestaciones proporcionales a la renta y financiación mediante tasas municipales directas.","D":"Cobertura voluntaria para artesanos, prestaciones concertadas con clínicas privadas y financiación mediante primas individuales de riesgo."},"correcta":"A","explicacion":"El documento señala de forma explícita tres ideas fundamentales del modelo de W. H. Beveridge (1942): cobertura para todos los trabajadores, un tipo único de prestación y financiación conjunta por cotizaciones y presupuestos del Estado. Las restantes alternativas mezclan rasgos de la ley estadounidense de 1935, del modelo gremial o del aseguramiento privado."},{"id":7,"tema":"1. Evolución del Sistema sanitario","subtema":"1.0. Orígenes históricos y modelos de Seguridad Social","enunciado":"Al clasificar los dos grandes modelos teóricos de sistemas de Seguridad Social en Europa y América, ¿qué pareja de autores corresponde correctamente a la denominación «modelo universal o atlántico»?","opciones":{"A":"Otto von Bismarck y W. H. Beveridge, por impulsar conjuntamente el aseguramiento obligatorio de los trabajadores industriales europeos.","B":"Otto von Bismarck y F. D. Roosevelt, por unificar las cofradías gremiales medievales con las corporaciones benéficas municipales.","C":"W. H. Beveridge y los legisladores españoles de 1974, por establecer un sistema contributivo basado en caja única nacional.","D":"F. D. Roosevelt y W. H. Beveridge, por configurar las bases del modelo universal frente al continental de Bismarck."},"correcta":"D","explicacion":"Según el esquema de modelos de sistemas de Seguridad Social, se distinguen dos modelos: el modelo profesional o continental (Bismarck) y el modelo universal o atlántico (Roosevelt-Beveridge). Las demás opciones asocian erróneamente a Bismarck con el modelo atlántico o incluyen la ley española de 1974, que siguió el modelo continental."},{"id":8,"tema":"1. Evolución del Sistema sanitario","subtema":"1.0. Orígenes históricos y modelos de Seguridad Social","enunciado":"Un Estado recién constituido debe decidir si implanta el modelo profesional (Bismarck) o el modelo universal (Roosevelt-Beveridge). De acuerdo con el tema, ¿de qué depende finalmente la elección de uno u otro modelo por parte de los países?","opciones":{"A":"De las directrices técnicas vinculantes emitidas por las conferencias médicas internacionales de cada periodo histórico.","B":"Del porcentaje del Producto Interior Bruto que las aseguradoras privadas decidan invertir en centros hospitalarios.","C":"De la orientación política de cada país y de sus criterios propios de capacidad y oportunidad.","D":"Del volumen previo de cofradías gremiales y beneficencia municipal heredado por el país desde la Edad Media."},"correcta":"C","explicacion":"El texto explica que, una vez configurados los dos modelos (profesional o continental y universal o atlántico), los diferentes países adoptan uno u otro modelo según su orientación política y criterios de capacidad y oportunidad."},{"id":9,"tema":"1. Evolución del Sistema sanitario","subtema":"1.0. Orígenes históricos y modelos de Seguridad Social","enunciado":"Un trabajador sufre una incapacidad temporal derivada de un accidente no laboral que deja sin ingresos a su familia durante dos meses. ¿Cómo justifica el concepto general de «Sistemas de Seguridad Social» la intervención estatal en este supuesto?","opciones":{"A":"Como un conjunto de medidas estatales destinadas a remediar situaciones de necesidad de los trabajadores y familiares a su cargo.","B":"Como una indemnización comercial equivalente a las pólizas de seguro libre contratadas por cualquier ciudadano con patrimonio.","C":"Como una prestación caritativa discrecional financiada por los ayuntamientos cuando se agotan los ahorros de las cofradías.","D":"Como un crédito reembolsable concedido por el Estado para compensar temporalmente los gastos médicos derivados de urgencias."},"correcta":"A","explicacion":"Los Sistemas de Seguridad Social se definen como un conjunto de medidas establecidas por un Estado que intentan remediar ciertas situaciones de necesidad, tanto de los propios trabajadores como de los familiares a su cargo (desempleo, incapacidad por enfermedad o accidente, maternidad, invalidez, jubilación o muerte del trabajador)."},{"id":10,"tema":"1. Evolución del Sistema sanitario","subtema":"1.0. Orígenes históricos y modelos de Seguridad Social","enunciado":"¿Qué error histórico cometería un alumno si afirmara que la implantación de la Seguridad Social en España siguió desde 1900 el modelo atlántico de forma inmediata y simultánea al resto de Europa?","opciones":{"A":"Desconocer que España adoptó en 1900 el sistema británico Beveridge mediante una reforma fiscal de implantación instantánea.","B":"Ignorar que España suprimió los seguros voluntarios hasta 1974 bajo influencia directa de la crisis económica de 1929.","C":"Confundir el modelo español con el alemán de 1884, cuando España replicó el sistema estadounidense de beneficencia federal.","D":"Pasar por alto que España optó por el modelo continental alemán con implantación tardía y seguros parciales hasta 1963."},"correcta":"D","explicacion":"En España se optó por el modelo alemán o continental (Bismarck), pero su implantación fue tardía: entre 1900 y 1963 se fueron creando distintos seguros (primero voluntarios y luego obligatorios, como accidentes de tráfico o enfermedad) y las instituciones gestoras, culminando en 1974 con la Ley General de Seguridad Social."},{"id":11,"tema":"1. Evolución del Sistema sanitario","subtema":"1.1. La Seguridad Social en España","enunciado":"Si tuvieras que situar en una línea temporal el paso desde la etapa inicial de seguros dispersos en España hasta la consolidación normativa de la Seguridad Social, ¿qué hito marca el año 1974?","opciones":{"A":"La aprobación de la Ley General de Sanidad que sustituyó el modelo contributivo por impuestos generales.","B":"La creación de las primeras cofradías de socorro mutuo bajo tutela de las corporaciones locales españolas.","C":"La publicación de la Ley General de Seguridad Social, tras el periodo 1900-1963 de creación de seguros e instituciones.","D":"La transferencia definitiva de la gestión sanitaria a las diez comunidades autónomas restantes mediante Reales Decretos."},"correcta":"C","explicacion":"Según el cuadro cronológico de la implantación en España, desde 1900 hasta 1963 se crearon diferentes seguros (primero voluntarios y después obligatorios) e instituciones gestoras, y en 1974 se publicó la Ley General de Seguridad Social. La Ley General de Sanidad es de 1986 y las transferencias a las diez comunidades restantes tuvieron efecto el 1 de enero de 2002."},{"id":12,"tema":"1. Evolución del Sistema sanitario","subtema":"1.1. La Seguridad Social en España","enunciado":"En una empresa, tanto los trabajadores como el empresario realizan aportaciones en función de las rentas percibidas, ingresándose todo ello en un fondo común. ¿A qué principio fundamental de la Ley General de Seguridad Social responde este mecanismo?","opciones":{"A":"Cotización obligatoria con creación de un sistema de caja única como criterio de solidaridad financiera.","B":"Financiación exclusiva mediante tasas locales destinadas a sufragar las pólizas de seguro libre privado.","C":"Afiliación voluntaria de cada trabajador en función de su historial previo de enfermedades crónicas.","D":"Descentralización completa de las cotizaciones hacia cajas independientes gestionadas por cada ayuntamiento."},"correcta":"A","explicacion":"Uno de los principios fundamentales de la Ley General de Seguridad Social es la cotización obligatoria, que comprende aportaciones de trabajadores y empresarios en función de la renta, creando un sistema de caja única como criterio de solidaridad financiera."},{"id":13,"tema":"1. Evolución del Sistema sanitario","subtema":"1.1. La Seguridad Social en España","enunciado":"Una mutua de accidentes de trabajo colabora en determinados aspectos de la gestión sanitaria de los trabajadores asegurados. ¿Por qué esta colaboración resulta compatible con los principios de la Ley General de Seguridad Social?","opciones":{"A":"Porque la normativa restringe la gestión directa pública a las prestaciones económicas de jubilación y desempleo.","B":"Porque el sistema delega la totalidad de la asistencia sanitaria ordinaria en entidades mercantiles de seguro privado.","C":"Porque la tendencia a la unidad de gestión admite excepciones aplicables a los trabajadores de regímenes especiales agrarios.","D":"Porque la tendencia a la unidad de gestión prevista en la ley admite la colaboración de entes privados."},"correcta":"D","explicacion":"Entre los principios de la Ley General de Seguridad Social figura la simplificación de entidades gestoras y la tendencia a la unidad de gestión, admitiéndose expresamente la colaboración de entes privados o no estatales."},{"id":14,"tema":"1. Evolución del Sistema sanitario","subtema":"1.1. La Seguridad Social en España","enunciado":"¿Cuál de las siguientes afirmaciones describe incorrectamente uno de los principios fundamentales establecidos en la Ley General de Seguridad Social española?","opciones":{"A":"La afiliación al sistema tiene carácter obligatorio para los sujetos incluidos en su ámbito protector.","B":"La financiación procede íntegramente de cotizaciones obreras sin ninguna aportación de los Presupuestos Generales del Estado.","C":"Se definen y concretan su acción protectora y el campo de asistencia sanitaria, regulando las contingencias cubiertas.","D":"Se simplifica el número de entidades gestoras y servicios, estructurándose dos regímenes de inclusión: general y especiales."},"correcta":"B","explicacion":"Es falso que el Estado no aporte fondos: entre los principios de la Ley General de Seguridad Social se incluye expresamente la financiación por el Estado a través de los Presupuestos Generales, además de la cotización obligatoria de trabajadores y empresarios, el carácter universal, la afiliación obligatoria, los dos regímenes de inclusión y la simplificación de entidades gestoras."},{"id":15,"tema":"1. Evolución del Sistema sanitario","subtema":"1.1. La Seguridad Social en España","enunciado":"Una trabajadora administrativa contratada por cuenta ajena en una fábrica textil y un violinista profesional de una orquesta se incorporan al mercado laboral. ¿Cómo clasifica el Sistema de la Seguridad Social a ambos trabajadores?","opciones":{"A":"Ambos quedan integrados en el régimen general al percibir remuneración estable dentro de empresas de servicios o industria.","B":"La administrativa pertenece a un régimen especial industrial y el violinista queda sujeto a afiliación de carácter voluntario.","C":"La administrativa ingresa en el régimen general y el violinista en un régimen especial por su actividad peculiar.","D":"Ambos se encuadran en regímenes especiales diferenciados para separar la actividad fabril de la actividad artística profesional."},"correcta":"C","explicacion":"El régimen general incluye a los trabajadores por cuenta ajena de la industria y servicios (como la administrativa de una fábrica), mientras que los regímenes especiales incluyen actividades que por su naturaleza, peculiaridades de tiempo y lugar o procesos productivos requieren diferenciación, citando expresamente el documento a trabajadores agrarios, músicos, artistas y escritores."},{"id":16,"tema":"1. Evolución del Sistema sanitario","subtema":"1.1. La Seguridad Social en España","enunciado":"¿Qué criterio justifica en la Seguridad Social española la existencia de regímenes especiales diferenciados del régimen general?","opciones":{"A":"La preferencia del trabajador por reducir su cuota mensual renunciando a determinadas prestaciones sanitarias de larga duración.","B":"La residencia del trabajador en comunidades autónomas que aún mantienen pendiente la transferencia sanitaria del Estado.","C":"La suscripción simultánea de una póliza complementaria en una entidad de seguro libre con periodo de carencia reducido.","D":"La naturaleza de la actividad profesional, sus peculiaridades de tiempo y lugar o las características productivas propias."},"correcta":"D","explicacion":"Los regímenes especiales agrupan a trabajadores con una actividad profesional que, por su naturaleza, peculiaridades de tiempo y lugar o de procesos productivos, hace necesario diferenciarlos del régimen general (agrarios, músicos, artistas, escritores, trabajadores del mar, etc.)."},{"id":17,"tema":"1. Evolución del Sistema sanitario","subtema":"1.1. La Seguridad Social en España","enunciado":"Un trabajador del campo, un escritor y una operaria de una planta de automoción por cuenta ajena consultan su encuadramiento en la Seguridad Social. ¿Quién de ellos pertenece al régimen general?","opciones":{"A":"La operaria de la planta de automoción, al ser trabajadora por cuenta ajena perteneciente al ámbito de la industria.","B":"El trabajador del campo, al desarrollar una actividad primaria esencial regulada por el régimen común de servicios.","C":"El escritor, ya que toda actividad intelectual autónoma se integra directamente en el régimen general de servicios.","D":"Ninguno de los tres, puesto que tanto la industria como la agricultura y la creación literaria tienen regímenes especiales."},"correcta":"A","explicacion":"El régimen general incluye a todos los trabajadores por cuenta ajena de la industria y los servicios. Por el contrario, los trabajadores agrarios y los escritores aparecen explícitamente en el texto como ejemplos de regímenes especiales."},{"id":18,"tema":"1. Evolución del Sistema sanitario","subtema":"1.1. La Seguridad Social en España","enunciado":"En el ámbito de la Ley General de Seguridad Social, ¿qué alcance exacto define el concepto jurídico de «contingencia»?","opciones":{"A":"El límite temporal inicial durante el cual un trabajador afiliado carece de cobertura frente a enfermedades preexistentes.","B":"La situación de riesgo que genera una necesidad de protección para el individuo, ya sea común o profesional.","C":"La modalidad de inclusión diferenciada aplicable a trabajadores con peculiaridades de tiempo, lugar o proceso productivo.","D":"La aportación proporcional a la renta que ingresa en la caja única para financiar las prestaciones económicas básicas."},"correcta":"B","explicacion":"El documento define «contingencias» como los riesgos a cubrir regulados por la ley, es decir, cualquier situación que origina una necesidad de protección para el individuo, diferenciándose entre contingencias comunes y contingencias profesionales. Las demás opciones definen el periodo de carencia, los regímenes especiales y la cotización obligatoria."},{"id":19,"tema":"1. Evolución del Sistema sanitario","subtema":"1.1. La Seguridad Social en España","enunciado":"Un técnico de laboratorio contrae una gastroenteritis tras cenar en su domicilio el fin de semana, lo que le impide acudir a su puesto de trabajo durante cuatro días. ¿Cómo debe calificarse esta situación en la Seguridad Social?","opciones":{"A":"Como contingencia profesional, porque el estado de salud repercute directamente en el rendimiento de su labor profesional.","B":"Como enfermedad profesional, al tratarse de un proceso infeccioso que afecta a un trabajador del sector sanitario.","C":"Como accidente de trabajo in itinere, al producirse dentro del periodo habitual de descanso semanal del trabajador.","D":"Como contingencia común, al tratarse de una enfermedad común no relacionada con el puesto de trabajo desempeñado."},"correcta":"D","explicacion":"El cuadro sobre contingencias pone precisamente como ejemplo de contingencia común una gastroenteritis o una fractura ósea fuera del trabajo, ya que es una enfermedad común o accidente que puede afectar a cualquier persona sin relación directa con el puesto de trabajo desempeñado."},{"id":20,"tema":"1. Evolución del Sistema sanitario","subtema":"1.1. La Seguridad Social en España","enunciado":"Una operaria sufre una fractura ósea al resbalar mientras manipulaba una máquina durante su jornada laboral en la fábrica. ¿Por qué se clasifica este suceso como contingencia profesional y no como contingencia común?","opciones":{"A":"Porque cualquier fractura ósea que requiera ingreso hospitalario queda encuadrada como contingencia profesional.","B":"Porque la operaria cotiza dentro del régimen general de la industria y no en un régimen especial agrario.","C":"Porque constituye un accidente laboral ocurrido directamente durante el desempeño de su labor profesional.","D":"Porque las contingencias comunes abarcan enfermedades infecciosas comunes y dejan fuera los traumatismos físicos."},"correcta":"C","explicacion":"Una fractura ósea puede ser contingencia común si ocurre en la vida cotidiana, pero en este caso se produce durante el desempeño de la labor profesional, por lo que constituye un accidente laboral y, por tanto, una contingencia profesional (afección relacionada directamente con el puesto de trabajo desempeñado)."},{"id":21,"tema":"1. Evolución del Sistema sanitario","subtema":"1.1. La Seguridad Social en España","enunciado":"Un minero desarrolla una patología respiratoria crónica tras años expuesto al polvo en la extracción subterránea. A efectos de la Ley General de Seguridad Social, ¿qué categoría exacta corresponde a esta afección?","opciones":{"A":"Contingencia profesional en forma de enfermedad contraída o desarrollada como consecuencia del tipo de trabajo realizado.","B":"Contingencia común derivada de la predisposición biológica individual y ajena al proceso productivo de la empresa.","C":"Situación excluida de la acción protectora al tratarse de una enfermedad crónica que supera la asistencia temporal.","D":"Servicio social complementario reservado a trabajadores con discapacidad sobrevenida tras alcanzar la edad de jubilación."},"correcta":"A","explicacion":"Dentro de las contingencias profesionales se incluyen tanto los accidentes laborales durante el desempeño del trabajo como las enfermedades que se contraen o desarrollan como consecuencia del tipo de trabajo realizado. Además, en las entidades de seguro libre es donde suelen excluirse las enfermedades crónicas, no en la Seguridad Social."},{"id":22,"tema":"1. Evolución del Sistema sanitario","subtema":"1.1. La Seguridad Social en España","enunciado":"Dos trabajadores sufren exactamente la misma lesión de muñeca: uno jugando un partido de baloncesto el domingo y otro al caer desde un andamio mientras pintaba una fachada en horario laboral. ¿Qué diferencia conceptual establece la Seguridad Social entre ambos casos?","opciones":{"A":"El primer caso no da derecho a asistencia sanitaria pública, mientras que el segundo recibe cobertura del SEPE.","B":"El primero constituye una contingencia común y el segundo una contingencia profesional al derivar del puesto de trabajo.","C":"El primero se incluye en los servicios sociales complementarios y el segundo en las prestaciones no contributivas.","D":"Ambos casos se consideran contingencias comunes salvo que la lesión provoque una invalidez permanente absoluta."},"correcta":"B","explicacion":"La diferencia clave entre contingencia común y contingencia profesional no radica en el órgano afectado ni en la gravedad, sino en la relación directa con el puesto de trabajo desempeñado: el accidente fuera del trabajo es contingencia común y el accidente laboral durante el desempeño profesional es contingencia profesional."},{"id":23,"tema":"1. Evolución del Sistema sanitario","subtema":"1.1. La Seguridad Social en España","enunciado":"En un examen sobre la implantación de la Seguridad Social en España, un alumno escribe que «las cotizaciones dependen del riesgo médico individual de cada trabajador y se gestionan en cajas separadas por provincias». ¿Qué dos errores contiene esa afirmación?","opciones":{"A":"Que la afiliación tiene carácter voluntario y que el Estado prescinde de aportar mediante Presupuestos Generales.","B":"Que las cuotas recaen en exclusiva sobre el empresario y que no existen regímenes especiales diferenciados.","C":"Que la aportación se calcula según el historial clínico familiar y que las mutuas asumen el control financiero total.","D":"Que se cotiza en función de la renta percibida y que rige un sistema de caja única solidaria."},"correcta":"D","explicacion":"La Ley General de Seguridad Social establece que las cotizaciones obligatorias de trabajadores y empresarios se calculan en función de la renta (no del riesgo médico individual) y se integran en un sistema de caja única como criterio de solidaridad financiera, en lugar de cajas provinciales aisladas."},{"id":24,"tema":"1. Evolución del Sistema sanitario","subtema":"1.1. La Seguridad Social en España","enunciado":"Durante el periodo comprendido entre 1900 y 1963 en España, antes de publicarse la Ley General de Seguridad Social de 1974, ¿cómo evolucionaron los mecanismos de aseguramiento para la población?","opciones":{"A":"Se implantó directamente la asistencia universal gratuita financiada por impuestos generales en todas las provincias.","B":"Se sustituyeron las cofradías gremiales por pólizas privadas mercantiles de contratación libre sin control estatal.","C":"Se crearon seguros inicialmente voluntarios y luego obligatorios, junto con las instituciones encargadas de gestionarlos.","D":"Se delegó la atención sanitaria ordinaria en los ayuntamientos bajo el modelo atlántico de prestaciones únicas."},"correcta":"C","explicacion":"El desarrollo español del modelo continental fue tardío y progresivo: entre 1900 y 1963 se fueron creando distintos seguros (primero voluntarios y más tarde obligatorios, como los de accidentes de tráfico o enfermedad) y las instituciones gestoras, hasta promulgarse la Ley General de Seguridad Social en 1974."},{"id":25,"tema":"1. Evolución del Sistema sanitario","subtema":"1.1. Acción protectora de la Seguridad Social","enunciado":"Una persona asegurada acude por maternidad y posteriormente precisa rehabilitación para su recuperación profesional tras una intervención. Según la articulación de la acción protectora de la Ley General de Seguridad Social, ¿en qué área se encuadran ambas actuaciones?","opciones":{"A":"En el área de asistencia sanitaria, junto con la atención por enfermedad común o profesional y por accidente.","B":"En el área de prestaciones económicas, junto con la asignación por hijos a cargo y la pensión de jubilación.","C":"En el área de servicios sociales complementarios, dirigida a personas mayores y colectivos en situación de marginación.","D":"En el ámbito exclusivo de las prestaciones no contributivas gestionadas por los ayuntamientos de cada localidad."},"correcta":"A","explicacion":"La acción protectora de la Seguridad Social se articula en tres áreas: asistencia sanitaria (enfermedad común o profesional, accidente sea o no de trabajo, maternidad y recuperación profesional), prestaciones económicas y servicios sociales complementarios."},{"id":26,"tema":"1. Evolución del Sistema sanitario","subtema":"1.1. Acción protectora de la Seguridad Social","enunciado":"Un padre trabajador solicita una ayuda económica por hijo a cargo tras el nacimiento de su hija y consulta también los supuestos de muerte y supervivencia. ¿En qué bloque de la acción protectora figuran estas medidas?","opciones":{"A":"En el bloque de asistencia sanitaria integral, al derivar de un proceso de maternidad en el ámbito familiar.","B":"En el bloque de servicios sociales complementarios, por estar orientadas al apoyo de la tercera edad y la discapacidad.","C":"En el bloque de prestaciones económicas, junto con la incapacidad laboral, la invalidez y la jubilación.","D":"En el bloque de cobertura sanitaria privada concertada, destinado a compensar gastos clínicos extraordinarios."},"correcta":"C","explicacion":"Dentro del área de prestaciones económicas de la acción protectora de la Seguridad Social se incluyen la incapacidad laboral, la invalidez, la jubilación, muerte y supervivencia, la asignación por hijos a cargo y el complemento de protección familiar por hijo a cargo."},{"id":27,"tema":"1. Evolución del Sistema sanitario","subtema":"1.1. Acción protectora de la Seguridad Social","enunciado":"Un trabajador sufre un accidente grave que le impide trabajar temporalmente y exige cuidados especializados costosos en su domicilio. ¿Por qué destaca el tema las situaciones de enfermedad y accidente dentro de las prestaciones sanitarias?","opciones":{"A":"Porque solo estas dos contingencias quedan cubiertas sin periodo de carencia en las entidades de seguro libre.","B":"Porque generan un doble efecto económico: pérdida de ingresos según su gravedad y posible aumento de gastos por cuidados.","C":"Porque son las únicas situaciones cuya atención corresponde directamente a los servicios sociales complementarios municipales.","D":"Porque permiten al asegurado recibir simultáneamente una indemnización económica privada y el reembolso de tasas locales."},"correcta":"B","explicacion":"El documento destaca la enfermedad y el accidente por su doble efecto económico sobre el trabajador y su familia: suponen una pérdida de ingresos en función de la gravedad de la situación y un posible incremento de gastos debido a los cuidados especiales necesarios."},{"id":28,"tema":"1. Evolución del Sistema sanitario","subtema":"1.1. Acción protectora de la Seguridad Social","enunciado":"Un asegurado precisa tratamiento médico continuado durante varios años por una patología compleja y teme agotar un plazo máximo de cobertura en la Seguridad Social. ¿Qué regla rige respecto a la duración de la asistencia sanitaria?","opciones":{"A":"Se concede por un máximo anual renovable mientras subsistan cotizaciones activas en la Tesorería General.","B":"Se limita al periodo inicial de hospitalización urgente hasta el alta médica hospitalaria en los casos graves.","C":"Se interrumpe tras superar el plazo equivalente al periodo de carencia fijado en el régimen especial correspondiente.","D":"Se presta al asegurado desde el momento en que se solicita y sin límite de tiempo, siempre que sea precisa."},"correcta":"D","explicacion":"Según recoge explícitamente el tema, la asistencia sanitaria en el sistema de Seguridad Social se presta al asegurado desde que se solicita y sin límite de tiempo, siempre que sea precisa."},{"id":29,"tema":"1. Evolución del Sistema sanitario","subtema":"1.1. Acción protectora de la Seguridad Social","enunciado":"¿Qué colectivos son los destinatarios específicos del área de «servicios sociales complementarios» dentro de la acción protectora de la Ley General de Seguridad Social?","opciones":{"A":"Trabajadores por cuenta ajena de la industria, trabajadores agrarios y profesionales del sector marítimo pesquero.","B":"Funcionarios de la Administración del Estado, miembros de la judicatura y personal de las Fuerzas Armadas.","C":"Personas con discapacidad física o psíquica, tercera edad y sectores de población en situación de marginación.","D":"Asegurados afectados por accidente laboral en horario de trabajo y personas en situación de desempleo involuntario."},"correcta":"C","explicacion":"La tabla de la acción protectora de la Seguridad Social especifica que los servicios sociales complementarios se dirigen a minusválidos físicos y psíquicos (personas con discapacidad física y psíquica), tercera edad y población marginada."},{"id":30,"tema":"1. Evolución del Sistema sanitario","subtema":"1.1. Acción protectora de la Seguridad Social","enunciado":"Al revisar la lista de áreas de la acción protectora de la Seguridad Social, ¿cuál de los siguientes emparejamientos entre área y contenido concreto es correcto?","opciones":{"A":"Asistencia sanitaria — pensión de jubilación y complemento de protección familiar por hijo a cargo.","B":"Asistencia sanitaria — recuperación profesional y atención por accidente sea o no de trabajo.","C":"Prestaciones económicas — servicios de promoción de la salud para población marginada y tercera edad.","D":"Servicios sociales complementarios — reconocimiento de incapacidad laboral y cobertura por maternidad."},"correcta":"B","explicacion":"La recuperación profesional y la atención por accidente (sea o no de trabajo) forman parte del área de asistencia sanitaria. La jubilación y las ayudas por hijo a cargo corresponden a prestaciones económicas, mientras que la tercera edad y la población marginada pertenecen a servicios sociales complementarios."},{"id":31,"tema":"1. Evolución del Sistema sanitario","subtema":"1.1. Entidades gestoras de la Seguridad Social","enunciado":"Una trabajadora solicita el reconocimiento de su prestación por maternidad y la gestión de su incapacidad temporal, mientras que un estudiante tramita el seguro escolar. ¿Qué entidad gestora de la Seguridad Social asume estas funciones?","opciones":{"A":"La Tesorería General de la Seguridad Social (TGSS), responsable de administrar las prestaciones contributivas familiares.","B":"El Instituto Nacional de Gestión Sanitaria (INGESA), encargado de reconocer el derecho a asistencia en todas las autonomías.","C":"El Servicio Público de Empleo Estatal (SEPE), competente en las situaciones de suspensión temporal del contrato laboral.","D":"El Instituto Nacional de la Seguridad Social (INSS), encargado de las prestaciones económicas y del reconocimiento de la asistencia."},"correcta":"D","explicacion":"El Instituto Nacional de la Seguridad Social (INSS) gestiona y administra las prestaciones económicas y reconoce el derecho a la asistencia sanitaria; además, gestiona y controla prestaciones como jubilación, incapacidad permanente o temporal, maternidad y seguro escolar."},{"id":32,"tema":"1. Evolución del Sistema sanitario","subtema":"1.1. Entidades gestoras de la Seguridad Social","enunciado":"Un médico residente consulta qué organismo público gestiona directamente la asistencia sanitaria del Sistema Nacional de Salud en Ceuta y Melilla, dado que en comunidades como Madrid o Cataluña existen organismos propios. ¿Qué entidad desempeña esa labor?","opciones":{"A":"El Instituto Nacional de Gestión Sanitaria (INGESA), que asume las prestaciones sanitarias en Ceuta y Melilla.","B":"El Instituto Social de la Marina (ISM), que administra la atención hospitalaria en los territorios costeros españoles.","C":"El Instituto de Mayores y Servicios Sociales (IMSERSO), que coordina la asistencia en las ciudades sin servicio regional.","D":"El Consejo Interterritorial del Sistema Nacional de Salud (CISNS), que sustituye a las consejerías en la gestión directa."},"correcta":"A","explicacion":"Mientras la mayor parte de la gestión sanitaria está transferida a las comunidades autónomas a través de sus organismos gestores (como SERMAS, CatSalut, SERGAS o SACYL), el INGESA se encarga de la gestión sanitaria y las prestaciones en el ámbito territorial de Ceuta y Melilla."},{"id":33,"tema":"1. Evolución del Sistema sanitario","subtema":"1.1. Entidades gestoras de la Seguridad Social","enunciado":"Una persona mayor sin recursos suficientes solicita una pensión no contributiva y acceso a programas de servicios sociales dirigidos a colectivos vulnerables. ¿A qué entidad gestora de la Seguridad Social corresponde su tramitación?","opciones":{"A":"Al Instituto Nacional de la Seguridad Social (INSS), por ser el organismo que controla todas las pensiones de jubilación.","B":"A la Tesorería General de la Seguridad Social (TGSS), por centralizar los recursos destinados a programas asistenciales.","C":"Al Instituto de Mayores y Servicios Sociales (IMSERSO), encargado de servicios sociales y prestaciones no contributivas.","D":"Al Instituto Nacional de Gestión Sanitaria (INGESA), responsable de las prestaciones complementarias de ámbito estatal."},"correcta":"C","explicacion":"El Instituto de Mayores y Servicios Sociales (IMSERSO) es la entidad encargada de la gestión de los servicios sociales, de las prestaciones no contributivas y de las prestaciones complementarias hacia los colectivos de la tercera edad, personas con discapacidad y población marginada."},{"id":34,"tema":"1. Evolución del Sistema sanitario","subtema":"1.1. Entidades gestoras de la Seguridad Social","enunciado":"Tras finalizar su contrato temporal, un operario acude a tramitar su prestación por desempleo. ¿Qué organismo específico del entramado de entidades gestoras tiene atribuida esa competencia?","opciones":{"A":"El Instituto Nacional de la Seguridad Social (INSS), al tratarse de una prestación económica derivada de cotización previa.","B":"El Servicio Público de Empleo Estatal (SEPE), entidad encargada de gestionar las prestaciones por desempleo.","C":"La Tesorería General de la Seguridad Social (TGSS), organismo que controla las altas, bajas y cuotas de los trabajadores.","D":"El Instituto de Mayores y Servicios Sociales (IMSERSO), encargado de las ayudas complementarias por falta de ingresos."},"correcta":"B","explicacion":"El Servicio Público de Empleo Estatal (SEPE) es la entidad encargada específicamente de la gestión de las prestaciones por desempleo, mientras que el INSS gestiona jubilación, incapacidad, maternidad y seguro escolar, y la TGSS administra las cotizaciones y afiliaciones."},{"id":35,"tema":"1. Evolución del Sistema sanitario","subtema":"1.1. Entidades gestoras de la Seguridad Social","enunciado":"Una patrona de pesca y un marinero consultan dónde deben gestionar su asistencia sanitaria específica, el reconocimiento de prestaciones de su régimen especial y los programas de formación profesional del sector marítimo. ¿Qué entidad reúne estas competencias?","opciones":{"A":"El Servicio Público de Empleo Estatal (SEPE), que integra todas las acciones de empleo y formación por sectores.","B":"El Instituto Nacional de Gestión Sanitaria (INGESA), que atiende los servicios de salud en puertos y enclaves estatales.","C":"El Instituto Nacional de la Seguridad Social (INSS), que reconoce en exclusiva el derecho sanitario de todos los regímenes.","D":"El Instituto Social de la Marina (ISM), que administra prestaciones, asistencia sanitaria y formación del sector del mar."},"correcta":"D","explicacion":"El Instituto Social de la Marina (ISM) gestiona, administra y reconoce el derecho a las prestaciones del régimen especial de los trabajadores del mar y su asistencia sanitaria (y la de sus beneficiarios), además de ocuparse del empleo, promoción y formación del sector en colaboración con los servicios de empleo."},{"id":36,"tema":"1. Evolución del Sistema sanitario","subtema":"1.1. Entidades gestoras de la Seguridad Social","enunciado":"Una empresa recién constituida debe inscribirse en el sistema, tramitar el alta de sus diez primeros empleados y liquidar mensualmente las cuotas correspondientes. ¿Qué organismo de la Seguridad Social realiza estas tareas?","opciones":{"A":"La Tesorería General de la Seguridad Social (TGSS), que unifica los recursos financieros, afiliaciones y cotizaciones.","B":"El Instituto Nacional de la Seguridad Social (INSS), que supervisa las aportaciones vinculadas a futuras pensiones.","C":"El Servicio Público de Empleo Estatal (SEPE), que registra las altas contractuales y las cuotas de formación profesional.","D":"El Ministerio de Sanidad, Consumo y Bienestar Social, que centraliza el presupuesto sanitario y las cotizaciones obreras."},"correcta":"A","explicacion":"La Tesorería General de la Seguridad Social (TGSS) es el organismo encargado de unificar todos los recursos financieros, realizando la inscripción de empresas, la afiliación (altas y bajas de los trabajadores) y la gestión y control de cotizaciones, cuotas y demás recursos de financiación."},{"id":37,"tema":"1. Evolución del Sistema sanitario","subtema":"1.1. Entidades gestoras de la Seguridad Social","enunciado":"Un estudiante de documentación sanitaria compara las funciones del INSS y de la TGSS para evitar confusiones en un caso práctico. ¿Qué criterio permite distinguir claramente ambos organismos?","opciones":{"A":"El INSS gestiona el empleo de los trabajadores del mar y la TGSS tramita las pensiones no contributivas de mayores.","B":"El INSS administra prestaciones económicas y reconoce el derecho sanitario, mientras la TGSS gestiona afiliaciones y recursos financieros.","C":"El INSS coordina los servicios regionales de salud autonómicos y la TGSS presta asistencia directa en Ceuta y Melilla.","D":"El INSS gestiona exclusivamente las prestaciones por desempleo y la TGSS reconoce los subsidios de maternidad e invalidez."},"correcta":"B","explicacion":"El INSS gestiona las prestaciones económicas (jubilación, incapacidad, maternidad, seguro escolar) y reconoce el derecho a la asistencia sanitaria; la TGSS, por su parte, unifica los recursos financieros, inscribe empresas, afilia trabajadores (altas y bajas) y controla cotizaciones y cuotas."},{"id":38,"tema":"1. Evolución del Sistema sanitario","subtema":"1.1. Entidades gestoras de la Seguridad Social","enunciado":"Según el tema, ¿bajo la dirección, vigilancia y tutela de qué departamentos ministeriales se realiza la gestión de la Seguridad Social a través de sus entidades gestoras?","opciones":{"A":"Del Ministerio de Hacienda y Función Pública y a través del Ministerio de Política Territorial y Administración Local.","B":"Del Ministerio de Economía y Empresa y a través del Ministerio de Justicia para los regímenes especiales públicos.","C":"Del Ministerio de Trabajo, Migraciones y Seguridad Social y a través del Ministerio de Sanidad, Consumo y Bienestar Social.","D":"Del Ministerio del Interior y a través de las distintas consejerías autonómicas integradas en el Consejo Interterritorial."},"correcta":"C","explicacion":"El tema indica literalmente que la gestión de la Seguridad Social se hace bajo la dirección, vigilancia y tutela del Ministerio de Trabajo, Migraciones y Seguridad Social y a través del Ministerio de Sanidad, Consumo y Bienestar Social mediante las distintas entidades gestoras."},{"id":39,"tema":"1. Evolución del Sistema sanitario","subtema":"1.1. Entidades gestoras de la Seguridad Social","enunciado":"Un ciudadano residente en Burgos solicita asistencia médica pública y consulta si le corresponde atenderse a través de INGESA. ¿Por qué la respuesta correcta es negativa?","opciones":{"A":"Porque INGESA atiende exclusivamente a los trabajadores encuadrados en el régimen especial del mar y sus familiares.","B":"Porque INGESA solo gestiona prestaciones económicas de jubilación e incapacidad permanente en la mitad norte peninsular.","C":"Porque en Castilla y León las prestaciones sanitarias dependen directamente de la Tesorería General de la Seguridad Social.","D":"Porque la gestión sanitaria está transferida a la comunidad autónoma (SACYL) y INGESA actúa en Ceuta y Melilla."},"correcta":"D","explicacion":"La mayor parte de la gestión sanitaria está transferida a las comunidades autónomas, que cuentan con sus propios organismos gestores (como SACYL en Castilla y León, SERMAS, CatSalut o SERGAS), quedando INGESA circunscrita a Ceuta y Melilla."},{"id":40,"tema":"1. Evolución del Sistema sanitario","subtema":"1.1. Entidades gestoras de la Seguridad Social","enunciado":"Un trabajador sufre un accidente fuera del trabajo y requiere una baja laboral remunerada. Además del seguimiento médico por su servicio autonómico de salud, ¿qué pareja de entidades participa respectivamente en su alta laboral previa y en el control de su incapacidad temporal?","opciones":{"A":"La TGSS en el registro de su afiliación y cotización, y el INSS en la gestión y control de la incapacidad temporal.","B":"El SEPE en la tramitación de su baja laboral y el IMSERSO en el pago de la prestación contributiva temporal.","C":"El ISM en la gestión económica del accidente común y el INGESA en el reconocimiento del derecho sanitario en España.","D":"El Consejo de Salud de Área en el abono de la prestación económica y la empresa colaboradora en el alta médica."},"correcta":"A","explicacion":"La Tesorería General de la Seguridad Social (TGSS) realiza la afiliación (altas y bajas de los trabajadores) y controla las cotizaciones, mientras que el Instituto Nacional de la Seguridad Social (INSS) gestiona y controla la prestación económica por incapacidad temporal o permanente."},{"id":41,"tema":"1. Evolución del Sistema sanitario","subtema":"1.1. Entidades gestoras de la Seguridad Social","enunciado":"¿Cuál de las siguientes situaciones explica por qué el sistema español requiere diversas entidades gestoras especializadas como INSS, TGSS, SEPE, IMSERSO, INGESA e ISM?","opciones":{"A":"La prohibición constitucional de unificar las cotizaciones empresariales y las aportaciones estatales en un mismo presupuesto.","B":"La existencia de un régimen único de seguros privados voluntarios que impide la gestión pública directa de las pensiones.","C":"La complejidad del sistema de Seguridad Social, que hace necesarias distintas entidades para garantizar su buen funcionamiento.","D":"La obligación impuesta por la Conferencia de Alma-Ata de separar cada prestación económica en un organismo independiente."},"correcta":"C","explicacion":"Al inicio del apartado de Entidades gestoras se señala explícitamente que dichas entidades son necesarias debido a la complejidad del sistema y para garantizar el buen funcionamiento de la Seguridad Social."},{"id":42,"tema":"1. Evolución del Sistema sanitario","subtema":"1.1. Entidades gestoras de la Seguridad Social","enunciado":"En una tabla resumen de clase, un compañero asigna al IMSERSO el control de las cuotas empresariales, al SEPE las pensiones de jubilación y al ISM la asistencia sanitaria de los pescadores. ¿Qué corrección debes hacerle?","opciones":{"A":"El ISM solo gestiona prestaciones no contributivas y el SEPE se limita a la afiliación inicial de empresas.","B":"La afirmación sobre el ISM es correcta, pero las cuotas corresponden a la TGSS y las jubilaciones al INSS.","C":"Las tres asignaciones son erróneas porque todas esas funciones recaen conjuntamente sobre INGESA en todo el territorio.","D":"El IMSERSO sí controla las cuotas empresariales, mientras que las jubilaciones y el sector marítimo dependen del SEPE."},"correcta":"B","explicacion":"Es correcto que el ISM gestiona las prestaciones y asistencia sanitaria de los trabajadores del mar; sin embargo, la gestión y control de cotizaciones y cuotas corresponde a la TGSS (no al IMSERSO, que lleva servicios sociales y prestaciones no contributivas), y la jubilación la gestiona el INSS (no el SEPE, que lleva el desempleo)."},{"id":43,"tema":"2. Sistema Nacional de Salud (SNS)","subtema":"2.1. Concepto, Alma-Ata y Marco normativo","enunciado":"Una estudiante resume la transición ocurrida en el sistema sanitario español en 1986. ¿Qué cambio estructural clave introdujo la Ley General de Sanidad (Ley 14/1986) respecto al modelo anterior?","opciones":{"A":"Sustituyó el modelo de Seguridad Social por un Sistema Nacional de Salud universal financiado con impuestos generales.","B":"Sustituyó las consejerías autonómicas por un organismo central único financiado exclusivamente mediante cuotas obreras.","C":"Restringió la cobertura sanitaria pública a los trabajadores afiliados al régimen general y sus familiares directos.","D":"Transformó los hospitales públicos en entidades mercantiles privadas concertadas bajo supervisión de los ayuntamientos."},"correcta":"A","explicacion":"La Ley General de Sanidad (14/1986, de 25 de abril) hizo posible pasar del modelo clásico de Seguridad Social al actual modelo de Sistema Nacional de Salud, que cubre prácticamente a toda la población y cuya financiación corre a cargo de impuestos generales."},{"id":44,"tema":"2. Sistema Nacional de Salud (SNS)","subtema":"2.1. Concepto, Alma-Ata y Marco normativo","enunciado":"¿Cómo define el tema la composición institucional del Sistema Nacional de Salud (SNS) español en relación con el Estado y las comunidades autónomas?","opciones":{"A":"Como una red integrada exclusivamente por hospitales estatales dependientes del Ministerio de Trabajo y Migraciones.","B":"Como una federación voluntaria de mutuas patronales y compañías de seguro libre coordinadas por cada ayuntamiento.","C":"Como la agrupación de centros de atención primaria municipales independientes de las consejerías de sanidad regionales.","D":"Como el conjunto de servicios de salud de la Administración del Estado y de los servicios de salud autonómicos."},"correcta":"D","explicacion":"El SNS se configura como el conjunto de servicios de salud de la Administración del Estado y de los servicios de salud de las comunidades autónomas (servicios regionales de salud, SRS), integrando todas las funciones y prestaciones sanitarias."},{"id":45,"tema":"2. Sistema Nacional de Salud (SNS)","subtema":"2.1. Concepto, Alma-Ata y Marco normativo","enunciado":"En una comarca rural, los servicios de salud autonómicos no disponen de suficientes equipos propios para realizar determinadas pruebas diagnósticas de alta tecnología. De acuerdo con el concepto de SNS, ¿cómo pueden garantizar esa prestación?","opciones":{"A":"Derivando obligatoriamente al paciente al Instituto Social de la Marina para que tramite un reembolso privado.","B":"Mediante prestación concertada con servicios privados cuando los medios propios del servicio de salud resulten insuficientes.","C":"Imponiendo al usuario la contratación previa de una póliza de seguro libre con periodo de carencia reducido.","D":"Trasladando la competencia presupuestaria al ayuntamiento local para que adquiera equipamiento hospitalario propio."},"correcta":"B","explicacion":"El tema especifica que el SNS está formado por los servicios de salud de las CC.AA., que ofrecen servicios sanitarios a través de sus propios medios o, si estos son insuficientes, a través de prestación concertada con servicios privados."},{"id":46,"tema":"2. Sistema Nacional de Salud (SNS)","subtema":"2.1. Concepto, Alma-Ata y Marco normativo","enunciado":"Un seminario internacional analiza el origen de los modernos Sistemas Nacionales de Salud tras la Conferencia de Alma-Ata de 1978. ¿Qué diagnóstico y qué propuesta central surgieron de aquella reunión celebrada en Kazajistán?","opciones":{"A":"Los sistemas previos eran demasiado descentralizados y debían concentrarse exclusivamente en grandes hospitales urbanos.","B":"Los seguros privados resultaban insuficientes y debían sustituirse por cofradías gremiales de ámbito municipal.","C":"La asistencia hospitalaria especializada debía absorber toda la financiación estatal reduciendo los centros comunitarios.","D":"Los sistemas previos eran costosos e ineficaces y la Atención Primaria dirigida a las comunidades debía ser su eje."},"correcta":"D","explicacion":"La Conferencia de Alma-Ata (1978) abordó los problemas de los sistemas de salud desarrollados hasta ese momento, que resultaban costosos e ineficaces, y concluyó que la Atención Primaria de la salud, dirigida a las comunidades, debe ser el eje de los nuevos sistemas sanitarios."},{"id":47,"tema":"2. Sistema Nacional de Salud (SNS)","subtema":"2.1. Concepto, Alma-Ata y Marco normativo","enunciado":"Al estudiar el marco normativo del SNS, un alumno afirma que la Constitución Española de 1978 diseñó al detalle las áreas de salud y las gerencias hospitalarias. ¿Por qué esa afirmación es imprecisa?","opciones":{"A":"Porque la Constitución dejó la regulación del derecho a la salud en manos exclusivas de los estatutos municipales.","B":"Porque no abordó cambios en la organización sanitaria, aunque sí promovió la transformación y reconoció el derecho.","C":"Porque remitió la creación del Sistema Nacional de Salud a la Ley de Cohesión y Calidad aprobada en 2003.","D":"Porque limitó el mandato sanitario de los poderes públicos al sostenimiento de las entidades gestoras privadas."},"correcta":"B","explicacion":"En 1978 se aprueba la Constitución que, aunque no aborda cambios en la organización sanitaria, sí establece las bases legislativas que permiten y promueven la transformación del modelo sanitario, reconociendo en su artículo 43 el derecho a la protección de la salud."},{"id":48,"tema":"2. Sistema Nacional de Salud (SNS)","subtema":"2.1. Concepto, Alma-Ata y Marco normativo","enunciado":"Un jurista consulta el texto constitucional español para fundamentar tanto el derecho universal a la protección de la salud como el mantenimiento de un régimen público de Seguridad Social. ¿Qué dos artículos debe citar respectivamente?","opciones":{"A":"El artículo 79 para el derecho a la protección de la salud y el artículo 47 para el régimen público de Seguridad Social.","B":"El artículo 42 para la protección sanitaria de los ciudadanos y el artículo 102 para la acción protectora pública.","C":"El artículo 43 para el derecho a la protección de la salud y el artículo 41 para el régimen de Seguridad Social.","D":"El artículo 3 para el acceso universal sanitario y el artículo 14 para la coordinación de las administraciones públicas."},"correcta":"C","explicacion":"El artículo 43 de la Constitución reconoce el derecho de todos los ciudadanos a la protección de la salud y encarga a los poderes públicos tomar medidas para satisfacerlo; por su parte, el Título I, capítulo 3.º, artículo 41 establece que los poderes públicos mantendrán un régimen de Seguridad Social para todos los ciudadanos."},{"id":49,"tema":"2. Sistema Nacional de Salud (SNS)","subtema":"2.1. Concepto, Alma-Ata y Marco normativo","enunciado":"¿Qué tres normas conforman explícitamente el «Marco Normativo» del Sistema Nacional de Salud según el esquema organizativo del tema?","opciones":{"A":"La Ley General de Seguridad Social, el Real Decreto-ley 16/2012 y la Ley de Autonomía del Paciente.","B":"El Tratado de Alma-Ata, la Ley de Bases Municipales y el Real Decreto Legislativo de Mutuas Colaboradoras.","C":"La Ley de Presupuestos Generales, los Estatutos de Autonomía y los Reglamentos de Entidades Gestoras.","D":"La Constitución Española, la Ley General de Sanidad y la Ley de Cohesión y Calidad del SNS."},"correcta":"D","explicacion":"El diagrama del apartado 2.1 «Marco normativo» señala exactamente tres pilares: Constitución Española (CE, 1978), Ley General de Sanidad (LGS, Ley 14/1986) y Ley de Cohesión y Calidad (LCC, Ley 16/2003)."},{"id":50,"tema":"2. Sistema Nacional de Salud (SNS)","subtema":"2.1. Concepto, Alma-Ata y Marco normativo","enunciado":"Según la redacción literal del objetivo de la Ley General de Sanidad (Ley 14/1986) recogida en el tema, ¿a quiénes busca hacer efectivo el derecho a la protección de la salud reconocido en el artículo 43
